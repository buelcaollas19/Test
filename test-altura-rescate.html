[7,"Según el orden en que el apartado 8.2 enumera las tareas de la «División de las operaciones», ¿qué secuencia parcial es la correcta?",["Análisis de los riesgos → control de los riesgos → selección del acceso → decidir vía de evacuación → división de los diferentes trabajos → acceso al accidentado → montaje de vía de evacuación.","Análisis de los riesgos → control de los riesgos → selección del acceso → decidir vía de evacuación → división de los diferentes trabajos → montaje de vía de evacuación → acceso al accidentado.","Análisis de los riesgos → selección del acceso → control de los riesgos → decidir vía de evacuación → división de los diferentes trabajos → acceso al accidentado → montaje de vía de evacuación.","Análisis de los riesgos → control de los riesgos → selección del acceso → división de los diferentes trabajos → decidir vía de evacuación → acceso al accidentado → montaje de vía de evacuación."],"8.2 sitúa, tras la selección de los medios y del material: análisis de los riesgos, control de los riesgos, selección del acceso, decidir vía de evacuación, división de los diferentes trabajos, acceso al accidentado y montaje de vía de evacuación. Una secuencia adelanta el «montaje de vía de evacuación» al «acceso al accidentado»; otra coloca la «selección del acceso» antes del «control de los riesgos»; y la tercera pone la «división de los diferentes trabajos» antes de «decidir vía de evacuación»."],
[7,"Concluida la evacuación de un accidentado, el jefe de la intervención afirma: «**No** es falso que el recuento del personal **no** preceda a la recogida de equipos». ¿Qué secuencia final, a partir de la evacuación del accidentado, **NO** contradice ni esa afirmación ni el orden del apartado 8.2?",["Evacuación del accidentado → recogida de equipos → recuento del personal → revisión del material utilizado → evaluación en grupo de la intervención.","Evacuación del accidentado → recuento del personal → recogida de equipos → revisión del material utilizado → evaluación en grupo de la intervención.","Evacuación del accidentado → recogida de equipos → revisión del material utilizado → recuento del personal → evaluación en grupo de la intervención.","Evacuación del accidentado → recogida de equipos → recuento del personal → evaluación en grupo de la intervención → revisión del material utilizado."],"«No es falso que X» equivale a afirmar X: el recuento del personal NO va antes de la recogida de equipos. 8.2 termina así: evacuación del accidentado, recogida de equipos, recuento del personal, revisión del material utilizado y evaluación en grupo de la intervención. La secuencia que pone el «recuento del personal» antes de la «recogida de equipos» contradice la afirmación y la lista; las que adelantan la «revisión del material» al recuento o colocan la «evaluación en grupo» antes de la revisión respetan la afirmación, pero no el orden de 8.2."],
[7,"Un trabajador accidentado se encuentra en un plano elevado superior y hay que decidir la maniobra (8.3). ¿Cuál de las siguientes afirmaciones **NO** es incorrecta?",["Siempre que se pueda se descenderá, porque se trabaja a favor de la gravedad, se facilita el acceso y la recogida a los medios de evacuación y se necesita menos personal. El freno, como un ID, va en el anclaje central del SAS y un rescatador guía el descenso o, si no es posible, se montan líneas de guiado.","Siempre que se pueda se descenderá, porque se trabaja a favor de la gravedad y se facilita el acceso y la recogida a los medios de evacuación, aunque se necesite más personal. El freno, como un ID, va en el anclaje central del SAS y un rescatador guía el descenso o, si no es posible, se montan líneas de guiado.","Siempre que se pueda se descenderá, porque se trabaja a favor de la gravedad, se facilita el acceso y la recogida a los medios de evacuación y se necesita menos personal. El freno, como un ID, va en el anclaje central del SAS y se montan líneas de guiado o, si no es posible, un rescatador guía el descenso.","Siempre que se pueda se descenderá, porque se trabaja a favor de la gravedad, se facilita el acceso y la recogida a los medios de evacuación y se necesita menos personal. El freno, como un ID, va en el arnés del rescatador que acompaña a la carga y un rescatador guía el descenso o, si no es posible, se montan líneas de guiado."],"8.3: «en principio intentaremos realizar, siempre que se pueda, maniobras de descenso», porque el trabajo es a favor de la gravedad y facilita el acceso y la recogida a los medios de evacuación, y «se necesitará menos personal». Se instala un SAS adecuado con un freno, como un ID, «en el anclaje central del SAS»; un rescatador guía el descenso y, si no es posible, se montan líneas de guiado. Fallan la que dice «aunque se necesite más personal», la que invierte la prioridad entre líneas de guiado y rescatador guía, y la que coloca el freno «en el arnés del rescatador»."],
[7,"En el apartado 8.3, ¿qué correspondencia entre la posición del accidentado y la maniobra propuesta es la correcta?",["Plano elevado superior: descenso asistido con freno de carga desde la reunión. Plano inferior: elevación con polipastos con polifrenos. Colgado sobre cuerda al vacío en plano superior: descenso por transferencia de carga a otra instalación.","Plano elevado superior: descenso por transferencia de carga a otra instalación. Plano inferior: elevación con polipastos con polifrenos. Colgado sobre cuerda al vacío en plano superior: descenso asistido con freno de carga desde la reunión.","Plano elevado superior: descenso asistido con freno de carga desde la reunión. Plano inferior: descenso por transferencia de carga a otra instalación. Colgado sobre cuerda al vacío en plano superior: elevación con polipastos con polifrenos.","Plano elevado superior: descenso asistido con freno de carga desde la reunión. Plano inferior: elevación con polipastos con polifrenos. Colgado sobre cuerda al vacío en plano superior: elevación hasta la reunión con polipastos con polifrenos."],"8.3 asocia el accidentado en plano elevado superior a maniobras de descenso «asistido con freno de carga desde la reunión»; el accidentado en plano inferior, a una maniobra de elevación con «polipastos con polifrenos»; y el accidentado colgando sobre cuerda al vacío en plano superior, a una maniobra de descenso «por transferencia de carga a otra instalación». Una opción intercambia las maniobras del plano superior y del colgado; otra asigna al plano inferior la transferencia de carga; la última convierte el caso del colgado en una «elevación hasta la reunión», cuando la maniobra es de descenso y el polipasto solo realiza una pequeña elevación para desbloquear la cuerda."],
[7,"Respecto a las situaciones de rescate en altura en instalaciones industriales descritas en el apartado 8.1, ¿cuál de las siguientes afirmaciones es correcta?",["Se citan, entre otras, tejados y cubiertas, plataformas elevadas, torres, grúas y estructuras metálicas, puentes y viaductos, y pozos y espacios confinados; además de las medidas contra la caída de altura, los otros riesgos asociados del entorno deben valorarse y controlarse de igual forma.","Se citan, entre otras, tejados y cubiertas, plataformas elevadas, torres, grúas y estructuras metálicas, puentes y viaductos, y pozos y espacios confinados; bastan las medidas contra la caída de altura, porque los otros riesgos asociados del entorno se valoran una vez finalizado el rescate.","Se citan, entre otras, tejados y cubiertas, plataformas elevadas, torres, grúas y estructuras metálicas, y puentes y viaductos, pero no los pozos y espacios confinados; además de las medidas contra la caída de altura, los otros riesgos asociados del entorno deben valorarse y controlarse de igual forma.","Se citan, entre otras, tejados y cubiertas, plataformas elevadas, torres, grúas y estructuras metálicas, puentes y viaductos, y pozos y espacios confinados; además de las medidas contra la caída de altura, los otros riesgos asociados del entorno deben valorarse, aunque no es preciso controlarlos."],"8.1 enumera tejados y cubiertas, plataformas elevadas, torres, grúas y estructuras metálicas, puentes y viaductos, y pozos y espacios confinados. Añade que no solo hay que disponer de medidas de seguridad contra la caída de altura: «en todo momento» hay que valorar los otros riesgos asociados del entorno «y controlarlos de igual forma». Fallan la que afirma que «bastan las medidas contra la caída de altura», la que excluye «los pozos y espacios confinados» y la que dice que «no es preciso controlarlos»."],
[7,"Respecto a la planificación de los rescates (8.2) y a las decisiones tácticas (8.3), ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Pararse a valorar la situación y planificar las acciones y la división del trabajo supone ahorrar un tiempo bastante significativo; las decisiones tácticas, de carácter puramente operativo, se toman paralelamente a las estratégicas.","Pararse a valorar la situación y planificar las acciones y la división del trabajo supone ahorrar un tiempo bastante significativo; las decisiones tácticas, de carácter puramente operativo, se toman una vez concluidas las estratégicas.","Pararse a valorar la situación y planificar las acciones y la división del trabajo supone perder un tiempo significativo, aunque mejore la respuesta; las decisiones tácticas, de carácter puramente operativo, se toman paralelamente a las estratégicas.","Pararse a valorar la situación y planificar las acciones y la división del trabajo supone ahorrar un tiempo bastante significativo; las decisiones estratégicas, de carácter puramente operativo, se toman paralelamente a las tácticas."],"8.2: de nada serviría correr al rescate sin pararse a valorar la situación y planificar las acciones y la división del trabajo; esa premisa «supone la mejora de la respuesta y el ahorro de un tiempo bastante significativo». 8.3: «paralelamente» a las decisiones estratégicas se toman otras decisiones tácticas «de carácter puramente operativas». Fallan la que dice «una vez concluidas las estratégicas», la que habla de «perder un tiempo significativo» y la que atribuye el carácter puramente operativo a las decisiones «estratégicas»."],
[7,"Un equipo debe bajar una camilla desde una cubierta hasta el suelo mediante un descenso asistido con freno de carga desde la reunión. Un bombero sostiene: «**No** es cierto que el descuelgue **no** pueda asegurarse desde un punto inferior». ¿Qué afirmación **NO** contradice ni esa frase ni el apartado 8.3?",["La frase es correcta: el descuelgue puede asegurarse desde el mismo sistema de anclaje o desde un punto inferior mediante reenvío sobre el sistema de anclaje, y esta maniobra es útil para el descenso de accidentados, camillas y evacuaciones.","La frase es correcta: el descuelgue puede asegurarse desde el mismo sistema de anclaje o desde un punto inferior anclado de forma independiente, sin reenvío sobre el sistema de anclaje, y la maniobra es útil para el descenso de accidentados, camillas y evacuaciones.","La frase es incorrecta: el descuelgue solo puede asegurarse desde el mismo sistema de anclaje, porque el temario no prevé reenvíos desde un punto inferior, aunque la maniobra es útil para el descenso de accidentados, camillas y evacuaciones.","La frase es correcta: el descuelgue puede asegurarse desde el mismo sistema de anclaje o desde un punto inferior mediante reenvío sobre el sistema de anclaje, pero esta maniobra se reserva para cargas y no es útil para el descenso de camillas."],"«No es cierto que no pueda» equivale a «puede»: la frase afirma que el descuelgue puede asegurarse desde un punto inferior. 8.3 lo confirma: los descuelgues se aseguran «desde el mismo sistema de anclaje» o «desde un punto inferior mediante reenvío sobre el sistema de anclaje», y la maniobra es útil para el descenso de accidentados, camillas y evacuaciones. Fallan la que asegura desde un punto inferior «sin reenvío sobre el sistema de anclaje», la que tacha la frase de incorrecta porque cabría «solo» el mismo sistema de anclaje, y la que dice que «no es útil para el descenso de camillas»."],
[8,"Un bombero debe descender con el apoyo de una cuerda a lo largo de un talud de hormigón inclinado 35º. Según el apartado 9.1, ¿qué valoración es la correcta?",["Se considera trabajo de «acceso con cuerda», porque esa maniobra básica comprende el descenso por una pared vertical o a lo largo de una superficie inclinada de más de 30º.","No se considera trabajo de «acceso con cuerda», porque esa maniobra básica solo comprende el descenso por una pared vertical o a lo largo de una superficie inclinada de más de 45º.","No se considera trabajo de «acceso con cuerda», porque esa maniobra básica solo comprende el descenso por una pared vertical o a lo largo de una superficie inclinada de más de 60º.","Se considera trabajo de «acceso con cuerda», porque esa maniobra básica comprende el descenso por una pared vertical o a lo largo de una superficie inclinada de más de 20º."],"9.1 define la maniobra básica de «acceso con cuerda» como el descenso con el apoyo de una cuerda por una pared vertical «o a lo largo de una superficie inclinada de más de 30º». Un talud de 35º supera ese umbral, así que el caso es acceso con cuerda. Fallan las que fijan el umbral en «más de 45º» o «más de 60º» (y por eso excluyen el caso) y la que llega a la conclusión correcta con una cifra falsa, «más de 20º»."],
[8,"Durante una maniobra de acceso con cuerda (9.1), ¿qué combinación de normas y equipos es la correcta?",["Dos cuerdas EN-1891-A; en la línea de trabajo, un descensor EN-12841 (Tipo C); en la línea de seguridad, un anticaídas EN-12841 (Tipo A) conectado a la anilla esternal o dorsal «A» de un arnés anticaídas EN-361.","Dos cuerdas EN-1891-A; en la línea de trabajo, un descensor EN-12841 (Tipo A); en la línea de seguridad, un anticaídas EN-12841 (Tipo C) conectado a la anilla esternal o dorsal «A» de un arnés anticaídas EN-361.","Dos cuerdas EN-1891-A; en la línea de trabajo, un descensor EN-12841 (Tipo C); en la línea de seguridad, un anticaídas EN-12841 (Tipo A) conectado a la anilla ventral de un arnés anticaídas EN-361.","Dos cuerdas EN-1891-A; en la línea de trabajo, un descensor EN-12841 (Tipo C); en la línea de seguridad, un anticaídas EN-12841 (Tipo A) conectado a la anilla esternal o dorsal «A» de un arnés anticaídas EN-12841."],"9.1: se usan dos cuerdas EN-1891-A; en la línea de trabajo se instala el descensor EN-12841 de Tipo C, y a la línea de seguridad se conecta un anticaídas EN-12841 de Tipo A, unido a una anilla esternal o dorsal «A» de un arnés anticaídas EN-361. Fallan la que intercambia los tipos («descensor ... Tipo A», «anticaídas ... Tipo C»), la que lo conecta a la «anilla ventral» y la que atribuye al arnés la norma «EN-12841»."],
[8,"Un mando propone descender con una sola cuerda alegando que así se tarda menos. Otro bombero responde: «**No** es cierto que **no** esté permitido el empleo de una sola cuerda». Según el apartado 9.1, ¿qué interpretación **NO** contradice ni esa respuesta ni el temario?",["La respuesta es compatible con 9.1, pero solo de forma totalmente justificada, como contempla el RD 2177/2004, cuando se demuestre que la segunda cuerda produce mayor riesgo que hacerlo en simple; la rapidez alegada no es causa suficiente.","La respuesta es compatible con 9.1, pero solo de forma totalmente justificada, como contempla el RD 2177/2004, cuando se demuestre que la segunda cuerda produce mayor riesgo que hacerlo en simple; la rapidez alegada basta si se justifica por escrito.","La respuesta es incompatible con 9.1, porque el RD 2177/2004 prohíbe en todo caso el empleo de una sola cuerda, incluso cuando se demuestre que la segunda produce mayor riesgo que hacerlo en simple; la rapidez alegada no es causa suficiente.","La respuesta es compatible con 9.1, pero solo de forma totalmente justificada, como contempla el RD 2177/2004, cuando se demuestre que la segunda cuerda produce un riesgo igual o mayor que hacerlo en simple; la rapidez alegada no es causa suficiente."],"«No es cierto que no esté permitido» equivale a «está permitido», lo que 9.1 admite solo de forma excepcional: «solamente se permite y de forma totalmente justificada», como contempla el RD 2177/2004, cuando se demuestre que la segunda cuerda produce «mayor riesgo» que hacerlo en simple; la rapidez no es esa causa. Fallan la que acepta la rapidez si «se justifica por escrito», la que dice que el RD lo «prohíbe en todo caso» y la que amplía el supuesto a un riesgo «igual o mayor»."],
[8,"Respecto a la instalación previa a un descenso por cuerda (9.1), ¿cuál de las siguientes afirmaciones es **FALSA**?",["Para evitar que la cuerda se enrede o se enganche al tirarla, se puede adujar en un petate o saca anclado en la cabecera, de modo que salga progresivamente durante el descenso.","Como prevención, se hace un nudo de final de cuerda a un metro aproximadamente del final de cada una de las cuerdas, para que haga tope con los dispositivos si no advertimos el final.","Los anclajes, uno o varios, se eligen atendiendo a su solidez y cuidando que la cuerda no incida sobre ningún saliente, arista o superficie que pudiera dañarla cuando esté en tensión.","Se verificará que se dispone de longitud de cuerda suficiente para alcanzar el punto deseado, y ambas cuerdas se conectan de forma independiente a un anclaje seguro o a un sistema de varios puntos."],"Se pide la FALSA. 9.1 indica que la cuerda puede adujarse en un petate o saca «que colocaremos suspendida de nuestro arnés», no «anclado en la cabecera». Son ciertas las demás: el nudo de final de cuerda a un metro aproximadamente «de cada una de las cuerdas», la elección de anclajes por su solidez evitando salientes, aristas o superficies que dañen la cuerda en tensión, y la verificación de longitud suficiente con ambas cuerdas conectadas de forma independiente."],
[8,"Sobre la protección de las cuerdas frente a los roces (9.1), ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["El roce no viene solo del péndulo al movernos: también se produce al trabajar, descender y ascender por el movimiento vertical arriba-abajo que provoca la elasticidad de la cuerda, y se combate con protectores, desvíos o reenvíos y fraccionamientos.","El roce viene solo del péndulo al movernos, ya que el movimiento vertical arriba-abajo que provoca la elasticidad de la cuerda al trabajar, descender y ascender no genera roce; se combate con protectores, desvíos o reenvíos y fraccionamientos.","El roce no viene solo del péndulo al movernos: también se produce al trabajar, descender y ascender por el movimiento vertical arriba-abajo que provoca la rigidez de la cuerda, y se combate con protectores, desvíos o reenvíos y fraccionamientos.","El roce no viene solo del péndulo al movernos: también se produce al trabajar, descender y ascender por el movimiento vertical arriba-abajo que provoca la elasticidad de la cuerda, aunque solo el roce debido al péndulo obliga a protegerla."],"9.1: «el roce no viene solo del péndulo que provocamos al movernos»; también se produce al trabajar, descender y ascender por un movimiento vertical arriba-abajo «producido por la elasticidad de la cuerda», y «en cualquier caso hay que protegerla siempre». Las formas son protectores, desvíos o reenvíos y fraccionamientos. Fallan la que dice que el roce viene «solo del péndulo», la que atribuye el movimiento a la «rigidez» de la cuerda y la que afirma que «solo el roce debido al péndulo» obliga a protegerla."],
[8,"¿Qué correspondencia entre cada sistema de protección de la cuerda y su descripción (9.1) es la correcta?",["Protector: se usa siempre que haya o se prevea rozamiento. Desviador: cuerda y mosquetón tensados en una dirección concreta que posicionan las líneas de trabajo. Fraccionamiento: divide la cuerda en tramos y permite descender a varios operarios por una sola línea.","Protector: se usa siempre que haya o se prevea rozamiento. Desviador: divide la cuerda en tramos y permite descender a varios operarios por una sola línea. Fraccionamiento: cuerda y mosquetón tensados en una dirección concreta que posicionan las líneas de trabajo.","Protector: se usa solo cuando ya existe rozamiento, no cuando se prevé. Desviador: cuerda y mosquetón tensados en una dirección concreta que posicionan las líneas de trabajo. Fraccionamiento: divide la cuerda en tramos y permite descender a varios operarios por una sola línea.","Protector: se usa siempre que haya o se prevea rozamiento. Desviador: cuerda y mosquetón tensados en una dirección concreta que posicionan las líneas de trabajo. Fraccionamiento: divide la cuerda en tramos y permite descender a un único operario por cada línea de cuerda."],"9.1: los protectores se usan «siempre que la cuerda tenga o se prevea un rozamiento»; el desviador «suele constar de una cuerda y un mosquetón tensados en una dirección concreta» y posiciona las líneas de trabajo; el fraccionamiento, en grandes verticales, «divide la cuerda en varios tramos permitiendo descender a varios operarios por una sola línea de cuerda». Fallan la que intercambia desviador y fraccionamiento, la que limita el protector a cuando «ya existe rozamiento» y la que habla de «un único operario por cada línea»."],
[8,"Sobre los protectores y los desviadores descritos en el apartado 9.1, todas las afirmaciones siguientes son ciertas **excepto** una. ¿Cuál es la que **no** se ajusta al temario?",["La función principal del desviador es reducir la carga que soporta el anclaje, aunque de forma secundaria también posiciona las líneas de trabajo donde interesen.","Según el modelo, el protector se instala de forma que quede solidario con la cuerda, para que esta no pueda desalojarse de él de forma involuntaria.","El protector permite rebasarlo al transitar por la cuerda sin necesidad de desalojar los dispositivos, y después volver a dejar la cuerda alojada en él.","El desviador suele constar de una cuerda y un mosquetón tensados en una dirección concreta, donde se aloja la cuerda de trabajo y/o la de seguro."],"Se busca la afirmación que no se ajusta al temario. 9.1 atribuye al desviador como función principal «posicionar las líneas de trabajo donde nos interesen y proteger la cuerda de roces», no «reducir la carga que soporta el anclaje». Son ciertas las demás: el protector queda solidario con la cuerda para que no se desaloje involuntariamente, permite rebasarlo sin desalojar los dispositivos y volver a alojar la cuerda, y el desviador suele constar de una cuerda y un mosquetón tensados en una dirección concreta."],
[8,"Durante un descenso, un bombero necesita detenerse a media cuerda para trabajar, y su descensor carece de sistema de bloqueo. Un compañero le dice: «**No** es cierto que **no** tengas otra opción que mantener la cuerda sujeta con la mano». Según el apartado 9.1, ¿qué interpretación **NO** contradice ni esa frase ni el temario?",["La frase es acertada: sin sistema de bloqueo, se usará el que el fabricante haya diseñado para dejarlo bloqueado; si lo tuviera, se mantendría activado hasta reanudar un descenso progresivo, sin tirones ni saltos.","La frase es errónea: sin sistema de bloqueo, el bombero debe mantener la cuerda sujeta con la mano hasta reanudar un descenso progresivo, sin tirones ni saltos, porque el temario no prevé ninguna otra alternativa.","La frase es acertada: sin sistema de bloqueo, se improvisará un bloqueo con la cuerda de seguridad; si lo tuviera, se mantendría activado hasta reanudar un descenso progresivo, sin tirones ni saltos.","La frase es acertada: sin sistema de bloqueo, se usará el que el fabricante haya diseñado para dejarlo bloqueado; si lo tuviera, se mantendría activado hasta reanudar el descenso, que admite pequeños saltos controlados."],"«No es cierto que no tengas otra opción» equivale a afirmar que sí hay otra opción. 9.1: si el descensor tiene sistema de bloqueo, se activa hasta reanudar el descenso; «si no lo tuviera, usaremos el sistema que el fabricante haya diseñado para dejarlo bloqueado», y el descenso es progresivo, «sin tirones ni saltos». Fallan la que tacha la frase de errónea y obliga a «mantener la cuerda sujeta con la mano», la que improvisa un bloqueo «con la cuerda de seguridad» y la que admite «pequeños saltos controlados»."],
[8,"Los dispositivos de descenso tienen límites de uso fijados por el fabricante (9.1). ¿Qué afirmación se ajusta exactamente al temario?",["Se limitan a unos diámetros de cuerda determinados, unas cargas máximas y una longitud de bajada también limitada; rebasarlos puede dañar algún elemento por efecto del calor y la fricción y sacar el dispositivo de sus parámetros de seguridad.","Se limitan a unos diámetros de cuerda determinados, unas cargas máximas y una velocidad de bajada también limitada; rebasarlos puede dañar algún elemento por efecto del calor y la fricción y sacar el dispositivo de sus parámetros de seguridad.","Se limitan a unos diámetros de cuerda determinados, unas cargas máximas y una longitud de bajada también limitada; rebasarlos puede dañar algún elemento por efecto de la humedad y la corrosión y sacar el dispositivo de sus parámetros de seguridad.","Se limitan a unos diámetros de cuerda determinados, unas cargas mínimas y una longitud de bajada también limitada; rebasarlos puede dañar algún elemento por efecto del calor y la fricción y sacar el dispositivo de sus parámetros de seguridad."],"9.1: los dispositivos para descender están limitados por el fabricante «para unos diámetros de cuerda determinados, unas cargas máximas y una longitud de bajada también limitada», y rebasar esos límites puede hacer que, «por efecto del calor y la fricción», algún elemento resulte dañado y el dispositivo deje de funcionar dentro de sus parámetros de seguridad. Fallan la que cambia la longitud por la «velocidad de bajada», la que atribuye el daño a «la humedad y la corrosión» y la que habla de «cargas mínimas»."],
[8,"Situado delante de las cuerdas para iniciar un ascenso con bloqueador anticaídas deslizante, bloqueador ventral tipo Croll y bloqueador de puño tipo Ascensión (9.2), ¿qué secuencia de instalación es la correcta?",["1) Bloqueador anticaídas en la cuerda de seguridad; 2) bloqueador ventral en la cuerda de progresión; 3) bloqueador de puño, por último, por encima del bloqueador ventral.","1) Bloqueador ventral en la cuerda de progresión; 2) bloqueador anticaídas en la cuerda de seguridad; 3) bloqueador de puño, por último, por encima del bloqueador ventral.","1) Bloqueador anticaídas en la cuerda de seguridad; 2) bloqueador ventral en la cuerda de progresión; 3) bloqueador de puño, por último, por debajo del bloqueador ventral.","1) Bloqueador anticaídas en la cuerda de progresión; 2) bloqueador ventral en la cuerda de seguridad; 3) bloqueador de puño, por último, por encima del bloqueador ventral."],"9.2 fija el orden: 1) bloqueador anticaídas en la cuerda destinada a seguridad; 2) bloqueador ventral en la cuerda de progresión; 3) «por último», bloqueador de puño «por encima del bloqueador ventral». Fallan la secuencia que empieza por el ventral, la que coloca el puño «por debajo del bloqueador ventral» y la que intercambia las cuerdas del anticaídas («cuerda de progresión») y del ventral («cuerda de seguridad»)."],
[8,"Un aspirante explica el ciclo de progresión en el ascenso por cuerda: «**No** es falso que el bloqueador ventral **no** se eleve mientras el peso descansa sobre el pedal del bloqueador de puño». Según el apartado 9.2, ¿qué valoración es la correcta?",["La explicación es errónea: con el peso sobre el pedal del bloqueador de puño se eleva el ventral; agotado su recorrido, el apoyo pasa al ventral para avanzar el puño, y del anticaídas solo se verifica su correcto recorrido.","La explicación es correcta: con el peso sobre el pedal del bloqueador de puño se avanza el puño; agotado su recorrido, el apoyo pasa al ventral para elevarlo, y del anticaídas solo se verifica su correcto recorrido.","La explicación es errónea: con el peso sobre el pedal del bloqueador de puño se eleva el ventral; agotado su recorrido, el apoyo pasa al ventral para avanzar el puño, y el anticaídas hay que desplazarlo a mano en cada ciclo.","La explicación es errónea: con el peso sobre el pedal del bloqueador de puño se eleva el ventral; agotado su recorrido, el apoyo pasa al anticaídas para avanzar el puño, y del anticaídas solo se verifica su correcto recorrido."],"«No es falso que X» equivale a afirmar X: que el ventral NO se eleva con el peso sobre el pedal. Eso contradice 9.2, donde apoyar el peso sobre el pedal del bloqueador de puño consigue «elevar la posición del bloqueador ventral»; la explicación es, pues, errónea. Después el apoyo se cambia al ventral para avanzar el puño, y el anticaídas «nos sigue», por lo que solo se verifica su recorrido. Fallan la que valida la explicación invirtiendo el ciclo, la que obliga a desplazar el anticaídas «a mano en cada ciclo» y la que pasa el apoyo «al anticaídas»."],
[8,"Respecto a las técnicas de ascenso (9.2), ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["La progresión por cuerda, aunque no es muy usada habitualmente en la mayoría de los trabajos, es de obligatorio conocimiento y perfeccionamiento para evitar la fatiga; y, como el bloqueo solo permite deslizar en una dirección, para descender hay que cambiar los aparatos.","La progresión por cuerda, por ser la maniobra más usada habitualmente en la mayoría de los trabajos, es de obligatorio conocimiento y perfeccionamiento para evitar la fatiga; y, como el bloqueo solo permite deslizar en una dirección, para descender hay que cambiar los aparatos.","La progresión por cuerda, aunque no es muy usada habitualmente en la mayoría de los trabajos, es de obligatorio conocimiento y perfeccionamiento para evitar la fatiga; y, como el bloqueo permite deslizar en ambas direcciones, para descender bastan los mismos aparatos.","La progresión por cuerda, aunque no es muy usada habitualmente en la mayoría de los trabajos, es de obligatorio conocimiento y perfeccionamiento para evitar la fatiga; y, como el bloqueo solo permite deslizar en una dirección, para descender basta con invertir el bloqueador ventral."],"9.2: la progresión por cuerda, «aunque no es muy usada habitualmente», es de obligatorio conocimiento y perfeccionamiento de la técnica para evitar la fatiga; y el sistema de bloqueo «permite deslizarse en una dirección», por lo que para descender «tenemos que cambiar los aparatos por otros para ese fin». Fallan la que la presenta como «la maniobra más usada», la que dice que el bloqueo permite deslizar «en ambas direcciones» y la que propone «invertir el bloqueador ventral»."],
[9,"Hay que izar una bolsa de material de 40 kg. Aplicando las relaciones del apartado 10.2 y despreciando rozamientos, ¿qué fuerza de tracción, expresada en kilogramos, exige cada sistema?",["Con polea fija, 40 kg; con una polea móvil, 20 kg; con un polifreno, 40 kg; y con un polipasto (polifreno al que se añaden poleas móviles), menos de 40 kg.","Con polea fija, 20 kg; con una polea móvil, 20 kg; con un polifreno, 40 kg; y con un polipasto (polifreno al que se añaden poleas móviles), menos de 40 kg.","Con polea fija, 40 kg; con una polea móvil, 20 kg; con un polifreno, 20 kg; y con un polipasto (polifreno al que se añaden poleas móviles), menos de 40 kg.","Con polea fija, 40 kg; con una polea móvil, 10 kg; con un polifreno, 40 kg; y con un polipasto (polifreno al que se añaden poleas móviles), menos de 40 kg."],"10.2: con la polea fija «no se disminuye la fuerza, sólo se desvía» (F = P = 40 kg); con la polea móvil la carga se reparte por igual entre los segmentos de cuerda (F = P/2 = 20 kg); con el polifreno «la fuerza que se tiene que utilizar es la misma que el peso» (40 kg); y el polipasto añade poleas móviles al polifreno para desmultiplicar la fuerza, por lo que exige menos de 40 kg. Fallan la que asigna «20 kg» a la polea fija, la que asigna «20 kg» al polifreno y la que divide por cuatro con una sola polea móvil («10 kg»)."],
[9,"Hay que subir a una cubierta un equipo de 65 kg. Según el apartado 10.1, ¿qué afirmación es la correcta?",["Al superar los 60 kg, se usarán equipos de trabajo tales como grúas; la cuerda auxiliar con poleas autobloqueantes queda para herramientas o equipos de peso moderado, y nadie permanecerá en el radio de trabajo de la carga.","Al no superar los 80 kg, basta una cuerda auxiliar con poleas autobloqueantes que ofrezcan una ventaja mecánica favorable; las grúas quedan para cargas mayores, y nadie permanecerá en el radio de trabajo de la carga.","Al superar los 60 kg, se usarán equipos de trabajo tales como grúas; la cuerda auxiliar con poleas autobloqueantes queda para herramientas o equipos de peso moderado, y solo quien guía la carga podrá permanecer en su radio de trabajo.","Al superar los 50 kg, se usarán equipos de trabajo tales como grúas; la cuerda auxiliar con poleas autobloqueantes queda para herramientas o equipos de peso moderado, y nadie permanecerá en el radio de trabajo de la carga."],"10.1: las herramientas o equipos de peso moderado se manipulan con cuerda auxiliar y poleas autobloqueantes, pero «para cargas superiores a 60 kg» se usarán equipos de trabajo tales como grúas; y durante el manejo de cargas, en ascenso o descenso, «ninguna persona permanecerá en el radio de trabajo de la carga». Fallan la que fija el límite en «80 kg», la que sitúa el umbral en «50 kg» (conclusión correcta con cifra falsa) y la que permite permanecer en el radio de trabajo a «quien guía la carga»."],
[9,"Según el apartado 10.2, ¿qué afirmación sobre el número de poleas móviles de un polipasto es exacta?",["A más poleas móviles, mayor desmultiplicación, pero su número puede ser un inconveniente, ya que la distancia a la que puede elevarse la carga depende de la distancia entre las poleas; en la práctica se usan como máximo 4, lo más habitual 1 o 2.","A más poleas móviles, mayor desmultiplicación, pero su número puede ser un inconveniente, ya que la distancia a la que puede elevarse la carga depende de la distancia entre las poleas; en la práctica se usan como máximo 6, lo más habitual 1 o 2.","A más poleas móviles, mayor desmultiplicación, pero su número puede ser un inconveniente, ya que la distancia a la que puede elevarse la carga depende de la distancia entre las poleas; en la práctica se usan como máximo 4, lo más habitual 2 o 3.","A más poleas móviles, mayor desmultiplicación, pero su número puede ser un inconveniente, ya que la distancia a la que puede elevarse la carga depende del diámetro de cada una de las poleas; en la práctica se usan como máximo 4, lo más habitual 1 o 2."],"10.2: en función del número de poleas móviles se tendrá mayor desmultiplicación, pero su número puede ser un inconveniente «porque la distancia a la que puede elevarse una carga depende de la distancia entre las poleas»; en la práctica el máximo es de 4 poleas móviles y lo más habitual, 1 o 2. Fallan la que fija el máximo en «6», la que da como habitual «2 o 3» y la que hace depender la distancia «del diámetro de cada una de las poleas»."],
[9,"¿Qué reparto de características entre poleas fijas y poleas móviles (10.2) es el correcto?",["Fijas: modifican la dirección del movimiento, reducen el rozamiento en los cambios de sentido y no disminuyen la fuerza (F = P). Móviles: tienen movimiento de traslación, reparten la carga por igual entre los segmentos de cuerda y reducen el esfuerzo (F = P/2).","Fijas: modifican la dirección del movimiento, reducen el rozamiento en los cambios de sentido y reparten la carga por igual entre los segmentos de cuerda (F = P/2). Móviles: tienen movimiento de traslación y no disminuyen la fuerza, solo la desvían (F = P).","Fijas: modifican la dirección del movimiento, reducen el rozamiento en los cambios de sentido y no disminuyen la fuerza (F = P). Móviles: tienen movimiento de traslación, reparten la carga por igual entre los segmentos de cuerda y reducen el esfuerzo (F = P/4).","Fijas: modifican la dirección del movimiento, aumentan el rozamiento en los cambios de sentido y no disminuyen la fuerza (F = P). Móviles: tienen movimiento de traslación, reparten la carga por igual entre los segmentos de cuerda y reducen el esfuerzo (F = P/2)."],"10.2: las poleas fijas modifican la dirección del movimiento y «reducen el rozamiento de la cuerda en los cambios de sentido», pero con ellas «no se disminuye la fuerza, sólo se desvía» (F = P); las móviles tienen movimiento de traslación y la carga se reparte por igual sobre los segmentos de la cuerda, con lo que el esfuerzo se reduce (F = P/2). Fallan la que intercambia entre ambos tipos el reparto de la carga y la no reducción de la fuerza, la que da para la polea móvil «F = P/4» y la que dice que las fijas «aumentan el rozamiento»."],
[9,"Un aspirante afirma: «**No** es cierto que con un polifreno **no** haya que aplicar una fuerza igual al peso que se iza». ¿Qué interpretación **NO** contradice ni esa afirmación ni el apartado 10.2?",["La afirmación es correcta: el polifreno une polea y bloqueador; la polea cambia el sentido de aplicación de la fuerza y el bloqueador evita que la carga retroceda, sin reducir la fuerza. Para desmultiplicarla se le añaden conjuntos de poleas móviles, formando un polipasto.","La afirmación es correcta: el polifreno une polea y bloqueador; el bloqueador cambia el sentido de aplicación de la fuerza y la polea evita que la carga retroceda, sin reducir la fuerza. Para desmultiplicarla se le añaden conjuntos de poleas móviles, formando un polipasto.","La afirmación es errónea: el polifreno une polea y bloqueador; la polea cambia el sentido de aplicación de la fuerza y el bloqueador evita que la carga retroceda, reduciendo la fuerza a la mitad del peso. Para desmultiplicarla más se le añaden poleas móviles.","La afirmación es correcta: el polifreno une polea y bloqueador; la polea cambia el sentido de aplicación de la fuerza y el bloqueador evita que la carga retroceda, sin reducir la fuerza. Para desmultiplicarla se le añaden conjuntos de poleas fijas, formando un polipasto."],"«No es cierto que no haya que aplicar» equivale a «hay que aplicar»: la afirmación sostiene que con el polifreno la fuerza iguala al peso, como recoge 10.2 («la fuerza que se tiene que utilizar es la misma que el peso que hay que izar»). Con la polea se cambia el sentido de la fuerza y con el bloqueador se evita que la carga retroceda; el polipasto es un polifreno al que se añaden «conjuntos de poleas móviles». Fallan la que intercambia las funciones de polea y bloqueador, la que tacha la afirmación de errónea por reducir la fuerza «a la mitad del peso» y la que habla de «poleas fijas»."],
[9,"¿Qué relación incluye **únicamente** montajes que aparecen en la figura «Tipos de polifrenos» del apartado 10.2?",["Polifreno montado en la carga en el sentido contrario a la tracción; polifreno montado en el sentido de la tracción; polifreno móvil (lanzadera en un polipasto).","Polifreno montado en la carga en el sentido contrario a la tracción; polifreno montado en el sentido de la tracción; polifreno fijo (lanzadera en un polipasto).","Polifreno montado en la carga en el sentido contrario a la tracción; polifreno con el mosquetón cogido por el ojal central del Basic; polifreno móvil (lanzadera en un polipasto).","Polifreno realizado con una Mini Traxion montado en el sentido de la tracción; polifreno montado en la carga en el sentido contrario a la tracción; polifreno móvil (lanzadera en un polipasto)."],"La figura de 10.2 recoge ocho montajes: dos en el sentido de la carga con el mosquetón cogido por el ojal superior o por el ojal inferior del Basic; dos con Mini Traxion, en la cabecera de la tracción y en el sentido de la carga; dos montados en la carga, en el sentido contrario a la tracción y en el sentido de la tracción; uno montado en el sentido de la tracción; y el «polifreno móvil (lanzadera en un polipasto)». No figuran el «polifreno fijo» como lanzadera, el «ojal central del Basic» ni la Mini Traxion «montado en el sentido de la tracción»."],
[9,"Según la figura «Tipos de polifrenos» del apartado 10.2, ¿cuál de las siguientes descripciones **NO** es incorrecta?",["La figura cita el Basic en dos montajes en el sentido de la carga, según el mosquetón se coja por su ojal superior o inferior, y la Mini Traxion en un montaje en la cabecera de la tracción y en otro en el sentido de la carga.","La figura cita el Basic en dos montajes en el sentido de la tracción, según el mosquetón se coja por su ojal superior o inferior, y la Mini Traxion en un montaje en la cabecera de la tracción y en otro en el sentido de la carga.","La figura cita el Basic en dos montajes en el sentido de la carga, según el mosquetón se coja por su ojal superior o inferior, y la Mini Traxion en un montaje en la cabecera de la tracción y en otro en el sentido contrario a la tracción.","La figura cita el Basic en dos montajes en el sentido de la carga, según el mosquetón se coja por su ojal superior o inferior, y la Mini Traxion en un montaje en la cabecera de la tracción y en otro como polifreno móvil (lanzadera en un polipasto)."],"En la figura de 10.2, el Basic aparece en dos polifrenos «montados en el sentido de la carga», con el mosquetón cogido por el ojal superior o por el ojal inferior; la Mini Traxion, en uno «montado en la cabecera de la tracción» y en otro «montado en el sentido de la carga». Fallan la que sitúa los montajes del Basic «en el sentido de la tracción», la que coloca la Mini Traxion «en el sentido contrario a la tracción» (que la figura atribuye a un polifreno montado en la carga) y la que la identifica con el «polifreno móvil», que la figura no asocia a la Mini Traxion."],
[9,"Sobre los polipastos descritos en el apartado 10.2, ¿cuál de las siguientes afirmaciones es **FALSA**?",["Combinar varias poleas móviles aumenta la desmultiplicación y, además, reduce la longitud de cuerda de trabajo necesaria, al acortarse su recorrido entre las poleas.","Deben montarse sobre puntos de anclaje sólidos o sistemas de anclajes de seguridad, porque las fuerzas que actúan sobre ellos debido a la desmultiplicación son elevadas.","Los que combinan varias poleas móviles requieren mucho material y diversos puntos de anclaje, pero permiten manejar cargas elevadas con poco esfuerzo.","Los polipastos de varias poleas móviles son bastante utilizados en el montaje de elementos muy pesados o en el rescate de personas en suspensión."],"Se pide la FALSA. 10.2: la combinación de varias poleas móviles aumenta la desmultiplicación, «pero tenemos el inconveniente de que necesitamos incrementar la longitud de la cuerda de trabajo» por su recorrido entre las poleas; no la «reduce». Son ciertas las demás: anclajes sólidos o SAS porque las fuerzas debidas a la desmultiplicación son elevadas; mucho material y diversos anclajes a cambio de manejar cargas elevadas con poco esfuerzo; y uso en el montaje de elementos muy pesados o en el rescate de personas en suspensión."],
[9,"En relación con la eficacia de los polipastos (10.2), ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Las poleas con sistema de freno simplifican el montaje y ahorran material, mejorando el sistema al disminuir ángulos y roces; y, para aprovechar al máximo la tracción, esta debe ser lo más paralela posible a la dirección de la carga.","Las poleas con sistema de freno simplifican el montaje y ahorran material, mejorando el sistema al disminuir ángulos y roces; y, para aprovechar al máximo la tracción, esta debe ser lo más perpendicular posible a la dirección de la carga.","Las poleas con sistema de freno simplifican el montaje, aunque exigen más material, mejorando el sistema al disminuir ángulos y roces; y, para aprovechar al máximo la tracción, esta debe ser lo más paralela posible a la dirección de la carga.","Las poleas con sistema de freno simplifican el montaje y ahorran material, mejorando el sistema al disminuir los ángulos aunque aumenten los roces; y, para aprovechar al máximo la tracción, esta debe ser lo más paralela posible a la dirección de la carga."],"10.2: las poleas con sistemas de freno simplifican el montaje de los polipastos «con el consiguiente ahorro de material» y mejoran los sistemas «por la disminución de ángulos y roces»; además, la fuerza de tracción tendrá que ser «lo más paralela a la dirección de la carga», pues las angulaciones en el tiro restan eficacia. Fallan la que pide una tracción «perpendicular», la que dice que «exigen más material» y la que admite que «aumenten los roces»."],
[9,"En unos trabajos en fachada, un bombero no puede llevar sujetas al cuerpo unas herramientas. El jefe de equipo afirma: «**No** es falso que la bolsa auxiliar **no** deba colgarse de la cuerda de seguridad». ¿Qué interpretación **NO** contradice ni esa afirmación ni el apartado 10.1?",["La afirmación es correcta: la bolsa auxiliar irá sujeta a otra línea independiente de las cuerdas de sujeción o seguridad, y como prevención se instalará una red de recogida fijada a la fachada para recoger cualquier objeto caído.","La afirmación es correcta: la bolsa auxiliar irá sujeta a la cuerda de sujeción, siempre que sea independiente de la de seguridad, y como prevención se instalará una red de recogida fijada a la fachada para recoger cualquier objeto caído.","La afirmación es errónea: la bolsa auxiliar irá sujeta a la cuerda de seguridad, que es independiente de la de trabajo, y como prevención se instalará una red de recogida fijada a la fachada para recoger cualquier objeto caído.","La afirmación es correcta: la bolsa auxiliar irá sujeta a otra línea independiente de las cuerdas de sujeción o seguridad, y como prevención se instalará una red de recogida fijada al suelo, bajo la vertical, para recoger cualquier objeto caído."],"«No es falso que X» equivale a afirmar X: la bolsa auxiliar no debe colgarse de la cuerda de seguridad. 10.1: si las herramientas no pueden ir sujetas al cuerpo, se usan bolsas auxiliares «sujetas a otra línea independiente de las cuerdas de sujeción o seguridad», y como prevención se instala una red de recogida «fijada a la fachada». Fallan la que permite usar «la cuerda de sujeción», la que tacha la afirmación de errónea y cuelga la bolsa de «la cuerda de seguridad», y la que fija la red «al suelo, bajo la vertical»."],
[9,"Respecto a la manipulación de cargas en altura (10.1), ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Se prohíbe transportar o manipular cargas por o desde escaleras de mano cuando por su peso o dimensiones puedan comprometer la seguridad del trabajador; y la señalización de seguridad no omitirá, en ningún caso, la adopción de las medidas de prevención.","Se prohíbe transportar o manipular cargas por o desde escaleras de mano cuando por su peso o dimensiones puedan comprometer la seguridad del trabajador; y la señalización de seguridad podrá sustituir, cuando resulte suficiente, a las medidas de prevención.","Se prohíbe en todo caso transportar o manipular cargas por o desde escaleras de mano, cualquiera que sea su peso o sus dimensiones; y la señalización de seguridad no omitirá, en ningún caso, la adopción de las medidas de prevención.","Se prohíbe transportar o manipular cargas por o desde escaleras de mano solo cuando superen los 60 kg, con independencia de sus dimensiones; y la señalización de seguridad no omitirá, en ningún caso, la adopción de las medidas de prevención."],"10.1: el transporte a mano de una carga por una escalera de mano no debe impedir una sujeción segura, y se prohíbe transportar y manipular cargas por o desde escaleras «cuando por su peso o dimensiones puedan comprometer la seguridad del trabajador»; además, la señalización de seguridad «no omitirá, en ningún caso, la adopción de las medidas de prevención». Fallan la que dice que la señalización «podrá sustituir» a la prevención, la que prohíbe «en todo caso» cualquier carga y la que traslada a las escaleras el umbral de «60 kg», que el temario reserva para el uso de grúas."],
[9,"Con una polea fija se tira de la cuerda 3 m para izar una carga. Aplicando el apartado 10.2, ¿qué afirmación es la correcta?",["La carga sube 3 m, porque con la polea fija la distancia que recorre el peso es la misma que la de tiro; si se redujera la fuerza con una polea móvil, para el mismo trabajo (L = F · r) aumentaría el recorrido.","La carga sube 1,5 m, porque con la polea fija la carga se reparte entre los dos segmentos de cuerda; si se redujera la fuerza con una polea móvil, para el mismo trabajo (L = F · r) aumentaría el recorrido.","La carga sube 3 m, porque con la polea fija la distancia que recorre el peso es la misma que la de tiro; si se redujera la fuerza con una polea móvil, para el mismo trabajo (L = F · r) disminuiría el recorrido.","La carga sube 3 m, porque con la polea fija la distancia que recorre el peso es la misma que la de tiro; si se redujera la fuerza con una polea móvil, el trabajo (L = F · r) bajaría en la misma proporción sin variar el recorrido."],"10.2: con poleas fijas «la distancia que recorre el peso es el mismo que la distancia de tiro» (F = P), luego tirando 3 m la carga sube 3 m; y, según L = F · r, «para un trabajo determinado al reducir la fuerza ejercida, se incrementará la distancia del recorrido». Fallan la de «1,5 m», que aplica a la polea fija el reparto de la carga propio de la polea móvil; la que dice que el recorrido «disminuiría»; y la que supone que el trabajo baja «sin variar el recorrido»."],
[10,"Un espeleólogo consciente pero agotado es rescatado tras permanecer suspendido inerte de su arnés. Un compañero afirma: «**No** es cierto que **no** sea un error tumbarlo en horizontal nada más rescatarlo». Según el apartado 11.4, ¿qué actuación **NO** contradice ni esa afirmación ni el temario?",["Colocarlo semisentado, en cuclillas o agachado, mantener esa posición unos 20 a 40 minutos y pasar después gradualmente a la horizontal, para evitar la sobrecarga aguda del ventrículo derecho por aflujo masivo de la sangre acumulada en las extremidades.","Colocarlo semisentado, en cuclillas o agachado, mantener esa posición unos 20 a 40 minutos y pasar después gradualmente a la horizontal, para evitar la sobrecarga aguda del ventrículo izquierdo por aflujo masivo de la sangre acumulada en las extremidades.","Colocarlo semisentado, en cuclillas o agachado, mantener esa posición unos 10 a 20 minutos y pasar después gradualmente a la horizontal, para evitar la sobrecarga aguda del ventrículo derecho por aflujo masivo de la sangre acumulada en las extremidades.","Colocarlo semisentado, en cuclillas o agachado, mantener esa posición unos 20 a 40 minutos y pasar después gradualmente a la horizontal, para acelerar el retorno de la sangre acumulada en las extremidades y restablecer cuanto antes la precarga cardiaca."],"Doble negación: «no es cierto que no sea un error» equivale a afirmar que SÍ es un error tumbarlo en horizontal de inmediato, lo que coincide con el 11.4. Tras el rescate se recomienda la posición semisentada, en cuclillas o agachada, mantenida unos 20 a 40 minutos (no «10 a 20 minutos») antes de pasar gradualmente a la horizontal. El objetivo es evitar la sobrecarga aguda del ventrículo DERECHO (no «izquierdo») por aflujo masivo de la sangre acumulada en las extremidades, es decir, evitar ese aflujo masivo y no «acelerar el retorno» de la sangre."],
[10,"Sobre el origen del concepto de síndrome del arnés que expone el apartado 11.1, ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Las muertes que intrigaron a los investigadores se publicaron a principios de los años 1980, sobre todo en espeleología; se atribuyeron primero al síndrome «fatiga-hipotermia», y los ensayos con voluntarios sanos llevaron a definir el «Síndrome del Arnés».","Las muertes que intrigaron a los investigadores se publicaron a principios de los años 1990, sobre todo en espeleología; se atribuyeron primero al síndrome «fatiga-hipotermia», y los ensayos con voluntarios sanos llevaron a definir el «Síndrome del Arnés».","Las muertes que intrigaron a los investigadores se publicaron a principios de los años 1980, sobre todo en espeleología; se atribuyeron primero al síndrome de aplastamiento, y los ensayos con voluntarios sanos llevaron a definir el «Síndrome del Arnés».","Las muertes que intrigaron a los investigadores se publicaron a principios de los años 1980, sobre todo en barranquismo; se atribuyeron primero al síndrome «fatiga-hipotermia», y los ensayos con voluntarios sanos llevaron a definir el «Síndrome del Arnés»."],"Según 11.1, a principios de los años 1980 (no «1990») se publicaron fallecimientos de individuos aparentemente sanos, principalmente relacionados con la espeleología (no «barranquismo»), hallados suspendidos de sus arneses sin traumatismo aparente. Esas muertes se atribuyeron inicialmente al síndrome «fatiga-hipotermia»; el «síndrome de aplastamiento» aparece en el 11.2 como modelo del fracaso renal de las muertes tardías, no como explicación inicial. Los trabajos experimentales con voluntarios sanos llevaron a definir el «Síndrome del Arnés»."],
[10,"Ordene, según el apartado 11.2, la cadena fisiopatológica que lleva desde la causa precipitante hasta la pérdida de conciencia en una víctima suspendida de su arnés. ¿Qué secuencia es la correcta?",["Inmovilidad en suspensión → secuestro venoso en las extremidades inferiores → disminución de la precarga del ventrículo derecho → caída del gasto cardiaco → disminución de la presión de perfusión cerebral → pérdida de conciencia.","Inmovilidad en suspensión → secuestro venoso en las extremidades inferiores → caída del gasto cardiaco → disminución de la precarga del ventrículo derecho → disminución de la presión de perfusión cerebral → pérdida de conciencia.","Compresión arterial por las correas → secuestro venoso en las extremidades inferiores → disminución de la precarga del ventrículo derecho → caída del gasto cardiaco → disminución de la presión de perfusión cerebral → pérdida de conciencia.","Inmovilidad en suspensión → secuestro venoso en las extremidades inferiores → disminución de la poscarga del ventrículo derecho → caída del gasto cardiaco → disminución de la presión de perfusión cerebral → pérdida de conciencia."],"El 11.2 señala la ausencia de movilidad en suspensión como causa precipitante; la compresión arterial quedó descartada por la persistencia del pulso periférico (falla la cadena que empieza por «compresión arterial por las correas»). El «secuestro» de sangre en las extremidades produce una disminución de la PRECARGA (no «poscarga») del ventrículo derecho. De ella se sigue la caída del gasto cardiaco, y no al revés (falla la secuencia que coloca la «caída del gasto cardiaco» antes que la precarga). Finalmente disminuye la presión de perfusión cerebral y se pierde la conciencia."],
[10,"El apartado 11.2 distingue los síntomas presincopales que pueden aparecer en las fases iniciales del síndrome de los que la víctima siente en las extremidades durante la fase de acúmulo de sangre. ¿Qué reparto recoge correctamente el temario?",["Se citan como presincopales las náuseas, los zumbidos auditivos y la pérdida de visión, y como sentidos en las extremidades las parestesias, el dolor y el aumento de tamaño por edematización.","Se citan como presincopales las náuseas, los zumbidos auditivos y los hormigueos, y como sentidos en las extremidades las parestesias, el dolor y el aumento de tamaño por edematización.","Se citan como presincopales las náuseas, los zumbidos auditivos y la pérdida de visión, y como sentidos en las extremidades las parestesias, la sudoración y el aumento de tamaño por edematización.","Se citan como presincopales las náuseas, los zumbidos auditivos y la pérdida de visión, y como sentidos en las extremidades las parestesias, el dolor y la disminución de tamaño por vasoconstricción."],"Según 11.2, los síntomas presincopales son náuseas, vértigos, zumbidos auditivos, sudoración y pérdida de visión; en las extremidades se sienten parestesias, hormigueos, dolor, pérdida de sensibilidad y aumento de tamaño por edematización. Los «hormigueos» no se citan como presincopales, sino entre los síntomas de las extremidades, y la «sudoración» es presincopal, no un síntoma de las extremidades. El temario habla de AUMENTO de tamaño por edematización, no de «disminución de tamaño por vasoconstricción»."],
[10,"Un trabajador queda colgado de su arnés, consciente, y mueve continuamente las piernas mientras espera el rescate. Un compañero afirma: «**No** es falso que la suspensión, por sí sola, **no** basta para desencadenar el síndrome del arnés». ¿Qué valoración **NO** contradice esa afirmación ni el apartado 11.2?",["Es acertada: suspensión e inmovilidad son requisitos imprescindibles, y la inmovilidad puede darse en personas conscientes que, agotadas, quedan inertes al ceder la tensión de los músculos abdominales.","Es acertada: suspensión e inmovilidad son requisitos imprescindibles, y la inmovilidad solo puede darse en víctimas que hayan quedado inconscientes por la propia caída o por un traumatismo.","Es acertada: suspensión e inmovilidad son requisitos imprescindibles, y la inmovilidad puede darse en personas conscientes que, agotadas, quedan inertes al aumentar la tensión de los músculos abdominales.","Es errónea: la suspensión basta por sí sola, y la inmovilidad solo acelera el cuadro en personas conscientes que, agotadas, quedan inertes al ceder la tensión de los músculos abdominales."],"«No es falso que X» equivale a afirmar X: la suspensión sola NO basta, lo que coincide con el 11.2, que exige dos requisitos imprescindibles, suspensión e inmovilidad (falla «es errónea: la suspensión basta por sí sola»). La inmovilidad puede darse en personas conscientes que, agotadas, quedan inertes al CEDER (no «aumentar») la tensión de los músculos abdominales. También se da en víctimas inconscientes por la caída o un traumatismo, pero no «solo» en ellas."],
[10,"El apartado 11.3 recoge, entre las medidas preventivas del síndrome del arnés, todas las siguientes **excepto** una. ¿Cuál es la que **no** se ajusta al temario?",["La difusión de esta patología debe dirigirse a médicos y personal sanitario que atienden estas emergencias, sin necesidad de extenderla a deportistas, trabajadores ni compañeros de la víctima.","La planificación del trabajo con el empleo de cuerdas y sus técnicas debe permitir que, en caso de emergencia, la víctima pueda ser rescatada inmediatamente.","Los simulacros periódicos de rescate de víctimas en suspensión deberían ser obligatorios en los planes de formación laboral de los trabajadores y deportistas que utilizan estos accesorios.","La rapidez de las maniobras de rescate es especialmente importante en personas ya inconscientes, en las que la muerte puede ser inevitable si las maniobras se realizan de forma incorrecta."],"Se busca la afirmación que NO figura en el 11.3. La difusión de la patología debe alcanzar a los usuarios de arnés (deportistas, trabajadores) y a quienes pueden intervenir en el rescate (compañeros de la víctima, rescatadores, médicos y personal sanitario), por lo que es falso que no haya que extenderla «a deportistas, trabajadores ni compañeros». Las demás sí están en el temario: planificar el trabajo con cuerdas para un rescate «inmediato», simulacros periódicos que «deberían ser obligatorios» y la importancia de la rapidez en personas «ya inconscientes»."],
[10,"Respecto a la prevención del síndrome del arnés que desarrolla el apartado 11.3, ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Persigue evitar la aparición del síndrome y usar métodos seguros de rescate para evitar fallecimientos tras él; ningún arnés actual lo evita si concurren las causas precipitantes, y la primera recomendación es elegir un modelo que se adapte anatómicamente y sea cómodo en suspensión.","Persigue evitar la aparición del síndrome y usar métodos seguros de rescate para evitar fallecimientos tras él; ningún arnés actual lo evita si concurren las causas precipitantes, y la primera recomendación es elegir el modelo de mayor resistencia certificada frente a las caídas.","Persigue evitar la aparición del síndrome y usar métodos seguros de rescate para evitar fallecimientos tras él; solo los arneses de trabajo actuales lo evitan si concurren las causas precipitantes, y la primera recomendación es elegir un modelo que se adapte anatómicamente y sea cómodo en suspensión.","Persigue evitar la aparición del síndrome y acortar el transporte para evitar fallecimientos tras el rescate; ningún arnés actual lo evita si concurren las causas precipitantes, y la primera recomendación es elegir un modelo que se adapte anatómicamente y sea cómodo en suspensión."],"El 11.3 fija dos fines: evitar la aparición del síndrome y utilizar métodos seguros de rescate para evitar fallecimientos tras el mismo (no «acortar el transporte»). Los arneses actuales, deportivos o de trabajo, son cómodos y resisten las caídas, pero NINGÚN modelo puede evitar el síndrome si concurren las causas precipitantes (falla «solo los arneses de trabajo actuales lo evitan»). La primera recomendación es elegir un modelo que se adapte anatómicamente bien al cuerpo y sea cómodo en suspensión, no «el de mayor resistencia certificada»."],
[10,"El apartado 11.2 describe fallecimientos de víctimas que fueron rescatadas con vida. ¿Qué clasificación de esas muertes y de su mecanismo propuesto se ajusta al temario?",["Inmediata («muerte del rescate»): sobrecarga aguda del ventrículo derecho por retorno masivo de sangre al colocar a la víctima en horizontal. Tardías (pasadas casi 24 horas o hasta once días): disfunción multiorgánica por shock mantenido, que Lloyd atribuye a un fracaso renal agudo.","Inmediata («muerte del rescate»): sobrecarga aguda del ventrículo derecho por retorno masivo de sangre al colocar a la víctima en horizontal. Tardías (pasadas casi 24 horas o hasta once días): disfunción multiorgánica por shock mantenido, que Lloyd atribuye a una coagulopatía de consumo.","Inmediata («muerte del rescate»): sobrecarga aguda del ventrículo derecho por retorno masivo de sangre al mantener a la víctima semisentada. Tardías (pasadas casi 24 horas o hasta once días): disfunción multiorgánica por shock mantenido, que Lloyd atribuye a un fracaso renal agudo.","Inmediata («muerte del rescate»): sobrecarga aguda del ventrículo derecho por retorno masivo de sangre al colocar a la víctima en horizontal. Tardías (pasadas casi 24 horas o hasta once semanas): disfunción multiorgánica por shock mantenido, que Lloyd atribuye a un fracaso renal agudo."],"Según 11.2, la muerte inmediata al rescate podría deberse a una sobrecarga aguda del ventrículo derecho por retorno masivo de la sangre acumulada al colocar a la víctima en posición HORIZONTAL; la posición semisentada es precisamente la que el 11.4 recomienda para evitarlo (falla «al mantener a la víctima semisentada»). Las muertes tardías se produjeron pasadas casi 24 horas o hasta once DÍAS (no «once semanas») y podrían deberse a disfunción multiorgánica por shock mantenido. Lloyd las atribuye a un fracaso renal agudo; la coagulopatía de consumo (CID) se relaciona en el temario con la tromboplastina, no con Lloyd."],
[10,"Al colocar en horizontal a una víctima rescatada, ciertas sustancias pueden pasar a la circulación general (síndrome de isquemia-reperfusión). ¿Qué asociación entre sustancia y efecto recoge el apartado 11.2?",["El potasio, cuyo paso rápido causa una hiperpotasemia capaz de provocar arritmias letales, y la tromboplastina, que podría originar la coagulopatía de consumo (CID) hallada en algunos fallecimientos tardíos.","El potasio, cuyo paso rápido causa una hipopotasemia capaz de provocar arritmias letales, y la tromboplastina, que podría originar la coagulopatía de consumo (CID) hallada en algunos fallecimientos tardíos.","El potasio, cuyo paso rápido causa una hiperpotasemia capaz de provocar arritmias letales, y la tromboplastina, que podría originar la coagulopatía de consumo (CID) hallada en todos los fallecimientos inmediatos.","El potasio, cuyo paso lento y sostenido causa una hiperpotasemia capaz de provocar arritmias letales, y la tromboplastina, que podría originar la coagulopatía de consumo (CID) hallada en algunos fallecimientos tardíos."],"El 11.2 explica que la isquemia-reperfusión puede provocar el paso RÁPIDO (no «lento y sostenido») de sustancias como el potasio. La HIPERpotasemia (no «hipopotasemia») puede ser la causante de arritmias letales. La irrupción de tromboplastina podría originar cuadros de coagulopatía de consumo (CID) hallados en ALGUNOS fallecimientos TARDÍOS, no «en todos los fallecimientos inmediatos»."],
[10,"En un ensayo con voluntarios suspendidos inmóviles se comprueba pulso periférico en las cuatro extremidades. Un instructor sostiene: «**No** es cierto que **no** carezca de fundamento atribuir el cuadro a una compresión arterial por las correas». ¿Qué interpretación **NO** contradice ni esa afirmación ni el apartado 11.2?",["Atribuirlo a compresión arterial carece de fundamento, pues la persistencia del pulso periférico la descartó; las correas sí parecen comprimir los nervios, y las parestesias podrían deberse a isquemia nerviosa en la zona de apoyo.","Atribuirlo a compresión arterial tiene fundamento, pues la persistencia del pulso periférico la confirmó; las correas sí parecen comprimir los nervios, y las parestesias podrían deberse a isquemia nerviosa en la zona de apoyo.","Atribuirlo a compresión arterial carece de fundamento, pues la ausencia del pulso periférico la descartó; las correas sí parecen comprimir los nervios, y las parestesias podrían deberse a isquemia nerviosa en la zona de apoyo.","Atribuirlo a compresión arterial carece de fundamento, pues la persistencia del pulso periférico la descartó; las correas tampoco parecen comprimir los nervios, y las parestesias se deben solo a la edematización de la extremidad."],"Triple negación: «no carezca de fundamento» equivale a «tenga fundamento», y «no es cierto que tenga fundamento» significa que CARECE de fundamento (falla «tiene fundamento... la confirmó»). Según 11.2, la compresión arterial quedó descartada por la PERSISTENCIA (no «ausencia») de pulso periférico en todas las extremidades. Las correas no parecen ejercer una compresión arterial importante, pero SÍ parecen comprimir los nervios, y las parestesias podrían deberse a isquemia nerviosa en la zona de apoyo, por lo que es falso que «tampoco» compriman los nervios."],
[10,"Una víctima inconsciente cuelga inmóvil de su arnés. Según la fase de rescate del apartado 11.4, ¿qué secuencia de actuación es la correcta?",["Rescate rápido, que se impone a cualquier otra maniobra → control de la permeabilidad de la vía aérea → posición fetal, alternativa a la lateral de seguridad, unos 20 a 40 minutos → paso gradual a la horizontal, monitorizando constantes durante todo el proceso.","Rescate rápido, que se impone a cualquier otra maniobra → posición fetal, alternativa a la lateral de seguridad, unos 20 a 40 minutos → control de la permeabilidad de la vía aérea → paso gradual a la horizontal, monitorizando constantes durante todo el proceso.","Rescate rápido, que se impone a cualquier otra maniobra → control de la permeabilidad de la vía aérea → posición horizontal unos 20 a 40 minutos → paso gradual a la posición fetal, alternativa a la lateral de seguridad, monitorizando constantes durante todo el proceso.","Estabilización completa de la víctima mientras sigue suspendida → rescate → control de la permeabilidad de la vía aérea → posición fetal, alternativa a la lateral de seguridad, unos 20 a 40 minutos → paso gradual a la horizontal, monitorizando constantes."],"Según 11.4, el primer objetivo terapéutico es rescatar a la víctima con vida y el rescate rápido se impone ante cualquier otra maniobra (falla «estabilización completa... mientras sigue suspendida»). En inconscientes, la posición fetal se adopta UNA VEZ controlada la permeabilidad de la vía aérea, no antes (falla la secuencia que pone la vía aérea tras la posición fetal). Esa posición se mantiene unos 20 a 40 minutos y DESPUÉS se pasa gradualmente a la horizontal, no al revés («posición horizontal unos 20 a 40 minutos»), monitorizando las constantes durante todo el proceso."],
[10,"Sobre el cuadro de shock que produce el secuestro periférico de volumen sanguíneo, ¿cuál de las siguientes afirmaciones es la única **correcta** según el apartado 11.2?",["Es un shock similar al hipovolémico con hipoxia tisular; en sus fases iniciales puede haber un intento compensador con liberación de catecolaminas y, si fracasa, se pasa a un shock progresivo con pérdida de conciencia por isquemia-hipoxia cerebral.","Es un shock similar al cardiogénico con hipoxia tisular; en sus fases iniciales puede haber un intento compensador con liberación de catecolaminas y, si fracasa, se pasa a un shock progresivo con pérdida de conciencia por isquemia-hipoxia cerebral.","Es un shock similar al hipovolémico con hipoxia tisular; en sus fases iniciales puede haber un intento compensador con liberación de potasio y, si fracasa, se pasa a un shock progresivo con pérdida de conciencia por isquemia-hipoxia cerebral.","Es un shock similar al hipovolémico con hipoxia tisular; en sus fases iniciales puede haber un intento compensador con liberación de catecolaminas y, si fracasa, se pasa a un shock progresivo con pérdida de conciencia por hiperperfusión cerebral."],"El 11.2 describe un cuadro de shock similar al HIPOVOLÉMICO (no «cardiogénico»), con hipoxia tisular, englobable en los «shock hipovolémicos por secuestro». En las fases iniciales puede haber un intento compensador con liberación de CATECOLAMINAS (no «de potasio», sustancia que el temario sitúa en la isquemia-reperfusión tras el rescate). Si ese mecanismo falla se pasa a un shock progresivo en el que la isquemia-hipoxia cerebral por caída de la presión de perfusión produce la pérdida de conciencia, no una «hiperperfusión cerebral»."],
[10,"Una víctima rescatada presenta entumecimiento de las piernas y parestesias, y durante el traslado aparece hipotensión. El médico afirma: «**No** es cierto que la reposición volémica masiva **no** deba ceder el paso a los fármacos vasoactivos». ¿Qué valoración **NO** contradice esa afirmación ni la fase de transporte del apartado 11.4?",["Coincide con el temario: ante hipotensión son preferibles los fármacos vasoactivos, y el traslado debe ser rápido, a un centro con Unidad de Cuidados Críticos y con personal sanitario de reanimación avanzada acompañando en todo momento.","Contradice el temario: ante hipotensión es preferible la reposición volémica masiva, y el traslado debe ser rápido, a un centro con Unidad de Cuidados Críticos y con personal sanitario de reanimación avanzada acompañando en todo momento.","Coincide con el temario: ante hipotensión son preferibles los fármacos vasoactivos, y el traslado debe ser lento y gradual, a un centro con Unidad de Cuidados Críticos y con personal sanitario de reanimación avanzada acompañando en todo momento.","Coincide con el temario: ante hipotensión son preferibles los fármacos vasoactivos, y el traslado debe ser rápido, a un centro con Unidad de Cuidados Críticos y con personal sanitario de reanimación avanzada solo si pierde la conciencia."],"Doble negación: negar que la reposición volémica masiva «no deba ceder el paso» equivale a afirmar que SÍ debe cedérselo a los fármacos vasoactivos, que es lo que dice el 11.4 (falla «contradice el temario... reposición volémica masiva»). Ante síntomas como entumecimiento de las piernas o parestesias se recomienda el traslado a un centro con Unidad de Cuidados Críticos, y ese traslado debe ser RÁPIDO, no «lento y gradual» (lo gradual es el paso a la horizontal). La víctima debe ir acompañada EN TODO MOMENTO por personal sanitario entrenado en reanimación avanzada, no «solo si pierde la conciencia»."],
[11,"Se apoya contra una fachada una escalera simple de 6 m de longitud. Según el apartado 12.1, ¿qué distancia del pie a la vertical que pasa por el vértice cumple la norma y qué inclinación le corresponde?",["Entre 1,5 m y 2 m, es decir, entre el cuarto y el tercio de su longitud, correspondiendo una inclinación comprendida entre 75,5º y 70,5º.","Entre 1,2 m y 1,5 m, es decir, entre el quinto y el cuarto de su longitud, correspondiendo una inclinación comprendida entre 75,5º y 70,5º.","Entre 1,5 m y 2 m, es decir, entre el cuarto y el tercio de su longitud, correspondiendo una inclinación comprendida entre 65,5º y 60,5º.","Entre 2 m y 3 m, es decir, entre el tercio y la mitad de su longitud, correspondiendo una inclinación comprendida entre 75,5º y 70,5º."],"Según 12.1, la distancia del pie a la vertical que pasa por el vértice debe estar entre el CUARTO y el TERCIO de la longitud de la escalera, lo que corresponde a una inclinación entre 75,5º y 70,5º. Para 6 m: 6/4 = 1,5 m y 6/3 = 2 m. «Entre 1,2 m y 1,5 m» toma el quinto como límite y «entre 2 m y 3 m» llega a la mitad, ambos fuera del rango; «65,5º y 60,5º» no es la inclinación que fija el temario."],
[11,"Una torre de trabajo móvil tiene una base de 1,35 m × 2,50 m y el fabricante no indica nada distinto (estabilizadores, aumento del lado menor, etc.). Según el apartado 12.2, ¿cuál es su altura máxima admisible y cómo se mide?",["5,40 m, porque la altura desde el suelo hasta la última plataforma no puede exceder de 4 m por cada metro del lado menor de la base.","10 m, porque la altura desde el suelo hasta la última plataforma no puede exceder de 4 m por cada metro del lado mayor de la base.","4,05 m, porque la altura desde el suelo hasta la última plataforma no puede exceder de 3 m por cada metro del lado menor de la base.","5,40 m, porque la altura desde el suelo hasta la barandilla superior no puede exceder de 4 m por cada metro del lado menor de la base."],"El 12.2 limita la altura de las torres de acceso y de trabajo móviles, medida desde el suelo hasta la ÚLTIMA PLATAFORMA (no «hasta la barandilla superior»), a 4 m por cada metro del lado MENOR: 4 × 1,35 = 5,40 m. «10 m» aplica la regla al lado mayor (4 × 2,50) y «4,05 m» usa una proporción de 3 m por metro, que no es la del temario."],
[11,"Sobre las protecciones y dimensiones de una torre de andamio que recoge el apartado 12.2, ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Barandilla a 1 m sobre la plataforma en los cuatro lados, barra intermedia a 50 cm y rodapié de al menos 15 cm; anchura mínima de 60 cm en zonas de trabajo y 50 cm en zonas de paso; primer peldaño del acceso a 400 mm del suelo como máximo (600 mm si es una plataforma).","Barandilla a 0,9 m sobre la plataforma en los cuatro lados, barra intermedia a 50 cm y rodapié de al menos 15 cm; anchura mínima de 60 cm en zonas de trabajo y 50 cm en zonas de paso; primer peldaño del acceso a 400 mm del suelo como máximo (600 mm si es una plataforma).","Barandilla a 1 m sobre la plataforma en los cuatro lados, barra intermedia a 50 cm y rodapié de al menos 15 cm; anchura mínima de 50 cm en zonas de trabajo y 60 cm en zonas de paso; primer peldaño del acceso a 400 mm del suelo como máximo (600 mm si es una plataforma).","Barandilla a 1 m sobre la plataforma en los cuatro lados, barra intermedia a 50 cm y rodapié de al menos 15 cm; anchura mínima de 60 cm en zonas de trabajo y 50 cm en zonas de paso; primer peldaño del acceso a 600 mm del suelo como máximo (400 mm si es una plataforma)."],"Según 12.2, la plataforma se protege en los cuatro lados con barandilla a 1 m (no «0,9 m»), barra intermedia a 50 cm y rodapié de 15 cm como mínimo. La anchura mínima es de 60 cm en zonas de TRABAJO y 50 cm en zonas de PASO, no al revés. El acceso no debe descansar sobre el suelo y el primer peldaño estará a 400 mm como máximo, o a 600 mm cuando el primer escalón sea una plataforma; invertir esas cifras es incorrecto."],
[11,"Antes de subir a una escalera doble de tijera, ¿qué afirmación sobre su abertura y sus riesgos específicos es correcta según el apartado 12.1?",["Su abertura será de 30º como máximo, con la cuerda que une los dos planos extendida o el limitador de abertura bloqueado; la rotura de esa cuerda de unión figura entre los riesgos de las escaleras de tijera doble o transformables.","Su abertura será de 30º como mínimo, con la cuerda que une los dos planos extendida o el limitador de abertura bloqueado; la rotura de esa cuerda de unión figura entre los riesgos de las escaleras de tijera doble o transformables.","Su abertura será de 45º como máximo, con la cuerda que une los dos planos extendida o el limitador de abertura bloqueado; la rotura de esa cuerda de unión figura entre los riesgos de las escaleras de tijera doble o transformables.","Su abertura será de 30º como máximo, con la cuerda que une los dos planos destensada o el limitador de abertura desbloqueado; la rotura de esa cuerda de unión figura entre los riesgos de las escaleras de tijera doble o transformables."],"El 12.1 fija un ángulo de abertura de 30º como MÁXIMO (no «como mínimo» ni «45º»). Esa abertura se garantiza con la cuerda que une los dos planos EXTENDIDA o con el limitador de abertura BLOQUEADO, no con la cuerda «destensada» o el limitador «desbloqueado». Entre los riesgos figura la rotura de la cuerda de unión entre los dos planos de una escalera de tijera doble o transformable."],
[11,"El apartado 12.1 clasifica los sistemas de sujeción y apoyo de las escaleras según el principio en que se basan y el tipo de suelo. ¿Qué clasificación es la correcta?",["Fricción: zapatas de caucho o neopreno ranuradas en suelos de cemento y zapatas abrasivas en suelos secos. Hinca: zapata en forma de sierra en suelos helados y puntas de hierro en suelos de madera.","Fricción: zapatas de caucho o neopreno ranuradas en suelos de cemento y zapatas abrasivas en suelos helados. Hinca: zapata en forma de sierra en suelos helados y puntas de hierro en suelos de madera.","Fricción: zapatas de caucho o neopreno ranuradas en suelos de cemento y zapatas abrasivas en suelos secos. Hinca: zapata en forma de sierra en suelos helados y puntas de hierro en suelos de cemento.","Fricción: zapatas de caucho o neopreno ranuradas en suelos de cemento. Hinca: zapatas abrasivas en suelos secos, zapata en forma de sierra en suelos helados y puntas de hierro en suelos de madera."],"Según 12.1, la FRICCIÓN se basa en un fuerte incremento del coeficiente de rozamiento: zapatas antiderrapantes de caucho o neopreno en suelos de cemento y zapatas abrasivas en suelos SECOS (no «helados»). Por eso las zapatas abrasivas no son un sistema de «hinca». La HINCA se basa en la penetración: zapata en forma de sierra en suelos helados y puntas de hierro en suelos de MADERA, no «de cemento»."],
