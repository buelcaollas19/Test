[3,"Para instalar un punto de anclaje deslizante sobre una cuerda mojada se monta un Machard con un cordino de 20 kN. El jefe de equipo afirma: «**No** es cierto que el Machard de dos senos **no** aproveche más resistencia que el de un seno». Según 4.5, ¿qué interpretación **NO** contradice ni esa afirmación ni el temario?",["Con un seno resiste unos 10 kN (50%) y bloquea en una dirección que depende de por dónde se introduce el seno, con un mínimo de 6 o 7 vueltas en cuerda mojada; con dos senos es bidireccional y aprovecha los 20 kN (100%).","Con un seno resiste los 20 kN (100%) y bloquea en una dirección que depende de por dónde se introduce el seno, con un mínimo de 6 o 7 vueltas en cuerda mojada; con dos senos es bidireccional y aprovecha unos 10 kN (50%).","Con un seno resiste unos 10 kN (50%) y bloquea en una dirección que depende de por dónde se introduce el seno, con un mínimo de 3 o 4 vueltas en cuerda mojada; con dos senos es bidireccional y aprovecha los 20 kN (100%).","Con un seno resiste unos 10 kN (50%) y bloquea en una dirección que depende de por dónde se introduce el seno, con un mínimo de 6 o 7 vueltas en cuerda mojada; con dos senos es unidireccional y aprovecha los 20 kN (100%)."],"Doble negación: «no es cierto que no aproveche más» equivale a afirmar que el de dos senos SÍ aprovecha más resistencia. 4.5: con un seno resiste el 50% del cordino (10 kN) y bloquea en una u otra dirección según por dónde se introduzca el seno, bien en cuerdas mojadas con un mínimo de 6 o 7 vueltas; con dos senos es bidireccional y aprovecha el 100% (20 kN). Falla la que intercambia los porcentajes (contradice la afirmación), la de «3 o 4 vueltas» y la que lo llama «unidireccional»."],
[3,"Sobre la resistencia final o residual de un nudo y su «peinado» (4.1), ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Un nudo bien peinado, con las cuerdas siempre paralelas y sin montarse entre sí en el trenzado, estrangula menos los tejidos, se identifica más fácilmente y cuesta menos deshacerlo tras ser sometido a tensión.","Un nudo bien peinado, con las cuerdas cruzadas y montadas entre sí en el trenzado, estrangula menos los tejidos, se identifica más fácilmente y cuesta menos deshacerlo tras ser sometido a tensión.","Un nudo bien peinado, con las cuerdas siempre paralelas y sin montarse entre sí en el trenzado, estrangula menos los tejidos, se identifica más fácilmente, aunque cuesta más deshacerlo tras ser sometido a tensión.","Un nudo bien peinado, con las cuerdas siempre paralelas y sin montarse entre sí en el trenzado, elimina por completo la pérdida de resistencia por estrangulamiento, se identifica más fácilmente y cuesta menos deshacerlo."],"«NO es incorrecta» equivale a «es correcta». 4.1: todo nudo hace perder resistencia por estrangulamiento y deja una resistencia final o residual; para MINIMIZAR esa merma, el nudo debe estar peinado (cuerdas siempre paralelas que no montan entre sí), con lo que el estrangulamiento es menor, se identifica más fácilmente y cuesta menos deshacerlo tras la tensión. Falla la de cuerdas «cruzadas y montadas», la de «cuesta más deshacerlo» y la que dice que «elimina por completo la pérdida»."],
[3,"Un bombero debe anudar primero la cuerda a una barandilla y, después, a un mosquetón. Según 4.1 y 4.2, ¿qué planteamiento es correcto?",["En la barandilla, nudo por chicote, por ser un elemento sin apertura; en el mosquetón, nudo por seno, por disponer de apertura; el chicote es el extremo de la cuerda y el seno, el asa que se forma al plegarla sobre sí misma.","En la barandilla, nudo por seno, por ser un elemento sin apertura; en el mosquetón, nudo por chicote, por disponer de apertura; el chicote es el extremo de la cuerda y el seno, el asa que se forma al plegarla sobre sí misma.","En la barandilla, nudo por chicote, por ser un elemento sin apertura; en el mosquetón, nudo por seno, por disponer de apertura; el seno es el extremo de la cuerda y el chicote, el asa que se forma al plegarla sobre sí misma.","En la barandilla, nudo por chicote, por ser un elemento sin apertura; en el mosquetón, también por chicote, porque los nudos de anclaje no pueden hacerse por seno; el chicote es el extremo de la cuerda y el seno, el asa que se forma al plegarla."],"4.1: el chicote es el extremo de la cuerda y el seno, el asa que se forma al plegarla sobre sí misma. 4.2: los nudos de anclaje se hacen por seno para anclar en un elemento con apertura (un mosquetón) y por chicote para elementos sin apertura o cerrados, como una barandilla. Falla la que intercambia «barandilla, nudo por seno» y «mosquetón, nudo por chicote», la que intercambia las definiciones de seno y chicote y la que dice que los nudos de anclaje «no pueden hacerse por seno»."],
[3,"Para instalar un pasamanos horizontal cuyos puntos de anclaje no están en línea, se duda entre ballestrinque y mariposa. Según 4.2, ¿qué comparación es correcta?",["Ambos anclan la cuerda en puntos intermedios y se regulan con facilidad, pero la mariposa permite ajustar la gaza a voluntad sin estrangularse sobre el anclaje, y el ballestrinque puede deslizar sobre los 400 daN y pierde entre el 45% y el 65%.","Ambos anclan la cuerda en puntos intermedios y se regulan con facilidad, pero el ballestrinque permite ajustar la gaza a voluntad sin estrangularse sobre el anclaje, y la mariposa puede deslizar sobre los 400 daN y pierde entre el 45% y el 65%.","Ambos anclan la cuerda en puntos intermedios y se regulan con facilidad, pero la mariposa permite ajustar la gaza a voluntad sin estrangularse sobre el anclaje, y el ballestrinque puede deslizar sobre los 600 daN y pierde entre el 45% y el 65%.","Ambos anclan la cuerda en puntos intermedios y se regulan con facilidad, pero la mariposa permite ajustar la gaza a voluntad sin estrangularse sobre el anclaje, y el ballestrinque puede deslizar sobre los 400 daN y pierde entre el 20% y el 30%."],"4.2: ballestrinque y mariposa permiten anclar en puntos intermedios y regularse con facilidad; la ventaja de la mariposa es que la gaza se ajusta a voluntad sin que el nudo se estrangule sobre el anclaje, y es útil en pasamanos y líneas de vida con anclajes que no están en línea. El ballestrinque desliza sobre los 400 daN y pierde entre el 45% y el 65%. Falla la que intercambia los nudos, la de «600 daN» y la de «entre el 20% y el 30%» (pérdida del ocho)."],
[3,"Por no disponer de dispositivos mecánicos, se frena un descenso de emergencia con nudo dinámico y después se bloquea en carga. Según 4.3, ¿qué secuencia y características son correctas?",["Frenar con el dinámico, que cambia la dirección de funcionamiento sin deshacerlo; bloquearlo con el nudo de fuga, ejecutable con la cuerda en tensión; rematar la gaza final o cerrarla con mosquetón; desbloquear con un tirón del extremo libre.","Frenar con el dinámico, que para cambiar la dirección de funcionamiento debe deshacerse; bloquearlo con el nudo de fuga, ejecutable con la cuerda en tensión; rematar la gaza final o cerrarla con mosquetón; desbloquear con un tirón del extremo libre.","Frenar con el dinámico, que cambia la dirección de funcionamiento sin deshacerlo; bloquearlo con el nudo de fuga, ejecutable solo con la cuerda sin tensión; rematar la gaza final o cerrarla con mosquetón; desbloquear con un tirón del extremo libre.","Frenar con el dinámico, que cambia la dirección de funcionamiento sin deshacerlo; bloquearlo con el nudo de fuga, ejecutable con la cuerda en tensión; rematar la gaza final o cerrarla con mosquetón; desbloquear solo tras deshacer el dinámico."],"4.3: el nudo dinámico permite cambiar la dirección de funcionamiento con un simple gesto sin deshacerlo; su bloqueo (nudo de fuga) se ejecuta con la cuerda en tensión, conviene rematar la gaza final o cerrarla con mosquetón para que no se deshaga accidentalmente, y se desbloquea con un simple tirón del extremo libre. Falla la de «debe deshacerse» para cambiar de dirección, la de «solo con la cuerda sin tensión» y la de «desbloquear solo tras deshacer el dinámico»."],
[3,"Todas las descripciones siguientes del nudo de alondra se ajustan a 4.2 **excepto** una. ¿Cuál **no** se ajusta?",["Se hace con anillos de cinta o cordinos y sirve para unir dos tramos de cuerda de distinto diámetro; con diámetros pequeños y cargas grandes, la cinta puede perder casi el 50% de resistencia.","Se hace con anillos de cinta o cordinos y sirve para unir dos o más anillos entre sí; con diámetros pequeños y cargas grandes, la cinta puede perder casi el 50% de resistencia.","Se hace con anillos de cinta o cordinos y sirve para unirla a nuestro arnés y asegurarnos; con diámetros pequeños y cargas grandes, la cinta puede perder casi el 50% de resistencia.","Se hace con anillos de cinta o cordinos y sirve para abrazar materiales o realizar desvíos; con diámetros pequeños y cargas grandes, la cinta puede perder casi el 50% de resistencia."],"Se pide la descripción que NO se ajusta a 4.2. La alondra se hace con anillos de cinta o cordinos y se usa para unir dos o más anillos, unirla al arnés para asegurarnos, abrazar materiales o realizar desvíos; con diámetros pequeños y cargas grandes la cinta puede perder casi el 50%. «Unir dos tramos de cuerda de distinto diámetro» no es un uso de la alondra, sino del pescador doble (4.4); las otras tres recogen usos expresos («dos o más anillos», «a nuestro arnés», «abrazar materiales o realizar desvíos»)."],
[3,"Hay que unir dos cuerdas de diámetros diferentes. Según 4.4, ¿qué afirmación es correcta?",["Procede el pescador doble, cuyos dos nudos dobles abrazan las cuerdas, que se estrangulan por oposición al traccionar de ambas; el ocho cosido solo une cuerdas de igual diámetro.","Procede el ocho cosido, que une cuerdas de igual o diferente diámetro; el pescador doble, cuyos dos nudos dobles abrazan las cuerdas, solo une cuerdas de igual diámetro.","Procede el pescador doble, cuyos dos nudos simples abrazan las cuerdas, que se estrangulan por oposición al traccionar de ambas; el ocho cosido solo une cuerdas de igual diámetro.","Procede el pescador doble, cuyos dos nudos dobles abrazan las cuerdas, que se aflojan por oposición al traccionar de ambas; el ocho cosido solo une cuerdas de igual diámetro."],"4.4: el pescador doble une cuerdas de igual o diferente diámetro; sus dos nudos DOBLES abrazan las cuerdas, que se ESTRANGULAN por oposición al traccionar de ambas. El ocho cosido une cuerdas solo de igual diámetro. Falla la que atribuye al ocho cosido la unión de «diferente diámetro» (intercambia los nudos), la de «dos nudos simples» y la de «se aflojan por oposición»."],
[3,"Según 4.2, ¿qué relación entre la ejecución y el uso de los nudos de la familia del ocho es correcta?",["El ocho se comienza como la gaza simple, pero con medio giro más; el nueve lleva una vuelta más que el ocho y es fácil de deshacer tras cargas pesadas; el ocho de dos gazas se usa mayormente en sistemas con doble punto de anclaje.","El ocho se comienza como la gaza simple, pero con una vuelta más; el nueve lleva medio giro más que el ocho y es fácil de deshacer tras cargas pesadas; el ocho de dos gazas se usa mayormente en sistemas con doble punto de anclaje.","El ocho se comienza como la gaza simple, pero con medio giro más; el nueve lleva una vuelta más que el ocho y es difícil de deshacer tras cargas pesadas; el ocho de dos gazas se usa mayormente en sistemas con doble punto de anclaje.","El ocho se comienza como la gaza simple, pero con medio giro más; el nueve lleva una vuelta más que el ocho y es fácil de deshacer tras cargas pesadas; el siete (ocho en línea) se usa mayormente en sistemas con doble punto de anclaje."],"4.2: el ocho se comienza como la gaza simple con MEDIO GIRO más; el nueve lleva UNA VUELTA más que el ocho, se usa para grandes cargas y es FÁCIL de deshacer tras cargas pesadas; el ocho de dos gazas se usa mayormente en sistemas con doble punto de anclaje. Falla la que intercambia «una vuelta» y «medio giro», la de «difícil de deshacer» (rasgo de la gaza simple) y la que asigna el doble punto de anclaje al «siete», que sirve para puntos de anclaje fijos intermedios."],
[3,"Sobre los nudos deslizantes (4.3), un formador afirma: «**No** es cierto que **no** deban complementarse con otros nudos de bloqueo». ¿Qué interpretación **NO** contradice ni esa afirmación ni el temario?",["Deslizan al someterse a tensión, pero con gran capacidad de frenado por rozamiento; sirven para frenar cargas, asegurar progresiones y descender en emergencia si no hay dispositivos mecánicos, siempre con especial vigilancia y complementados con nudos de bloqueo.","Deslizan al someterse a tensión, pero con gran capacidad de frenado por rozamiento; sirven para frenar cargas, asegurar progresiones y descender en emergencia si no hay dispositivos mecánicos, siempre con especial vigilancia, pero sin necesidad de nudos de bloqueo.","Bloquean al someterse a tensión, con gran capacidad de frenado por rozamiento; sirven para frenar cargas, asegurar progresiones y descender en emergencia si no hay dispositivos mecánicos, siempre con especial vigilancia y complementados con nudos de bloqueo.","Deslizan al someterse a tensión, pero con gran capacidad de frenado por rozamiento; sirven para frenar cargas, asegurar progresiones y descender en emergencia con preferencia sobre los dispositivos mecánicos, con especial vigilancia y complementados con nudos de bloqueo."],"Doble negación: «no es cierto que no deban» equivale a afirmar que SÍ deben complementarse con nudos de bloqueo. 4.3: los nudos deslizantes o de aseguramiento deslizan con tensión pero frenan mucho por rozamiento, sirven para frenar cargas, asegurar progresiones y descender en emergencia siempre que no se disponga de dispositivos mecánicos, y exigen especial vigilancia y complementarse con nudos de bloqueo. Falla la de «sin necesidad de nudos de bloqueo», la de «bloquean al someterse a tensión» y la de «con preferencia sobre los dispositivos mecánicos»."],
[4,"Según el apartado 5.2, los anclajes se identifican en tres tipos: artificiales, naturales y estructurales. ¿Cuál de las siguientes clasificaciones **no** coloca ningún elemento en una categoría distinta de la que le asigna el temario?",["Artificiales: cintas, puntales, trípodes y contrapesos. Naturales: árboles y rocas. Estructurales: tornillos de expansión, tornillos con cola, vigas de madera o acero y pilares.","Artificiales: cintas, puntales, trípodes y contrapesos. Naturales: árboles, rocas y pilares. Estructurales: tornillos de expansión, tornillos con cola y vigas de madera o acero.","Artificiales: cintas, puntales y contrapesos. Naturales: árboles y rocas. Estructurales: trípodes, tornillos de expansión, tornillos con cola, vigas de madera o acero y pilares.","Artificiales: cintas, puntales, trípodes, contrapesos y tornillos con cola. Naturales: árboles y rocas. Estructurales: tornillos de expansión, vigas de madera o acero y pilares."],"5.2: los artificiales son anclajes removibles colocados, no instalados de forma fija (cintas, puntales, trípodes, contrapesos); los naturales, elementos del lugar como árboles y rocas; los estructurales, anclajes permanentes instalados previamente (tornillos de expansión, tornillos con cola) o elementos de la construcción (vigas de madera o acero, pilares). Falla la que pone «rocas y pilares» entre los naturales, porque el pilar es un elemento de la estructura. Falla la que pasa los «trípodes» a estructurales, pues son removibles. Falla la que añade «tornillos con cola» a los artificiales, ya que son anclajes permanentes instalados previamente."],
[4,"Un equipo va a montar una instalación con anclajes artificiales: un puntal metálico y una cinta de anclaje, que se completará con chapas. Según el apartado 5.2, ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Por la norma EN 795, el puntal metálico debe poder soportar 12 kN y la cinta, por ser no metálica, 18 kN; las chapas resisten normalmente 22 kN y, aun así, se usan como mínimo dos.","Por la norma EN 795, el puntal metálico debe poder soportar 18 kN y la cinta, por ser no metálica, 12 kN; las chapas resisten normalmente 22 kN y, aun así, se usan como mínimo dos.","Por la norma EN 795, el puntal metálico debe poder soportar 12 kN y la cinta, por ser no metálica, 18 kN; las chapas resisten normalmente 22 kN y, por eso, basta con instalar una sola.","Por la norma EN 795, el puntal metálico debe poder soportar 12 kN y la cinta, por ser no metálica, 22 kN; las chapas resisten normalmente 18 kN y, aun así, se usan como mínimo dos."],"«NO es incorrecta» equivale a pedir la correcta. 5.2: los anclajes artificiales deben cumplir la EN 795 y soportar 12 kN, o 18 kN si son no metálicos (cintas, cuerdas); las chapas tienen normalmente 22 kN y, «aún con una resistencia tan elevada», se usan dos como mínimo. Falla la que invierte las cifras («18 kN» para el puntal y «12 kN» para la cinta), la que concluye que «basta con instalar una sola» chapa y la que atribuye «22 kN» a la cinta y «18 kN» a las chapas."],
[4,"Hay que instalar un taco de expansión «parabolt» en un muro de hormigón para colocar después una chapa. Según el apartado 5.2, ¿cuál es la secuencia correcta?",["Evaluar el soporte; taladrar, normalmente a 10 mm de Ø; introducir el anclaje con la tuerca cubriendo los últimos pasos de rosca; apretar al par del fabricante; retirar la tuerca; colocar la chapa; apretar de nuevo.","Evaluar el soporte; taladrar, normalmente a 12 mm de Ø; introducir el anclaje con la tuerca cubriendo los últimos pasos de rosca; apretar al par del fabricante; retirar la tuerca; colocar la chapa; apretar de nuevo.","Evaluar el soporte; taladrar, normalmente a 10 mm de Ø; introducir el anclaje con la tuerca dejando libres los últimos pasos de rosca; apretar al par del fabricante; retirar la tuerca; colocar la chapa; apretar de nuevo.","Evaluar el soporte; taladrar, normalmente a 10 mm de Ø; introducir el anclaje con la tuerca cubriendo los últimos pasos de rosca; retirar la tuerca; colocar la chapa; apretar al par del fabricante; apretar de nuevo."],"5.2 (parabolt): se evalúa el soporte, se taladra normalmente a 10 mm de Ø, se introduce el anclaje con la tuerca cubriendo los últimos pasos de rosca, se aprieta al par del fabricante, se retira la tuerca para introducir la chapa y se aprieta de nuevo. Falla «12 mm», que es el diámetro habitual del anclaje químico en soporte macizo. Falla «dejando libres los últimos pasos de rosca», porque la tuerca debe cubrirlos. Falla la que retira la tuerca y coloca la chapa antes del primer apriete al par del fabricante."],
[4,"Hay que colocar un anclaje químico en un muro de ladrillo hueco. Un compañero afirma: «**No** es cierto que la instalación en soporte hueco **no** se diferencie en ningún paso de la instalación en soporte macizo». Según el apartado 5.2, ¿qué interpretación **NO** contradice esa afirmación ni el procedimiento del temario?",["La afirmación es verdadera: en hueco se taladra normalmente a 16 mm de Ø, frente a 12 mm en macizo, y tras soplar el interior se introduce el tamiz antes de inyectar la resina, paso que no figura en macizo.","La afirmación es verdadera: en hueco se taladra normalmente a 12 mm de Ø, frente a 16 mm en macizo, y tras soplar el interior se introduce el tamiz antes de inyectar la resina, paso que no figura en macizo.","La afirmación es verdadera: en hueco se taladra normalmente a 16 mm de Ø, frente a 12 mm en macizo, y se inyecta la resina antes de introducir el tamiz y después el anclaje, paso que no figura en macizo.","La afirmación es verdadera solo por el diámetro: en hueco se taladra normalmente a 16 mm de Ø, frente a 12 mm en macizo, y en ambos soportes se introduce el tamiz tras soplar el interior del taladro."],"Doble negación: «no es cierto que no se diferencie» equivale a afirmar que SÍ se diferencia en algún paso, lo cual es verdadero. 5.2: en soporte hueco el taladro es normalmente de 16 mm de Ø y, tras soplar, se introduce el tamiz y después se inyecta la resina; en macizo el taladro es de 12 mm y no hay tamiz. Falla la que invierte los diámetros («12 mm» en hueco y «16 mm» en macizo), la que «inyecta la resina antes de introducir el tamiz» y la que dice que «en ambos soportes se introduce el tamiz»."],
[4,"Sobre los anclajes químicos descritos en el apartado 5.2, ¿cuál de las siguientes afirmaciones es **FALSA**?",["Su principal ventaja es el corto tiempo de puesta en carga de la resina, y no debilitan la zona donde se colocan por no ser de expansión mecánica.","Su inconveniente es el tiempo de puesta en carga por el fraguado de la resina, y no debilitan la zona donde se colocan por no ser de expansión mecánica.","Su inconveniente es el tiempo de puesta en carga por el fraguado de la resina, y permiten su uso en elementos blandos o huecos por no ser de expansión mecánica.","Su inconveniente es el tiempo de puesta en carga por el fraguado de la resina, y en lugares húmedos y sombríos ese fraguado puede requerir más tiempo del indicado."],"Se busca la afirmación falsa. 5.2 señala como inconveniente del anclaje químico el tiempo de puesta en carga, porque la resina necesita un tiempo de fraguado; es falso, por tanto, presentar como «principal ventaja» un «corto tiempo de puesta en carga». Las otras tres son ciertas: al no ser de expansión mecánica no debilita la zona y admite elementos blandos o huecos, y el tiempo de fraguado del fabricante hay que respetarlo e incluso incrementarlo en lugares húmedos y sombríos."],
[4,"Solo se dispone de un árbol de gran porte y aspecto muy sólido. El jefe de equipo afirma: «**No** es falso que **no** podamos confiar la instalación a ese árbol como anclaje completo». Según los apartados 5.1 y 5.2, ¿qué interpretación **NO** contradice esa afirmación?",["La afirmación es correcta: pese a aparentar consistencia, el árbol se trata siempre como medio anclaje y se usa en combinación con un segundo anclaje de sus mismas características.","La afirmación es incorrecta: si aparenta consistencia, el árbol puede tratarse como anclaje completo, aunque conviene combinarlo con un segundo de sus mismas características.","La afirmación es correcta: salvo que aparente consistencia, el árbol se trata como medio anclaje y se usa en combinación con un segundo anclaje de sus mismas características.","La afirmación es correcta: pese a aparentar consistencia, el árbol se trata siempre como medio anclaje y se combina con un segundo anclaje que debe ser artificial o estructural."],"Doble negación: «no es falso que no podamos» equivale a «es verdad que no podemos» confiar en el árbol como anclaje completo. 5.2 (naturales): «a pesar de aparentar consistencia, siempre los vamos a tratar como medio anclaje» y se combinan con «un segundo de las mismas características»; 5.1 añade que nunca se confía una instalación a un solo punto. Falla «la afirmación es incorrecta», falla «salvo que aparente consistencia», que convierte el «siempre» en una excepción, y falla «debe ser artificial o estructural», porque el segundo ha de tener las mismas características."],
[4,"Respecto al taco de expansión mecánica «parabolt», ¿cuál de las siguientes afirmaciones es la **única** correcta según el apartado 5.2?",["Está diseñado para soportes compactos tipo hormigón y roca, nunca debe instalarse en ladrillo hueco ni macizo y, por actuar por expansión, no debe colocarse cerca de otros anclajes similares, grietas estructurales o bordes.","Está diseñado para soportes compactos tipo hormigón y roca, puede instalarse en ladrillo macizo pero nunca en hueco y, por actuar por expansión, no debe colocarse cerca de otros anclajes similares, grietas estructurales o bordes.","Está diseñado para soportes compactos tipo hormigón y roca, nunca debe instalarse en ladrillo hueco ni macizo y, por actuar por expansión, conviene colocarlo junto a otros anclajes similares, lejos de grietas estructurales o bordes.","Está diseñado para soportes compactos tipo hormigón y roca, nunca debe instalarse en ladrillo hueco ni macizo y, como no debilita la zona donde se coloca, puede situarse cerca de otros anclajes similares, grietas o bordes."],"5.2: el «parabolt» está diseñado para soportes compactos tipo hormigón y roca y «nunca debe instalarse sobre ladrillo hueco o ladrillo macizo»; al ser un anclaje mecánico que actúa por expansión, no debe colocarse cerca de otros anclajes similares, grietas estructurales o bordes. Falla «puede instalarse en ladrillo macizo». Falla «conviene colocarlo junto a otros anclajes similares». Falla «no debilita la zona donde se coloca», propiedad que el temario atribuye al anclaje químico precisamente por no ser de expansión mecánica."],
[4,"Sobre el trípode descrito en el apartado 5.2, todas las afirmaciones siguientes son ciertas **excepto** una. ¿Cuál **no** lo es?",["Es un anclaje estructural fijo, diseñado para trabajos en huecos o espacios confinados, que además del anclaje principal dispone de un anclaje adicional de seguro para la línea anticaída.","Es un anclaje portátil, diseñado para trabajos en huecos o espacios confinados, que además del anclaje principal dispone de un anclaje adicional de seguro para la línea anticaída.","Es un anclaje portátil, rápido de instalar y muy estable, cuya fijación al firme o arriostramiento con vientos multidireccionales se valora según las cargas y las direcciones de tiro.","Es un anclaje portátil incluido entre los artificiales, anclajes removibles que no se instalan de forma fija y que deben cumplir la norma EN 795, como las cintas o los puntales."],"Se busca la única falsa. 5.2 incluye el trípode entre los anclajes artificiales, removibles y no fijos, que deben cumplir la EN 795, y lo describe como anclaje portátil para huecos o espacios confinados, rápido de instalar, muy estable y con un anclaje adicional de seguro para la línea anticaída; su fijación al firme o arriostramiento con vientos multidireccionales se valora según cargas y direcciones de tiro. Es falso, por tanto, llamarlo «anclaje estructural fijo»: los estructurales son anclajes permanentes o elementos de la propia construcción."],
[4,"Se va a abrazar una viga con un anillo de anclaje para montar un sistema de maniobra de cargas. Según el apartado 5.2, ¿cuál de las siguientes afirmaciones es correcta?",["Pueden ser de cinta, cuerda, eslinga, cable de acero o cadena; la viga debe soportar no solo nuestro peso, sino la fuerza de una caída o la tracción del sistema, y conviene siempre proteger el anillo de aristas y abrasiones.","Pueden ser de cinta, cuerda, eslinga, cable de acero o cadena; la viga debe soportar no solo nuestro peso, sino la fuerza de una caída o la tracción del sistema, y al estar diseñados para roces no precisan protección frente a aristas.","Pueden ser de cinta, cuerda, eslinga, cable de acero o cadena; la viga solo debe soportar nuestro peso, porque la fuerza de una caída o la tracción del sistema la absorbe el propio anillo, que conviene proteger de aristas.","Pueden ser de cinta, cuerda o eslinga, pero nunca de cable de acero ni de cadena; la viga debe soportar no solo nuestro peso, sino la fuerza de una caída o la tracción del sistema, y conviene proteger el anillo de aristas."],"5.2 (anillos y cintas): son anillos de cinta o auxiliares de cuerdas, eslingas, cables de acero o cadenas; hay que evaluar la estructura, que no solo soporta nuestro peso, sino también la fuerza de una caída o la tracción de sistemas de maniobra de cargas. Aun siendo resistentes y diseñados para soportar roces, siempre conviene protegerlos frente a aristas o abrasiones. Falla «no precisan protección frente a aristas», falla «la viga solo debe soportar nuestro peso» y falla «nunca de cable de acero ni de cadena»."],
[4,"Se instala un punto de anclaje único para impedir que un operario alcance una zona de riesgo. Según el apartado 5.2, ¿cuál de las siguientes descripciones **NO** contradice el temario?",["Se usa normalmente como protección ante una posible caída o para retener al usuario; se le une un cabo con bloqueador, una cuerda con regulación de longitud o una de longitud fija, y se enrosca con un par que no debilite el anclaje base.","Se usa normalmente como protección ante una posible caída o para retener al usuario; se le une un cabo con bloqueador, una cuerda con regulación de longitud o una de longitud fija, y se enrosca con el máximo par posible para que no se afloje.","Se usa normalmente como protección ante una posible caída o para retener al usuario; solo admite una cuerda de longitud fija, nunca sistemas de regulación, y se enrosca con un par que no debilite el anclaje sobre el que va montado.","Se usa normalmente como protección ante una posible caída o para retener al usuario; se le une un cabo con bloqueador o una cuerda regulable o fija, y se enrosca antes de seguir los pasos de instalación del anclaje base."],"5.2 (punto de anclaje único): se usa normalmente como protección ante una posible caída o para retener al usuario; se le une un cabo con bloqueador, una cuerda con regulación de longitud o una cuerda de longitud fija; se instala siguiendo los pasos del anclaje utilizado y después enroscándolo con un par que no debilite el anclaje sobre el que va montado. Falla «el máximo par posible». Falla «solo admite una cuerda de longitud fija». Falla la que lo enrosca «antes de seguir los pasos de instalación» del anclaje base."],
[4,"Un equipo lleva chapas en su material para instalarlas donde no hay anclajes o los existentes son dudosos. Una vez instalado el sistema de anclaje, ¿qué procedimiento recoge correctamente el apartado 5.2?",["Se introduce la chapa en la dirección en que va a trabajar, se ajusta la tuerca y se aprieta con el par del fabricante, bajo la supervisión de una persona competente con experiencia en fijación de anclajes.","Se ajusta la tuerca, se introduce la chapa en la dirección en que va a trabajar y se aprieta con el par del fabricante, bajo la supervisión de una persona competente con experiencia en fijación de anclajes.","Se introduce la chapa en la dirección opuesta a la que va a trabajar, se ajusta la tuerca y se aprieta con el par del fabricante, bajo la supervisión de una persona competente con experiencia en fijación de anclajes.","Se introduce la chapa en la dirección en que va a trabajar, se ajusta la tuerca y se aprieta con el par del fabricante; por ser una instalación sencilla, no requiere la supervisión de una persona competente."],"5.2 (chapas): una vez instalado el sistema de anclaje, se introduce la chapa en la dirección en que va a trabajar, se ajusta la tuerca y se aprieta con el par especificado por el fabricante. La instalación la supervisará una persona competente con experiencia en fijación de anclajes, porque su mal uso puede causar lesiones graves e incluso la muerte. Falla la que «ajusta la tuerca» antes de introducir la chapa, la que la orienta en la «dirección opuesta» y la que afirma que «no requiere la supervisión»."],
[4,"Un compañero propone anclar toda la instalación a un único punto porque es muy resistente. El jefe de equipo responde: «**No** es cierto que **no** sea incorrecto confiar la instalación a ese único punto». Según el apartado 5.1, ¿qué interpretación **NO** contradice esa respuesta?",["Equivale a decir que es incorrecto: la redundancia obliga a montar siempre sistemas dobles y duplicar los puntos de anclaje, cuya instalación requiere una estrategia previa y no se hace de forma aleatoria.","Equivale a decir que es correcto: la redundancia obliga a montar sistemas dobles y duplicar los puntos de anclaje solo cuando un único punto no garantiza por sí mismo la resistencia necesaria.","Equivale a decir que es incorrecto: la redundancia obliga a montar siempre sistemas dobles y duplicar los puntos de anclaje, cuya colocación puede ser aleatoria siempre que cada uno resista la carga.","Equivale a decir que es incorrecto: la redundancia obliga a montar siempre sistemas dobles, aunque basta con un único punto de anclaje común a ambos si este es muy resistente."],"Negaciones: «no sea incorrecto» equivale a «sea correcto», y «no es cierto que sea correcto» equivale a que ES INCORRECTO confiar la instalación a un único punto. 5.1: nunca se confía la resistencia de una instalación a un solo punto de anclaje; la redundancia obliga a montar siempre sistemas dobles y duplicar también los puntos de anclaje, y su instalación no es aleatoria, sino que necesita una estrategia previa. Falla «es correcto... solo cuando», falla «puede ser aleatoria» y falla «basta con un único punto de anclaje común»."],
[5,"Según el apartado 6.1 y el primer párrafo de 6.2, ¿qué afirmación **NO** es incorrecta sobre el Real Decreto 2177/2004 y la disposición de las cuerdas en las técnicas de acceso y posicionamiento mediante cuerda?",["El RD obliga, salvo circunstancias excepcionales, a contar como mínimo con dos cuerdas con sujeción independiente; según 6.2, no deben interferir entre sí y deben ir lo más paralelas posible una sobre la otra.","El RD obliga, en cualquier circunstancia y sin excepción, a contar como mínimo con dos cuerdas con sujeción independiente; según 6.2, no deben interferir entre sí y deben ir lo más paralelas posible una sobre la otra.","El RD obliga, salvo circunstancias excepcionales, a contar como mínimo con dos cuerdas unidas a una sujeción común; según 6.2, no deben interferir entre sí y deben ir lo más paralelas posible una sobre la otra.","El RD obliga, salvo circunstancias excepcionales, a contar como mínimo con dos cuerdas con sujeción independiente; según 6.2, deben separarse formando el mayor ángulo posible para no interferir entre sí."],"«NO es incorrecta» equivale a pedir la correcta. 6.1: el RD 2177/2004, en el apartado 4 de su Anexo, obliga «salvo en circunstancias excepcionales» a contar como mínimo con dos cuerdas o líneas de anclaje con sujeción independiente. 6.2: las dos cuerdas no deben interferir entre sí y deben ir lo más paralelamente posible una sobre la otra. Falla «sin excepción», falla «sujeción común» y falla «el mayor ángulo posible»."],
[5,"Por circunstancias excepcionales solo se puede montar una cuerda, y los dos puntos de anclaje disponibles están muy cerca uno de otro. El jefe afirma: «**No** es cierto que sea **innecesario** duplicar el punto de anclaje». Según el apartado 6.1, ¿qué interpretación **NO** contradice esa afirmación?",["Se debería colocar un doble punto de anclaje, primario y secundario o ecualizado; con los puntos tan próximos la ecualización es aconsejable, pues reparte los esfuerzos en partes más o menos iguales entre ellos.","Se debería colocar un doble punto de anclaje, pero solo ecualizado, porque el sistema primario y secundario únicamente se admite con dos cuerdas; la ecualización reparte los esfuerzos en partes más o menos iguales.","Se debería colocar un doble punto de anclaje, primario y secundario o ecualizado; con los puntos tan próximos la ecualización es aconsejable, pues concentra el esfuerzo en el principal y deja el otro de reserva.","Se debería colocar un doble punto de anclaje, primario y secundario o ecualizado; la ecualización solo es aconsejable con puntos muy alejados, así que aquí procede montar el sistema primario y secundario."],"Doble negación: «no es cierto que sea innecesario» equivale a que SÍ es necesario (recomendable) duplicar el punto. 6.1: con una sola cuerda se debería colocar un doble punto de anclaje, «ya sea con punto de anclaje primario o secundario o mediante la ecualización»; la ecualización es aconsejable cuando los puntos están cerca, porque reparte los esfuerzos en partes más o menos iguales. Falla «solo ecualizado», falla «concentra el esfuerzo en el principal», que describe el sistema en línea (6.4), y falla «solo es aconsejable con puntos muy alejados»."],
[5,"Comparando las figuras 1 y 2 del apartado 6.1, ¿cuál de las siguientes afirmaciones es la **única** correcta?",["Con dos cuerdas no es necesario que cada línea lleve dos puntos de anclaje, pues si falla la de trabajo queda la de seguridad; con dos puntos primario y secundario puede aparecer factor de caída si falla el principal.","Con dos cuerdas es necesario además que cada línea lleve dos puntos de anclaje, aunque si falla la de trabajo quede la de seguridad; con dos puntos primario y secundario puede aparecer factor de caída si falla el principal.","Con dos cuerdas no es necesario que cada línea lleve dos puntos de anclaje, pues si falla la de trabajo queda la de seguridad; con dos puntos primario y secundario puede aparecer factor de caída si falla el secundario.","Con dos cuerdas no es necesario que cada línea lleve dos puntos de anclaje, pues si falla la de trabajo queda la de seguridad; con dos puntos primario y secundario desaparece todo factor de caída si falla el principal."],"6.1: con dos cuerdas, «al llevar la de seguridad», no es necesario que cada línea lleve dos sujeciones, porque si falla la línea de trabajo queda la de seguridad (Fig. 1). Cuando la sujeción lleva dos puntos primario y secundario, aparece la posibilidad de factores de caída si falla el punto principal (Fig. 2). Falla «es necesario además», falla «si falla el secundario» y falla «desaparece todo factor de caída»."],
[5,"En la figura del apartado 6.2, una triangulación con un ángulo de 60° sostiene una carga de 100 N. ¿Qué afirmación es correcta?",["Cada punto de anclaje soporta 57 N, más de la mitad de la carga, y 60° es el ángulo máximo con el que la triangulación debería trabajar de forma óptima.","Cada punto de anclaje soporta 50 N, exactamente la mitad de la carga, y 60° es el ángulo máximo con el que la triangulación debería trabajar de forma óptima.","Cada punto de anclaje soporta 52 N, algo más de la mitad de la carga, y 60° es el ángulo máximo con el que la triangulación debería trabajar de forma óptima.","Cada punto de anclaje soporta 57 N, más de la mitad de la carga, y 60° es el ángulo mínimo a partir del cual la triangulación empieza a trabajar de forma óptima."],"6.2: la figura expresa los valores en porcentaje y pone el ejemplo de una carga de 100 N con un ángulo de 60°, en el que cada anclaje soporta 57 N (57 %); el texto indica que la triangulación debería trabajar de forma óptima a no más de 60°. Falla «50 N», que supone un reparto a partes iguales que la figura no da. Falla «52 N», que es el porcentaje que la figura asigna a 30°. Falla «ángulo mínimo», porque 60° es el máximo."],
[5,"Aplicando los porcentajes de la figura del apartado 6.2 a una carga de 200 N, se comparan dos triangulaciones: una de 30° y otra de 60°. ¿Qué resultado es el correcto?",["A 30° cada anclaje soporta 104 N y a 60°, 114 N; ambos ángulos respetan el máximo de 60° con el que la triangulación debería trabajar de forma óptima.","A 30° cada anclaje soporta 100 N y a 60°, otros 100 N; ambos ángulos respetan el máximo de 60° con el que la triangulación debería trabajar de forma óptima.","A 30° cada anclaje soporta 114 N y a 60°, 104 N; ambos ángulos respetan el máximo de 60° con el que la triangulación debería trabajar de forma óptima.","A 30° cada anclaje soporta 104 N y a 60°, 114 N; solo la de 30° respeta el máximo de 45° con el que la triangulación debería trabajar de forma óptima."],"6.2: la figura asigna a cada anclaje el 52 % de F con 30° y el 57 % con 60°; con 200 N, 0,52 × 200 = 104 N y 0,57 × 200 = 114 N. El texto fija el trabajo óptimo en «no más de 60°», así que 60° aún lo respeta. Falla «100 N», que reparte la carga a medias sin tener en cuenta el ángulo; falla la que intercambia las cifras («114 N» a 30° y «104 N» a 60°); y falla «el máximo de 45°», cifra que no es la del temario."],
[5,"Para ganar anchura, un compañero propone abrir una triangulación hasta unos 120°. El jefe replica: «**No** es cierto que abrir el ángulo **no** aumente los esfuerzos en los anclajes». Según el apartado 6.2 y su figura, ¿qué interpretación **NO** contradice esa réplica?",["Abrir el ángulo sí aumenta los esfuerzos: por encima de 60° dejan de ser efectivos, y en el ejemplo de 120° de la figura un anclaje soporta el 108 % de la carga y el otro el 88 %.","Abrir el ángulo sí aumenta los esfuerzos: por encima de 60° dejan de ser efectivos, y en el ejemplo de 120° de la figura un anclaje soporta el 57 % de la carga y el otro el 52 %.","Abrir el ángulo sí aumenta los esfuerzos: por encima de 30° dejan de ser efectivos, y en el ejemplo de 120° de la figura un anclaje soporta el 108 % de la carga y el otro el 88 %.","Abrir el ángulo sí aumenta los esfuerzos: por encima de 60° dejan de ser efectivos, y en el ejemplo de 120° los dos anclajes, con el 108 % y el 88 %, suman justo el 100 % de la carga."],"Doble negación: «no es cierto que no aumente» equivale a que abrir el ángulo SÍ aumenta los esfuerzos. 6.2: por encima de 60° los esfuerzos en los anclajes aumentan y dejan de ser efectivos; en el ejemplo de 120° de la figura un anclaje soporta el 108 % de F y el otro el 88 %. Falla «57 %... 52 %», que son los valores de 60° y 30°; falla «por encima de 30°»; y falla «suman justo el 100 %», porque 108 % + 88 % = 196 % de la carga."],
[5,"¿Qué correspondencia entre sistema de anclaje y característica es correcta en **todos** sus elementos según los apartados 6.3 y 6.4?",["Doble bloqueada: reparte la carga en una única dirección de tiro. Doble ecualizada: reparto independiente de la dirección del tiro. Triple: normalmente ecualizada. En línea: nunca reparte fuerza.","Doble bloqueada: reparto independiente de la dirección del tiro. Doble ecualizada: reparte la carga en una única dirección de tiro. Triple: normalmente ecualizada. En línea: nunca reparte fuerza.","Doble bloqueada: reparte la carga en una única dirección de tiro. Doble ecualizada: reparto independiente de la dirección del tiro. Triple: normalmente bloqueada. En línea: nunca reparte fuerza.","Doble bloqueada: reparte la carga en una única dirección de tiro. Doble ecualizada: reparto independiente de la dirección del tiro. Triple: normalmente ecualizada. En línea: reparte a partes iguales."],"6.3: en la triangulación doble fija o bloqueada la carga solo se reparte en una única dirección de tiro; en la ecualizada el reparto es independiente de la dirección del tiro; las triples normalmente se instalan ecualizadas. 6.4: en los sistemas en línea la carga se concentra en un solo anclaje y «nunca reparten fuerza». Falla la que intercambia bloqueada y ecualizada, la que dice «Triple: normalmente bloqueada» y la que afirma que el sistema en línea «reparte a partes iguales»."],
[5,"Durante una maniobra, la dirección del tiro va a ir cambiando. Un bombero afirma: «**No** es falso que una triangulación doble bloqueada **no** mantenga el reparto de la carga si cambia la dirección del tiro». Según el apartado 6.3, ¿qué interpretación **NO** contradice esa afirmación?",["Es cierta: en la bloqueada la carga solo se reparte en una única dirección de tiro, mientras que en la ecualizada el reparto es independiente de esa dirección, de modo que solo esta sigue repartiendo si el tiro cambia.","Es falsa: en la bloqueada el reparto es independiente de la dirección del tiro, igual que en la ecualizada, de modo que ambas siguen repartiendo la carga aunque el tiro cambie de dirección durante la maniobra.","Es cierta: en la bloqueada la carga solo se reparte en una única dirección de tiro, y en la ecualizada tampoco se mantiene el reparto, de modo que ninguna de las dos sigue repartiendo la carga si el tiro cambia.","Es cierta: en la bloqueada la carga solo se reparte en una única dirección de tiro, mientras que en la ecualizada el reparto es independiente de esa dirección, aunque solo si se monta con tres anclajes."],"Doble negación: «no es falso que no mantenga» equivale a «es verdad que NO mantiene» el reparto. 6.3: en la triangulación doble fija o bloqueada «la carga solo se reparte en una única dirección de tiro», y en la ecualizada «el reparto de la carga es independiente a la dirección del tiro». Falla «es falsa», porque la bloqueada no es independiente de la dirección; falla «en la ecualizada tampoco se mantiene»; y falla «solo si se monta con tres anclajes», pues la doble ecualizada tiene dos."],
[5,"Según el apartado 6.3, ¿cuál de las siguientes afirmaciones sobre las triangulaciones es la **única** correcta?",["Aplican la trigonometría a la física para repartir fuerzas; necesitan como mínimo dos anclajes, aunque la mayoría de las veces bastan tres, y la triple es ideal para maniobras de mucha fuerza.","Aplican la trigonometría a la física para repartir fuerzas; necesitan como mínimo tres anclajes, aunque la mayoría de las veces bastan cuatro, y la triple es ideal para maniobras de mucha fuerza.","Aplican la trigonometría a la física para repartir fuerzas; necesitan como mínimo dos anclajes y nunca más de tres, sea cual sea la resistencia exigida, y la triple es ideal para maniobras de mucha fuerza.","Aplican la trigonometría a la física para repartir fuerzas; necesitan como mínimo dos anclajes, aunque la mayoría de las veces bastan tres, y la triple se reserva para maniobras de poca fuerza."],"6.3: las triangulaciones emplean la trigonometría aplicada a la física para repartir las fuerzas; el mínimo de anclajes es dos y a partir de ahí cuantos sean necesarios según la resistencia solicitada y la dirección del tiro, aunque la mayoría de las veces bastan tres. Las triples son ideales cuando el tiro va hacia el eje de tracción del anclaje y para maniobras de mucha fuerza. Falla «como mínimo tres... bastan cuatro», falla «nunca más de tres» y falla «maniobras de poca fuerza»."],
[5,"Los dos únicos puntos de anclaje están muy alejados y una triangulación no permite direccionar la cuerda, así que se monta un sistema en línea. El responsable afirma: «**No** es cierto que **no** sea falso que el anclaje de seguro comparta la carga con el principal». Según el apartado 6.4, ¿qué interpretación **NO** contradice esa afirmación?",["El seguro no comparte la carga: esta se concentra en el anclaje principal y el otro solo protege por si este falla, y hay que montarlo de forma que no se creen factores de caída altos si falla el principal.","El seguro comparte la carga: esta se reparte entre el principal y el seguro en partes más o menos iguales, y hay que montarlo de forma que no se creen factores de caída altos si falla el principal.","El seguro no comparte la carga: esta se concentra en el anclaje principal y el otro solo protege por si este falla, y como no reparte fuerza, el fallo del principal no puede generar ningún factor de caída.","El seguro no comparte la carga: esta se concentra en el anclaje principal y el otro solo protege por si este falla; este sistema se reserva, sin embargo, para puntos de anclaje muy próximos entre sí."],"Negaciones: «no sea falso» equivale a «sea verdadero», y «no es cierto que sea verdadero» equivale a que es FALSO que el seguro comparta la carga. 6.4: en el sistema en línea la carga se concentra en uno solo de los anclajes y el otro está solo de protección por si falla el principal; nunca reparten fuerza, se usan con puntos muy alejados y hay que evitar crear factores de caída altos si falla el principal. Falla «comparte la carga», falla «no puede generar ningún factor de caída» y falla «puntos de anclaje muy próximos»."],
[5,"Respecto a la disposición de los seguros en los sistemas en línea (apartado 6.4 y sus figuras), ¿cuál de las siguientes afirmaciones es la **única** correcta?",["Tanto con el seguro por encima como por debajo del anclaje principal puede montarse sin factor de caída, y en ambos casos hay que evitar crear factores de caída altos si falla el principal.","Solo con el seguro por encima del anclaje principal puede montarse sin factor de caída, aunque en ambos casos hay que evitar crear factores de caída altos si falla el principal.","Solo con el seguro por debajo del anclaje principal puede montarse sin factor de caída, aunque en ambos casos hay que evitar crear factores de caída altos si falla el principal.","Tanto con el seguro por encima como por debajo del anclaje principal puede montarse sin factor de caída, de modo que en ninguno de los dos casos llega a crearse un factor de caída alto."],"6.4 distingue el seguro por encima y por debajo del anclaje principal, y en las figuras de ambas disposiciones aparecen montajes «sin factor de caída» y «con factor de caída»; además, hay que prestar especial atención para no crear factores de caída altos si falla el principal. Falla «solo con el seguro por encima», falla «solo con el seguro por debajo» y falla «en ninguno de los dos casos llega a crearse», porque ambas disposiciones admiten también montajes con factor de caída."],
[5,"Según los apartados 6.1 y 6.4, en todas las situaciones siguientes está justificado montar un sistema en línea **excepto** en una. ¿En cuál **no** lo está?",["Los puntos de anclaje están próximos entre sí y se busca repartir la carga en partes más o menos iguales.","Los dos puntos de anclaje disponibles se encuentran muy alejados el uno del otro en la zona de trabajo.","Una triangulación entre los puntos disponibles no permitiría direccionar la cuerda hacia donde se necesita.","Una triangulación entre los puntos disponibles no permitiría direccionar el sentido del tiro de la maniobra."],"Se busca la situación que NO justifica el sistema en línea. 6.4: se utiliza cuando los puntos de anclaje están muy alejados o cuando una triangulación no permite direccionar la cuerda o el sentido del tiro, y «nunca reparten fuerza», porque la carga se concentra en un solo anclaje. Por eso no sirve cuando los puntos están «próximos» y se busca «repartir la carga en partes más o menos iguales»: según 6.1, ese es el caso en que es aconsejable la ecualización."],
[6,"Un bombero debe subir por una torre de celosía que no está equipada con línea de seguridad vertical rígida. Según el apartado 7.1, ¿qué secuencia es la correcta?",["Progresar con un amarre en Y con absorbedor EN 355 unido a la anilla esternal del arnés EN 361, alternando los conectores sin soltar ambos a la vez; en lo alto, fijar una línea vertical temporal de cuerda y usar un EN 353-2.","Progresar con un amarre en Y con absorbedor EN 355 unido a la anilla esternal del arnés EN 361, alternando los conectores sin soltar ambos a la vez; en lo alto, fijar una línea vertical temporal de cuerda y usar un EN 353-1.","Progresar con un amarre en Y con absorbedor EN 355 unido a la anilla dorsal del arnés EN 361, alternando los conectores sin soltar ambos a la vez; en lo alto, fijar una línea vertical temporal de cuerda y usar un EN 353-2.","Fijar desde abajo una línea vertical temporal de cuerda y subir por ella con un EN 353-2; ya arriba, progresar con un amarre en Y con absorbedor EN 355 unido a la anilla esternal del EN 361, sin soltar ambos conectores a la vez."],"7.1: sin línea vertical rígida se progresa con un elemento de amarre en Y con absorbedor EN 355 conectado a la anilla esternal del arnés EN 361, conectando en cada escalón los conectores a la estructura sin que se desenganchen a la vez; una vez en lo alto se fija una línea de seguridad vertical temporal de cuerda y se usa un anticaídas deslizante EN 353-2. Falla «EN 353-1», que es el deslizante para línea rígida (7.2). Falla «anilla dorsal». Falla la que fija la línea temporal «desde abajo» antes de subir."],
[6,"Ya fijada la línea temporal de cuerda en lo alto de una torre, un operario vuelve a subir por ella llevando el anticaídas deslizante a la altura de la cintura. El jefe le advierte: «**No** es cierto que **no** importe dónde lleves el dispositivo respecto al enganche del arnés». Según el apartado 7.1, ¿qué interpretación **NO** contradice esa advertencia?",["Sí importa: el anticaídas debe ir por encima del punto de enganche esternal EN 361 para evitar un factor de caída excesivo, y en el lugar de trabajo se usará un amarre de sujeción ajustable EN 358.","Sí importa: el anticaídas debe ir por debajo del punto de enganche esternal EN 361 para evitar un factor de caída excesivo, y en el lugar de trabajo se usará un amarre de sujeción ajustable EN 358.","Sí importa: el anticaídas debe ir por encima del punto de enganche dorsal EN 361 para evitar un factor de caída excesivo, y en el lugar de trabajo se usará un amarre de sujeción ajustable EN 358.","Sí importa: el anticaídas debe ir por encima del punto de enganche esternal EN 361 para evitar un factor de caída excesivo, y en el lugar de trabajo se usará otro amarre en Y EN 355 para tener las manos libres."],"Doble negación: «no es cierto que no importe» equivale a que SÍ importa la posición. 7.1: durante el ascenso el anticaídas debe mantenerse por encima del punto de enganche esternal EN 361 para evitar un factor de caída excesivo, y para trabajar con las manos libres se dispone de un elemento de amarre de sujeción ajustable EN 358. Falla «por debajo», falla «enganche dorsal» y falla «otro amarre en Y EN 355 para tener las manos libres», porque esa función corresponde al EN 358."],
[6,"Respecto al kit de emergencia al trabajar en una torre, ¿cuál de las siguientes afirmaciones es correcta según el apartado 7.1?",["Es obligatorio para poder rescatar rápidamente a un compañero en dificultad, especialmente si está suspendido inconsciente, y la longitud de su cuerda debe ser adecuada a la altura del lugar de trabajo.","Es recomendable, aunque no obligatorio, para poder rescatar rápidamente a un compañero en dificultad, especialmente si está suspendido inconsciente, y la longitud de su cuerda debe ser adecuada a la altura.","Es obligatorio para poder rescatar rápidamente a un compañero en dificultad, salvo si está suspendido inconsciente, caso reservado a los servicios externos, y la longitud de su cuerda debe ser adecuada a la altura.","Es obligatorio para poder rescatar rápidamente a un compañero en dificultad, especialmente si está suspendido inconsciente, y su cuerda tiene una longitud estándar, independiente de la altura del lugar de trabajo."],"7.1 (Importante): al trabajar en una torre es obligatorio disponer de un kit de emergencia para rescatar rápidamente a un compañero en situación de dificultad, especialmente si está suspendido inconsciente. La longitud de la cuerda del kit debe ser adecuada a la altura del lugar de trabajo. Falla «recomendable, aunque no obligatorio», falla «salvo si está suspendido inconsciente» y falla «longitud estándar, independiente de la altura»."],
[6,"Una torre dispone de línea de seguridad vertical rígida con una escalera a su lado. Según el apartado 7.2, ¿qué asignación de equipo y función es correcta en **todos** sus elementos?",["EN 353-1: deslizante sobre el cable, tras verificar su compatibilidad. EN 355 en Y: desconectarse de la línea, subir a lo alto y moverse por la zona de trabajo. EN 358: trabajar con las dos manos.","EN 353-2: deslizante sobre el cable, tras verificar su compatibilidad. EN 355 en Y: desconectarse de la línea, subir a lo alto y moverse por la zona de trabajo. EN 358: trabajar con las dos manos.","EN 353-1: deslizante sobre el cable, tras verificar su compatibilidad. EN 358: desconectarse de la línea, subir a lo alto y moverse por la zona de trabajo. EN 355 en Y: trabajar con las dos manos.","EN 353-1: deslizante sobre el cable, sin verificar compatibilidad por ser rígida. EN 355 en Y: desconectarse de la línea, subir a lo alto y moverse por la zona de trabajo. EN 358: trabajar con las dos manos."],"7.2: en el cable de la línea vertical rígida se coloca un anticaídas deslizante EN 353-1 «después de verificar su compatibilidad con el cable», conectado a la anilla esternal del EN 361; el amarre EN 355 en Y con absorbedores permite desconectarse de la línea, ascender hasta lo alto y moverse por la zona de trabajo; y el amarre de sujeción ajustable EN 358 permite trabajar con las dos manos. Falla «EN 353-2», que es el de la línea temporal de cuerda (7.1); falla la que intercambia EN 358 y EN 355; y falla «sin verificar compatibilidad»."],
[6,"Tres operarios deben subir a la vez por una línea de vida vertical, uno detrás de otro. Según el apartado 7.2, ¿qué afirmación **NO** es incorrecta?",["Se permite más de un usuario a la vez con una distancia mínima de seguridad de 4 m entre ellos; por tanto, entre el primero y el tercero habrá al menos 8 m.","Se permite más de un usuario a la vez con una distancia mínima de seguridad de 4 m entre ellos; por tanto, entre el primero y el tercero habrá al menos 12 m.","Se permite más de un usuario a la vez con una distancia mínima de seguridad de 2 m entre ellos; por tanto, entre el primero y el tercero habrá al menos 4 m.","Se permite más de un usuario a la vez con una distancia máxima de seguridad de 4 m entre ellos; por tanto, entre el primero y el tercero habrá como mucho 8 m."],"«NO es incorrecta» equivale a pedir la correcta. 7.2 (Importante): se permite transitar a más de un usuario a la vez por una línea de vida vertical, con una distancia mínima de seguridad de 4 m de separación; con tres operarios hay dos intervalos de al menos 4 m, es decir, 2 × 4 = 8 m entre el primero y el tercero. Falla «al menos 12 m», que multiplica por el número de operarios y no por el de intervalos; falla «2 m»; y falla «distancia máxima», que convierte el mínimo en un tope."],
[6,"Según el apartado 7.3, ¿cuál de las siguientes descripciones de las líneas de vida es correcta en **todos** sus elementos?",["Dispositivo de protección con línea de anclaje flexible o rígida para uno o varios operarios a la vez; las hay provisionales y permanentes, horizontales y verticales, y se construyen de cinta, cable, fibra o cuerda.","Dispositivo de protección con línea de anclaje exclusivamente flexible para uno o varios operarios a la vez; las hay provisionales y permanentes, horizontales y verticales, y se construyen de cinta, cable, fibra o cuerda.","Dispositivo de protección con línea de anclaje flexible o rígida para un único operario cada vez; las hay provisionales y permanentes, horizontales y verticales, y se construyen de cinta, cable, fibra o cuerda.","Dispositivo de protección con línea de anclaje flexible o rígida para uno o varios operarios a la vez; las hay provisionales y permanentes, horizontales y verticales, y se construyen de cinta, cable, fibra o cadena."],"7.3: una línea de vida es un dispositivo de protección equipado con línea de anclaje flexible o rígida que permite trabajar con seguridad a uno o varios operarios simultáneamente; tiene cuatro categorías (provisionales horizontales y verticales, permanentes horizontales y verticales) y por su construcción puede ser de cinta, cable, fibra o cuerda. Falla «exclusivamente flexible», falla «un único operario cada vez» y falla «cadena», material que el temario cita para los anillos de anclaje (5.2), no para las líneas de vida."],
[6,"Un operario debe trabajar en una azotea horizontal con riesgo de caída y sin equipos de protección colectiva. El jefe afirma: «**No** es cierto que aquí **no** haga falta, como mínimo, un punto de anclaje seguro». Según el apartado 7.3, ¿qué interpretación **NO** contradice esa afirmación?",["Hace falta como mínimo un punto de anclaje seguro, al que conectarse mediante un sistema de retención que limite los movimientos a la zona segura de la superficie y permita evitar la caída.","Hace falta como mínimo un punto de anclaje seguro, al que conectarse mediante un sistema de retención que permita llegar hasta el borde y detenga la caída una vez que se haya producido.","No hace falta ningún punto de anclaje mientras el operario permanezca en la zona segura, y el sistema de retención solo se usa si debe acercarse al borde de la superficie horizontal.","Hace falta como mínimo un punto de anclaje seguro y un sistema de retención, salvo que el operario disponga de un kit de emergencia para rescate en la propia zona de trabajo."],"Doble negación: «no es cierto que no haga falta» equivale a que SÍ hace falta como mínimo un punto de anclaje seguro. 7.3: siempre que se trabaje sobre una superficie horizontal con riesgo de caída y sin protección colectiva se debe disponer, como mínimo, de un punto de anclaje seguro al que conectarse con un sistema de retención que limite los movimientos a la zona segura y permita evitar la caída. Falla «permita llegar hasta el borde y detenga la caída», falla «no hace falta ningún punto de anclaje» y falla «salvo que el operario disponga de un kit de emergencia», pues el texto dice «siempre»."],
[6,"Según el apartado 7.4, ¿cuál de las siguientes afirmaciones sobre los trabajos en cubiertas es la **única** correcta?",["Se desarrollan en cubiertas con inclinación inferior a 30°, enganchado a una línea de seguridad flexible horizontal instalada previamente en el vértice; si no existe, se instala una línea temporal.","Se desarrollan en cubiertas con inclinación superior a 30°, enganchado a una línea de seguridad flexible horizontal instalada previamente en el vértice; si no existe, se instala una línea temporal.","Se desarrollan en cubiertas con inclinación inferior a 30°, enganchado a una línea de seguridad flexible horizontal instalada previamente en el borde inferior; si no existe, se instala una línea temporal.","Se desarrollan en cubiertas con inclinación inferior a 30°, enganchado a una línea de seguridad flexible horizontal instalada previamente en el vértice; si no existe, no se trabaja hasta instalar una permanente."],"7.4: este tipo de trabajo se desarrolla en cubiertas con inclinación inferior a 30°, en las que el operario se engancha a una línea de seguridad flexible horizontal instalada previamente en el vértice de la cubierta. Si esa línea no está instalada, se deberá instalar una línea de seguridad temporal. Falla «superior a 30°», falla «en el borde inferior» y falla «no se trabaja hasta instalar una permanente»."],
[6,"Una vez en la línea de seguridad de una cubierta, el operario puede usar tres tipos de dispositivos de protección. Según el apartado 7.4, ¿qué relación es correcta en **todos** sus elementos?",["Retráctil EN 360 a la anilla esternal o dorsal del EN 361; deslizante EN 353 a la anilla esternal del EN 361 con cuerda de terminal cosido; amarre de sujeción ajustable EN 358; todos de longitud adecuada a la cubierta.","Retráctil EN 360 solo a la anilla dorsal del EN 361; deslizante EN 353 a la anilla esternal del EN 361 con cuerda de terminal cosido; amarre de sujeción ajustable EN 358; todos de longitud adecuada a la cubierta.","Retráctil EN 360 a la anilla esternal o dorsal del EN 361; deslizante EN 353 a la anilla dorsal del EN 361 con cuerda de terminal cosido; amarre de sujeción ajustable EN 358; todos de longitud adecuada a la cubierta.","Retráctil EN 360 a la anilla esternal o dorsal del EN 361; deslizante EN 353 a la anilla esternal del EN 361 con cuerda de terminal cosido; amarre de sujeción ajustable EN 355; todos de longitud adecuada a la cubierta."],"7.4: los tres dispositivos son el anticaídas retráctil EN 360 conectado a la anilla esternal o dorsal del EN 361, el anticaídas deslizante EN 353 a la anilla esternal del EN 361 con una cuerda de terminal cosido y el elemento de amarre de sujeción ajustable EN 358, todos de longitud adecuada a la cubierta. Falla «solo a la anilla dorsal» para el retráctil, falla el deslizante a la «anilla dorsal» y falla «amarre de sujeción ajustable EN 355», norma que corresponde al amarre en Y con absorbedor."],
[6,"Sobre las líneas de vida horizontales fijas del apartado 7.4, todas las afirmaciones siguientes son ciertas **excepto** una. ¿Cuál **no** lo es?",["No admiten trabajos en suspensión ni su uso como punto de anclaje y, tras una caída sobre la línea, basta con que el propio usuario revise visualmente la instalación.","Su número máximo de usuarios depende de su longitud, construcción y número de anclajes y, tras una caída sobre la línea, debe revisarla de nuevo personal competente.","Están calculadas para un número máximo de usuarios que nunca se puede sobrepasar y, tras una caída sobre la línea, debe revisarla de nuevo personal competente.","No admiten trabajos en suspensión ni su uso como punto de anclaje y, tras una caída sobre la línea, debe revisar de nuevo la instalación personal competente."],"Se busca la única falsa. 7.4: las líneas de vida horizontales fijas están calculadas para un número máximo de usuarios que nunca se puede sobrepasar, en función de su longitud, construcción y número de anclajes; no se pueden hacer trabajos en suspensión sobre ellas ni utilizarlas como punto de anclaje; y, tras una caída sobre la línea, hay que revisar de nuevo la instalación por personal competente. Es falso, por tanto, que «basta con que el propio usuario revise visualmente la instalación»."],
[6,"Hay que subir a dos torres: la A, sin línea vertical rígida, y la B, con línea vertical rígida y escalera. Se afirma: «**No** es cierto que **no** sea falso que en ambas se asciende desde abajo con el mismo anticaídas deslizante». Según los apartados 7.1 y 7.2, ¿qué interpretación **NO** contradice esa afirmación?",["Es falso: en A se sube con el amarre en Y EN 355 y solo en lo alto se fija una línea temporal de cuerda para usar un EN 353-2; en B se sube con un EN 353-1 colocado en el cable.","Es verdadero: en A y en B se sube desde abajo con un EN 353-1, colocado en A sobre una línea temporal de cuerda y en B sobre el cable, tras verificar su compatibilidad.","Es falso: en A se sube con un EN 353-2 sobre una línea temporal de cuerda fijada previamente desde abajo, y en B se sube con un EN 353-1 colocado en el cable.","Es falso: en A se sube con el amarre en Y EN 355 y solo en lo alto se fija una línea temporal de cuerda para usar un EN 353-1; en B se sube con un EN 353-2 colocado en el cable."],"Negaciones: «no sea falso» equivale a «sea verdadero», y «no es cierto que sea verdadero» equivale a que ES FALSO que ambas torres se suban con el mismo deslizante. 7.1: sin línea rígida se progresa con el amarre en Y EN 355 y, una vez en lo alto, se fija una línea temporal de cuerda con un EN 353-2; 7.2: con línea rígida se coloca en el cable un EN 353-1. Falla «es verdadero», falla la línea temporal «fijada previamente desde abajo» y falla la que intercambia «EN 353-1» y «EN 353-2»."],
[6,"Según el apartado 7.4, ¿cómo se accede habitualmente a la línea de seguridad de una cubierta y qué puede hacer el operario una vez en ella?",["Habitualmente desde una zona segura o, en su defecto, mediante procedimiento de acceso asegurado; una vez en la línea, el operario puede utilizar tres tipos de dispositivos de protección.","Habitualmente mediante procedimiento de acceso asegurado o, en su defecto, desde una zona segura; una vez en la línea, el operario puede utilizar tres tipos de dispositivos de protección.","Habitualmente desde una zona segura o, en su defecto, mediante procedimiento de acceso asegurado; una vez en la línea, el operario puede utilizar dos tipos de dispositivos de protección.","Habitualmente desde una zona segura o, en su defecto, mediante procedimiento de acceso asegurado; una vez en la línea, usa tres tipos de dispositivos, todos conectados a la anilla dorsal."],"7.4: el acceso a la línea de seguridad se realiza habitualmente desde una zona segura o, en su defecto, mediante procedimiento de acceso asegurado; una vez en ella, el operario puede utilizar tres tipos de dispositivos (retráctil EN 360, deslizante EN 353 y amarre de sujeción EN 358). Falla la que invierte el orden de preferencia («mediante procedimiento de acceso asegurado o, en su defecto, desde una zona segura»), falla «dos tipos» y falla «todos conectados a la anilla dorsal», porque el deslizante va a la anilla esternal."],
[7,"Una víctima permanece suspendida de una cuerda en un plano superior. Aunque inicialmente no se aprecian lesiones que amenacen sus funciones vitales, existe un riesgo del entorno que amenaza su seguridad de forma inmediata; los riesgos para los intervinientes han sido valorados y controlados. Se decide efectuar un descenso mediante transferencia de carga a otra instalación. El responsable afirma: «**No** es cierto que **no** sea falso considerar demorable esta emergencia por el solo hecho de que no se aprecien lesiones que amenacen las funciones vitales». Considerando conjuntamente los apartados 8.1, 8.2 y 8.3, ¿cuál de las siguientes interpretaciones **NO** contradice ni esa triple negación, ni los principios de seguridad, ni la secuencia de transferencia descrita, sin confundir una elevación auxiliar con la finalidad de descenso de la maniobra?",["La afirmación rechaza considerar demorable el caso por la sola ausencia de lesiones vitales apreciables, y la amenaza inmediata para la víctima determina su carácter no demorable. Deben evitarse riesgos excesivos para los socorristas y el agravamiento del accidentado, garantizando la evacuación de todos los implicados. La secuencia general es protección, aviso, rescate y evacuación. En la nueva instalación se colocan los elementos para elevar la carga, desanclarla de la instalación original y pasarla al dispositivo de descenso; esa elevación auxiliar no cambia la finalidad de la maniobra.","La afirmación rechaza considerar demorable el caso por la sola ausencia de lesiones vitales apreciables, pero la amenaza inmediata para la víctima no impide clasificarlo como demorable. Deben evitarse riesgos excesivos para los socorristas y el agravamiento del accidentado, garantizando la evacuación de todos los implicados. La secuencia general es protección, aviso, rescate y evacuación. En la nueva instalación se colocan los elementos para elevar la carga, desanclarla de la instalación original y pasarla al dispositivo de descenso; esa elevación auxiliar no cambia la finalidad de la maniobra.","La afirmación rechaza considerar demorable el caso por la sola ausencia de lesiones vitales apreciables, y la amenaza inmediata para la víctima determina su carácter no demorable. Deben evitarse riesgos excesivos para los socorristas y el agravamiento del accidentado, garantizando únicamente la evacuación de la víctima. La secuencia general es protección, aviso, rescate y evacuación. En la nueva instalación se colocan los elementos para elevar la carga, desanclarla de la instalación original y pasarla al dispositivo de descenso; esa elevación auxiliar no cambia la finalidad de la maniobra.","La afirmación rechaza considerar demorable el caso por la sola ausencia de lesiones vitales apreciables, y la amenaza inmediata para la víctima determina su carácter no demorable. Deben evitarse riesgos excesivos para los socorristas y el agravamiento del accidentado, garantizando la evacuación de todos los implicados. La secuencia general es protección, aviso, rescate y evacuación. En la nueva instalación se colocan los elementos para desanclar la carga de la instalación original, elevarla y pasarla al dispositivo de descenso; esa elevación auxiliar no cambia la finalidad de la maniobra."],"Triple negación: «no es cierto» + «no sea» + «falso» equivale a afirmar que ES FALSO considerarla demorable solo porque no haya lesiones vitales. Las cuatro opciones interpretan bien esa parte, así que el error está en otro elemento. 8.1: los riesgos del entorno que amenazan de forma inmediata la seguridad del accidentado son un criterio de emergencia NO demorable (falla la opción que dice que «no impide clasificarlo como demorable»). Los principios exigen garantizar la evacuación de TODOS los implicados en la intervención, no solo de la víctima (falla la opción de «únicamente la evacuación de la víctima»). 8.2: la secuencia es protección, aviso, rescate y evacuación. 8.3: en la transferencia de carga, en la nueva instalación se colocan los elementos para ELEVAR la carga, DESANCLARLA de la instalación original y PASARLA al dispositivo de descenso. No se puede desanclar primero porque la cuerda está en tensión (falla la opción que desancla y luego eleva). La pequeña elevación con polipasto solo sirve para destensar la cuerda sin cortarla; la maniobra sigue siendo de descenso."],
[7,"Según la definición de «Rescate» recogida en el apartado 8.1, ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Es un operativo de emergencia en la zona de un accidente que consiste en el retiro y traslado de una víctima, bajo soporte vital básico, desde el foco de peligro hasta la unidad asistencial capaz de ofrecer atenciones y cuidados de mayor alcance.","Es un operativo de emergencia en la zona de un accidente que consiste en el retiro y traslado de una víctima, bajo soporte vital avanzado, desde el foco de peligro hasta la unidad asistencial capaz de ofrecer atenciones y cuidados de mayor alcance.","Es un operativo de emergencia en la zona de un accidente que consiste en el retiro y traslado de una víctima, bajo soporte vital básico, desde el foco de peligro hasta el primer punto seguro situado fuera de la zona del accidente.","Es un operativo de emergencia en la zona de un accidente que consiste en la estabilización in situ de una víctima, bajo soporte vital básico, hasta que llega la unidad asistencial capaz de ofrecer atenciones y cuidados de mayor alcance."],"8.1 define el rescate como un operativo de emergencia en la zona de un accidente que consiste en el «retiro y traslado» de una víctima, «bajo soporte vital básico», desde el foco de peligro «hasta la unidad asistencial capaz de ofrecer atenciones y cuidados de mayor alcance». Es incorrecto hablar de soporte vital «avanzado», terminar el traslado en el «primer punto seguro» fuera de la zona y sustituir el retiro y traslado por una «estabilización in situ» a la espera de la unidad asistencial."],
[7,"El apartado 8.1 distingue entre emergencias «demorables» y «no demorables». ¿Qué clasificación reproduce fielmente los tres criterios de cada grupo?",["Demorables: las que admiten espera de los servicios de emergencia, las lesiones que no amenazan funciones vitales y los riesgos en la zona que ponen en peligro a los primeros intervinientes. No demorables: la espera puede agravar las lesiones, lesiones que amenazan funciones vitales y riesgos que amenazan al accidentado de forma inmediata.","Demorables: las que admiten espera de los servicios de emergencia, las lesiones que no amenazan funciones vitales y los riesgos que amenazan al accidentado de forma inmediata. No demorables: la espera puede agravar las lesiones, lesiones que amenazan funciones vitales y riesgos en la zona que ponen en peligro a los primeros intervinientes.","Demorables: las que admiten espera de los servicios de emergencia y las lesiones que no amenazan funciones vitales. No demorables: la espera puede agravar las lesiones, lesiones que amenazan funciones vitales, riesgos que amenazan al accidentado de forma inmediata y riesgos en la zona que ponen en peligro a los primeros intervinientes.","Demorables: las que admiten espera de los servicios de emergencia, las lesiones que no amenazan funciones vitales y los riesgos en la zona que ponen en peligro a los primeros intervinientes. No demorables: la espera puede agravar las lesiones, lesiones que amenazan funciones vitales y riesgos que amenazan a los primeros intervinientes de forma inmediata."],"8.1 incluye entre las demorables los «riesgos en la zona del accidente que ponen en peligro la seguridad de los primeros intervinientes», y entre las no demorables los riesgos que amenazan la seguridad «del accidentado de forma inmediata». Falla la clasificación que intercambia ambos riesgos entre los grupos; también la que traslada el riesgo para los primeros intervinientes a las no demorables y deja las demorables con solo dos criterios; y la que atribuye el riesgo inmediato de las no demorables a «los primeros intervinientes» en lugar de al accidentado."],
[7,"En una nave industrial, un operario ha caído sobre una plataforma elevada. Está consciente y sus lesiones no amenazan sus funciones vitales, pero en la zona hay un riesgo que pone en peligro la seguridad de los compañeros que pretenden auxiliarle; ya se ha avisado a los servicios de emergencia. El encargado afirma: «**No** es falso que esta situación **no** deba clasificarse como no demorable». ¿Qué interpretación **NO** contradice ni la afirmación ni el apartado 8.1?",["La afirmación equivale a clasificar el caso como demorable: tanto las lesiones que no amenazan funciones vitales como los riesgos de la zona que ponen en peligro a los primeros intervinientes figuran entre los criterios de las emergencias que admiten espera de los servicios de emergencia.","La afirmación equivale a clasificar el caso como no demorable: aunque las lesiones no amenacen funciones vitales, los riesgos de la zona que ponen en peligro a los primeros intervinientes figuran entre los criterios de las emergencias que no admiten espera de los servicios de emergencia.","La afirmación equivale a clasificar el caso como demorable, pero solo por las lesiones: los riesgos de la zona que ponen en peligro a los primeros intervinientes figuran entre los criterios de las emergencias no demorables, que no admiten espera de los servicios de emergencia.","La afirmación equivale a clasificar el caso como demorable, pero solo por los riesgos de la zona que ponen en peligro a los primeros intervinientes: las lesiones que no amenazan funciones vitales no figuran entre los criterios de ninguno de los dos tipos de emergencia."],"«No es falso que X» equivale a afirmar X; y X («no deba clasificarse como no demorable») significa que la emergencia es demorable. Según 8.1, son criterios de emergencia demorable tanto las «lesiones que no amenazan las funciones vitales» como los «riesgos en la zona del accidente que ponen en peligro la seguridad de los primeros intervinientes». Fallan la interpretación que concluye «no demorable», la que sitúa el riesgo para los intervinientes entre las emergencias «no demorables» y la que niega que las lesiones sin compromiso vital figuren en «ninguno de los dos tipos»."],
[7,"En el procedimiento estratégico estándar del apartado 8.2, ¿qué relación contiene **exclusivamente** datos del bloque «Recogida de información», sin mezclar ninguna tarea del bloque «División de las operaciones»?",["Lugar, tipo de accidente, número de personas implicadas, lesiones apreciables y estado del accidentado, tipo de estructura, accesos y otros riesgos en el lugar.","Lugar, tipo de accidente, número de personas implicadas, lesiones apreciables y estado del accidentado, tipo de estructura, selección del acceso y otros riesgos en el lugar.","Lugar, tipo de accidente, recuento del personal, lesiones apreciables y estado del accidentado, tipo de estructura, accesos y otros riesgos en el lugar.","Lugar, tipo de accidente, número de personas implicadas, lesiones apreciables y estado del accidentado, tipo de estructura, accesos y análisis de los riesgos."],"8.2 enumera en la «Recogida de información»: lugar, tipo de accidente, número de personas implicadas, lesiones apreciables y estado del accidentado, tipo de estructura, accesos y otros riesgos en el lugar. En cambio, «selección del acceso», «recuento del personal» y «análisis de los riesgos» son tareas de la «División de las operaciones», de modo que cada una de esas relaciones mezcla ambos bloques."],
