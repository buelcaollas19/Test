[11,"Una sola persona debe levantar una escalera ligera de un solo plano. ¿Qué secuencia describe el apartado 12.1?",["Apoyar los pies de la escalera contra un obstáculo suficientemente resistente → elevar la extremidad opuesta → avanzar lentamente de escalón en escalón hasta la vertical → inclinar la cabeza de la escalera hacia el punto de apoyo.","Elevar uno de los extremos de la escalera → apoyar los pies contra un obstáculo suficientemente resistente → avanzar lentamente de escalón en escalón hasta la vertical → inclinar la cabeza de la escalera hacia el punto de apoyo.","Apoyar la cabeza de la escalera contra un obstáculo suficientemente resistente → elevar la extremidad opuesta → avanzar lentamente de escalón en escalón hasta la vertical → inclinar la escalera hacia el punto de apoyo.","Apoyar los pies de la escalera contra un obstáculo suficientemente resistente → elevar la extremidad opuesta → inclinar la cabeza de la escalera hacia el punto de apoyo → avanzar lentamente de escalón en escalón hasta la vertical."],"Según 12.1, primero se sitúa la escalera en el suelo con los PIES apoyados en un obstáculo suficientemente resistente para que no se deslice (no «la cabeza»). Después se eleva la extremidad opuesta y se avanza lentamente de escalón en escalón hasta la posición vertical; «elevar uno de los extremos» antes de calzar los pies invierte el orden. Solo al final se inclina la cabeza hacia el punto de apoyo, por lo que inclinarla antes de alcanzar la vertical también es erróneo."],
[11,"Un bombero va a abatir él solo una escalera de un plano de 22 kg en un día sin viento. Su compañero le advierte: «**No** es cierto que **no** haga falta una segunda persona para abatirla». ¿Qué valoración **NO** contradice esa advertencia ni el apartado 12.1?",["Es acertada: aunque pese menos de 25 kg y no haya condiciones adversas, el abatimiento se hace siempre por dos personas, con las operaciones inversas a las del levantamiento.","Es errónea: al pesar menos de 25 kg y no haber condiciones adversas, el abatimiento puede hacerlo una sola persona, con las operaciones inversas a las del levantamiento.","Es acertada, pero solo porque supera los 20 kg: por debajo de ese peso y sin condiciones adversas, el abatimiento puede hacerlo una sola persona con las operaciones inversas.","Es acertada: aunque pese menos de 25 kg y no haya condiciones adversas, el abatimiento se hace siempre por dos personas, repitiendo en el mismo orden las operaciones del levantamiento."],"Doble negación: negar que «no haga falta» una segunda persona equivale a afirmar que SÍ hace falta. El 12.1 permite levantar entre una sola persona las escaleras ligeras de un plano y exige dos con peso superior a 25 kg o en condiciones adversas, pero para el abatimiento las operaciones son INVERSAS y SIEMPRE por dos personas, con independencia del peso (fallan «puede hacerlo una sola persona» y el umbral inventado de «20 kg»). Tampoco se repiten las operaciones «en el mismo orden», sino a la inversa."],
[11,"El apartado 12.1 asocia factores concretos a cada uno de los riesgos de caída de las escaleras de mano. ¿Qué asignación es la correcta?",["Deslizamiento lateral de la cabeza: viento o desplazamiento lateral del usuario. Deslizamiento del pie: suelo en pendiente o poca inclinación. Basculamiento hacia atrás: escalera demasiado corta instalada demasiado verticalmente.","Deslizamiento lateral de la cabeza: viento o desplazamiento lateral del usuario. Deslizamiento del pie: suelo en pendiente o poca inclinación. Basculamiento hacia atrás: escalera demasiado larga instalada demasiado verticalmente.","Deslizamiento lateral de la cabeza: viento o falta de zapatas antideslizantes. Deslizamiento del pie: suelo en pendiente o poca inclinación. Basculamiento hacia atrás: escalera demasiado corta instalada demasiado verticalmente.","Deslizamiento lateral de la cabeza: viento o desplazamiento lateral del usuario. Deslizamiento del pie: suelo en pendiente o calzado inadecuado. Basculamiento hacia atrás: escalera demasiado corta instalada demasiado verticalmente."],"Según 12.1, el deslizamiento lateral de la cabeza se asocia a apoyo precario, escalera mal situada, viento o desplazamiento lateral del usuario; la «falta de zapatas antideslizantes» es factor del deslizamiento del PIE. Este se asocia también a suelo que cede o en pendiente, poca inclinación o apoyo superior sobre pared, mientras que el «calzado inadecuado» pertenece al desequilibrio al resbalar en peldaños. El basculamiento hacia atrás corresponde a una escalera demasiado CORTA (no «larga») instalada demasiado verticalmente."],
[11,"Un bombero trabaja desde una escalera de mano con el punto de operación a 4 m del suelo y debe realizar esfuerzos peligrosos para su estabilidad. El jefe afirma: «**No** es falso que **no** pueda trabajar así sin protección frente a caídas». ¿Qué valoración **NO** contradice esa afirmación ni el apartado 12.1?",["Es acertada: por encima de 3,5 m desde el punto de operación al suelo y con esfuerzos peligrosos, solo puede trabajar con equipo de protección individual anticaídas o adoptando otras medidas de protección alternativas.","Es acertada: por encima de 2 m desde el punto de operación al suelo y con esfuerzos peligrosos, solo puede trabajar con equipo de protección individual anticaídas o adoptando otras medidas de protección alternativas.","Es acertada: por encima de 3,5 m de longitud total de la escalera y con esfuerzos peligrosos, solo puede trabajar con equipo de protección individual anticaídas o adoptando otras medidas de protección alternativas.","Es acertada: por encima de 3,5 m desde el punto de operación al suelo y con esfuerzos peligrosos, solo puede trabajar con equipo de protección individual anticaídas, sin que quepan medidas de protección alternativas."],"«No es falso que no pueda» equivale a afirmar que NO puede trabajar así sin protección, lo que coincide con el 12.1. Los trabajos a más de 3,5 m (no «2 m»), medidos desde el PUNTO DE OPERACIÓN al suelo (no por la «longitud total de la escalera»), que requieran movimientos o esfuerzos peligrosos para la estabilidad, solo se efectuarán con EPI anticaídas O adoptando otras medidas de protección alternativas. Por tanto, es falso que no quepan «medidas de protección alternativas»."],
[11,"Respecto a la longitud y colocación de una escalera de mano sobre la que se va a trabajar, ¿cuál de las siguientes afirmaciones **NO** es incorrecta según el apartado 12.1?",["Debe sobrepasar al menos 1 m el punto de apoyo superior y dejar como mínimo cuatro escalones libres por encima de la posición de los pies; además, no se emplearán escaleras sin garantías de resistencia, en particular las de más de cinco metros.","Debe sobrepasar al menos 0,6 m el punto de apoyo superior y dejar como mínimo cuatro escalones libres por encima de la posición de los pies; además, no se emplearán escaleras sin garantías de resistencia, en particular las de más de cinco metros.","Debe sobrepasar al menos 1 m el punto de apoyo superior y dejar como mínimo tres escalones libres por encima de la posición de los pies; además, no se emplearán escaleras sin garantías de resistencia, en particular las de más de cinco metros.","Debe sobrepasar al menos 1 m el punto de apoyo superior y dejar como mínimo cuatro escalones libres por encima de la posición de los pies; además, no se emplearán escaleras sin garantías de resistencia, en particular las de más de siete metros."],"Según 12.1, la escalera debe sobrepasar al menos 1 m (no «0,6 m») el punto de apoyo superior. Si se va a trabajar sobre ella, debe haber como mínimo CUATRO (no «tres») escalones libres por encima de la posición de los pies. Además, no se emplearán escaleras sobre cuya resistencia no haya garantías, en particular las de más de CINCO metros de longitud, no «siete»."],
[11,"Se va a montar un andamio según una configuración tipo generalmente reconocida, pero no se dispone de su nota de cálculo. El técnico afirma: «**No** es cierto que **no** pueda prescindirse del cálculo de resistencia y estabilidad». ¿Qué valoración **NO** contradice esa afirmación ni las condiciones generales del apartado 12.2?",["Es acertada: al montarse según una configuración tipo generalmente reconocida, el cálculo no es exigible; aun así, el montaje lo dirigirá una persona con formación universitaria o profesional que lo habilite, con trabajadores formados específicamente.","Es errónea: sin nota de cálculo, el cálculo es siempre exigible aunque se monte según una configuración tipo generalmente reconocida; además, el montaje lo dirigirá una persona con formación universitaria o profesional que lo habilite.","Es acertada: al montarse según una configuración tipo generalmente reconocida, el cálculo no es exigible; aun así, el montaje lo dirigirá una persona con formación universitaria, sin que baste la profesional, con trabajadores formados específicamente.","Es acertada: al montarse según una configuración tipo generalmente reconocida, el cálculo no es exigible; en su lugar se elaborará siempre un plan de montaje, utilización y desmontaje, sea cual sea la complejidad del andamio."],"Doble negación: «no es cierto que no pueda prescindirse» significa que SÍ puede prescindirse del cálculo. El 12.2 exige un cálculo de resistencia y estabilidad cuando no hay nota de cálculo, A MENOS QUE el andamio se monte según una configuración tipo generalmente reconocida (falla «es siempre exigible»). El plan de montaje, de utilización y de desmontaje se elabora en función de la complejidad del andamio, no «siempre... sea cual sea la complejidad». El montaje lo dirige una persona con formación universitaria O profesional que lo habilite para ello, por lo que es falso que «no baste la profesional»."],
[11,"Hay que desplazar unos metros, por una nave de hormigón nivelado, una torre de trabajo móvil en cuya plataforma sigue un operario con sus herramientas. El encargado afirma: «**No** es cierto que **no** esté prohibido moverla así». ¿Qué actuación **NO** contradice esa afirmación ni el apartado 12.2?",["Bajar al operario, retirar materiales y herramientas, desplazarla solo manualmente por suelo firme, nivelado y libre de obstáculos y, ya en su posición, bloquear la rotación y la traslación de las ruedas verificando los frenos.","Mantener al operario, retirar materiales y herramientas, desplazarla solo manualmente por suelo firme, nivelado y libre de obstáculos y, ya en su posición, bloquear la rotación y la traslación de las ruedas verificando los frenos.","Bajar al operario, retirar materiales y herramientas, desplazarla con un vehículo a baja velocidad por suelo firme, nivelado y libre de obstáculos y, ya en su posición, bloquear la rotación y la traslación de las ruedas verificando los frenos.","Bajar al operario, retirar materiales y herramientas, desplazarla solo manualmente por suelo firme, nivelado y libre de obstáculos y, ya en su posición, bloquear solo la rotación de las ruedas, verificando los frenos."],"Doble negación: «no es cierto que no esté prohibido» equivale a afirmar que ESTÁ prohibido moverla así. El 12.2 prohíbe desplazar estas torres con personal, materiales o herramientas sobre ellas para evitar su basculamiento (falla «mantener al operario»). Solo deben moverse MANUALMENTE (no «con un vehículo») sobre suelo firme, sólido, nivelado y libre de obstáculos. Sus ruedas deben disponer de bloqueo de la rotación Y de la traslación, verificando los frenos, por lo que bloquear «solo la rotación» no basta."],
[11,"Para las torres de acceso y de trabajo móviles, el apartado 12.2 establece todo lo siguiente **excepto** una cosa. ¿Cuál es la afirmación que **no** recoge el temario?",["Con la plataforma de trabajo a 3,5 m o más, el equipo anticaída CE o las medidas alternativas solo son obligatorios si hay esfuerzos peligrosos para la estabilidad.","No está autorizado instalar poleas u otros dispositivos de elevación sobre ellas, a menos que el fabricante los haya proyectado expresamente para dicha finalidad.","Está prohibido saltar sobre los pisos de trabajo y establecer puentes entre una torre de trabajo móvil y cualquier elemento fijo de la obra o del edificio.","Cada uno de sus componentes debe ir marcado con un símbolo o letras que identifiquen el sistema de acceso de torre móvil y el fabricante, y el año de fabricación."],"Se pide la afirmación que NO figura en el 12.2. En las torres basta con que la plataforma de trabajo esté a 3,5 m o más para exigir equipo de protección anticaída CE o medidas alternativas; la condición de «esfuerzos peligrosos para la estabilidad» procede de la norma de las escaleras de mano (12.1), no de los andamios. Las demás sí están en el temario: prohibición de poleas salvo que el fabricante las haya «proyectado expresamente», prohibición de «saltar» sobre los pisos y de «establecer puentes», y marcado de los componentes con sistema, fabricante y «año de fabricación»."],
];

/* ===== MOTOR DE LA APLICACIÓN ===== */
(function(){
var N_FINAL=60, L="ABCD";
var S=null, timer=null, deep=false, skipPop=false, cur="menu";
function $(id){return document.getElementById(id)}
var store={
  get:function(k,d){try{var v=localStorage.getItem("tb_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem("tb_"+k,JSON.stringify(v))}catch(e){}}
};
function rnd(n){if(window.crypto&&crypto.getRandomValues){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
function num(x,d){return x.toFixed(d==null?2:d).replace(".",",")}
function mmss(ms){var s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function byTopic(t){return Q.filter(function(q){return q[0]===t})}

/* --- navegación (el botón «atrás» del móvil vuelve al menú) --- */
function show(id){["menu","temas","quiz","res"].forEach(function(x){$(x).hidden=x!==id});cur=id;window.scrollTo(0,0)}
function go(id){
  if(id==="menu"){stopTimer();show("menu");renderMenu();if(deep){deep=false;skipPop=true;history.back()}return}
  show(id);
  if(!deep){try{history.pushState({tb:1},"");deep=true}catch(e){}}
}
function inProgress(){return cur==="quiz"&&S&&!S.done&&S.items.some(function(x){return x.res})}
window.addEventListener("popstate",function(){
  if(skipPop){skipPop=false;return}
  if(inProgress()&&!confirm("¿Salir del test? Se perderá el progreso.")){try{history.pushState({tb:1},"")}catch(e){}return}
  deep=false;stopTimer();show("menu");renderMenu();
});

/* --- menú y temas --- */
function renderMenu(){
  $("meta").textContent=Q.length+" preguntas · "+T.length+" temas";
  $("pen").checked=store.get("pen",true);
  var f=store.get("hist",{}).final;
  $("hist").textContent=f?("Test definitivo: "+f.n+(f.n>1?" intentos":" intento")+" · última nota "+num(f.last)+" · mejor "+num(f.best)):"";
}
function renderTemas(){
  var h=store.get("hist",{});
  $("tlist").innerHTML=T.map(function(t,i){
    var b=h["t"+i];
    return '<button type="button" class="big topic" data-t="'+i+'"><span><b>'+(i+1)+". "+esc(t[0])+"</b><br><span>"+esc(t[1])+(b?" · mejor nota "+num(b.best,1):"")+'</span></span><span class="n">'+byTopic(i).length+"</span></button>";
  }).join("");
}

/* --- generación aleatoria de tests --- */
function makeItems(src){
  return src.map(function(q){
    return{src:q,t:q[0],q:q[1],exp:q[3],res:null,pick:-1,
      opts:shuffle(q[2].map(function(x,i){return{x:x,ok:i===0}}))};
  });
}
function start(cfg,src){
  S={mode:cfg.mode,label:cfg.label,items:makeItems(src),i:0,t0:Date.now(),done:false};
  go("quiz");startTimer();renderQ();
}
function startTopic(t){start({mode:"t"+t,label:T[t][0]},shuffle(byTopic(t).slice()))}
function startFinal(){
  var pools=T.map(function(_,i){return shuffle(byTopic(i).slice())});
  var per=Math.floor(N_FINAL/T.length), pick=[];
  pools.forEach(function(p){pick=pick.concat(p.splice(0,per))});
  var rest=shuffle([].concat.apply([],pools));
  while(pick.length<N_FINAL&&rest.length)pick.push(rest.pop());
  start({mode:"final",label:"Test definitivo"},shuffle(pick));
}
function startReview(src){start({mode:"review",label:"Repaso de falladas"},shuffle(src.slice()))}

/* --- pregunta --- */
function renderQ(){
  var it=S.items[S.i], n=S.items.length;
  $("qCount").textContent=(S.i+1)+" / "+n;
  $("qProg").style.width=(S.i/n*100)+"%";
  $("qTopic").textContent=T[it.t][0];
  $("qText").innerHTML=fmt(it.q);
  $("qOpts").innerHTML=it.opts.map(function(o,k){
    return '<button type="button" class="opt" data-k="'+k+'"><span class="l">'+L[k]+"</span><span>"+fmt(o.x)+"</span></button>";
  }).join("");
  $("qFb").innerHTML="";$("qNext").hidden=true;$("qBlank").hidden=false;
  window.scrollTo(0,0);
}
function answer(k){
  var it=S.items[S.i];if(it.res)return;
  var okIdx=it.opts.findIndex(function(o){return o.ok});
  it.pick=k;it.res=k<0?"bl":(k===okIdx?"ok":"ko");
  Array.prototype.forEach.call($("qOpts").children,function(b,j){
    b.disabled=true;b.classList.add(j===okIdx?"ok":(j===k?"ko":"dim"));
  });
  var head=it.res==="ok"?"✔ Correcto":(it.res==="ko"?"✘ Incorrecto · la correcta es la "+L[okIdx]:"— En blanco · la correcta es la "+L[okIdx]);
  $("qFb").innerHTML='<div class="fb '+it.res+'"><h3>'+head+"</h3><p>"+fmt(it.exp)+"</p></div>";
  $("qBlank").hidden=true;
  var nx=$("qNext");nx.hidden=false;nx.textContent=S.i===S.items.length-1?"Ver resultados":"Siguiente →";
  $("qProg").style.width=((S.i+1)/S.items.length*100)+"%";
  setTimeout(function(){
    var r=$("qFb").getBoundingClientRect(), need=r.bottom+90-window.innerHeight;
    if(need>0)window.scrollBy({top:Math.min(need,r.top-70),behavior:"smooth"});
    try{nx.focus({preventScroll:true})}catch(e){}
  },40);
}
function next(){if(!S||!S.items[S.i].res)return;if(S.i<S.items.length-1){S.i++;renderQ()}else finish()}

/* --- resultados --- */
function finish(){
  S.done=true;stopTimer();
  var ms=Date.now()-S.t0, n=S.items.length, c={ok:0,ko:0,bl:0}, by={};
  S.items.forEach(function(it){c[it.res]++;var b=by[it.t]||(by[it.t]={ok:0,ko:0,bl:0,n:0});b[it.res]++;b.n++});
  var pen=store.get("pen",true);
  var notaPen=Math.max(0,c.ok-c.ko/3)/n*10, notaRaw=c.ok/n*10, nota=pen?notaPen:notaRaw;
  if(S.mode!=="review"){
    var h=store.get("hist",{}), e=h[S.mode]||{n:0,best:0,last:0};
    e.n++;e.last=nota;e.best=Math.max(e.best,nota);h[S.mode]=e;store.set("hist",h);
  }
  var pass=nota>=5, fails=S.items.filter(function(x){return x.res!=="ok"});
  var html='<div class="card score"><div class="lbl">'+esc(S.label)+'</div><div class="nota">'+num(nota)+'<small> / 10</small></div>'+
    '<span class="verdict '+(pass?"pass":"fail")+'">'+(pass?"APTO":"NO APTO")+"</span>"+
    '<div class="det">'+(pen?"Con penalización (−1/3 por error) · sin penalizar: "+num(notaRaw):"Sin penalización · penalizando: "+num(notaPen))+"<br>"+
    Math.round(c.ok/n*100)+" % de aciertos · Tiempo "+mmss(ms)+"</div></div>"+
    '<div class="grid3"><div class="card kpi"><b class="c-ok">'+c.ok+'</b><span>Aciertos</span></div><div class="card kpi"><b class="c-ko">'+c.ko+'</b><span>Fallos</span></div><div class="card kpi"><b class="c-bl">'+c.bl+"</b><span>En blanco</span></div></div>";
  var keys=Object.keys(by);
  if(keys.length>1){
    html+='<div class="card pad"><h2>Desglose por tema</h2><table class="tbl">'+keys.sort(function(a,b){return a-b}).map(function(k){
      var b=by[k], p=b.ok/b.n, col=p>=.7?"var(--ok)":(p>=.5?"var(--bl)":"var(--ko)");
      return "<tr><td>"+esc(T[k][0])+'</td><td class="r">'+b.ok+"/"+b.n+'<span class="mini"><i style="width:'+Math.round(p*100)+"%;background:"+col+'"></i></span></td></tr>';
    }).join("")+"</table></div>";
  }
  html+='<div class="actions"><button type="button" class="btn primary" id="rAgain">Repetir test</button>'+
    (fails.length?'<button type="button" class="btn" id="rFails">Repasar falladas ('+fails.length+")</button>":"")+
    '<button type="button" class="btn ghost" id="rMenu">Menú principal</button></div>';
  if(fails.length){
    html+='<details class="card rev"><summary>Revisar fallos y preguntas en blanco ('+fails.length+")</summary>"+fails.map(function(it){
      var okIdx=it.opts.findIndex(function(o){return o.ok});
      return '<div class="rq"><p><b>'+fmt(it.q)+"</b></p>"+
        (it.pick>=0?'<p class="c-ko">✘ Tu respuesta: '+L[it.pick]+") "+fmt(it.opts[it.pick].x)+"</p>":'<p class="c-bl">— En blanco</p>')+
        '<p class="c-ok">✔ Correcta: '+L[okIdx]+") "+fmt(it.opts[okIdx].x)+'</p><p class="e">'+fmt(it.exp)+"</p></div>";
    }).join("")+"</details>";
  }
  $("res").innerHTML=html;
  var mode=S.mode, src=S.items.map(function(x){return x.src}), fsrc=fails.map(function(x){return x.src});
  $("rAgain").onclick=function(){mode==="final"?startFinal():(mode==="review"?startReview(src):startTopic(+mode.slice(1)))};
  if(fails.length)$("rFails").onclick=function(){startReview(fsrc)};
  $("rMenu").onclick=function(){go("menu")};
  show("res");
}

/* --- temporizador --- */
function startTimer(){stopTimer();var el=$("qTime"),tick=function(){el.textContent="⏱ "+mmss(Date.now()-S.t0)};tick();timer=setInterval(tick,1000)}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}

/* --- eventos --- */
$("bFinal").onclick=startFinal;
$("bTemas").onclick=function(){renderTemas();go("temas")};
$("pen").onchange=function(){store.set("pen",this.checked)};
document.querySelector("[data-home]").onclick=function(){go("menu")};
$("tlist").onclick=function(e){var b=e.target.closest("[data-t]");if(b)startTopic(+b.getAttribute("data-t"))};
$("qOpts").onclick=function(e){var b=e.target.closest(".opt");if(b&&!b.disabled)answer(+b.getAttribute("data-k"))};
$("qBlank").onclick=function(){answer(-1)};
$("qNext").onclick=next;
$("qExit").onclick=function(){if(inProgress()&&!confirm("¿Salir del test? Se perderá el progreso."))return;go("menu")};
document.addEventListener("keydown",function(e){
  if(cur!=="quiz"||!S||e.altKey||e.ctrlKey||e.metaKey)return;
  var it=S.items[S.i], k=e.key.length===1?e.key.toLowerCase():"";
  var idx=k?("1234".indexOf(k)>=0?"1234".indexOf(k):"abcd".indexOf(k)):-1;
  if(!it.res&&idx>=0){answer(idx);e.preventDefault();return}
  if(it.res&&(e.key==="Enter"||e.key==="ArrowRight")){
    if(e.key==="Enter"&&e.target&&e.target.tagName==="BUTTON")return;
    next();e.preventDefault();
  }
});

/* --- comprobación de integridad del banco --- */
Q.forEach(function(q,i){if(q.length!==4||q[2].length!==4||!T[q[0]])console.warn("Pregunta mal formada #"+i,q)});
renderMenu();
})();
</script>
</body>
