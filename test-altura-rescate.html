<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<meta name="description" content="Simulador de test de trabajo en altura y maniobras de rescate. Funciona sin conexión en un único archivo.">
<title>Test Altura y Rescate</title>
<style>
:root{--bg:#f5f3f0;--card:#fff;--ink:#1c1917;--mut:#6b645d;--line:#e6e0d9;--acc:#c2410c;--acc-ink:#fff;--acc-soft:#fff1e8;--ok:#15803d;--ok-bg:#e9f7ee;--ko:#b91c1c;--ko-bg:#fdecec;--bl:#8a5a00;--bl-bg:#fdf5e1;--on:#fff;--r:14px;--sh:0 1px 2px rgba(28,25,23,.05),0 6px 20px rgba(28,25,23,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#131110;--card:#1e1b19;--ink:#f2eee9;--mut:#a59d95;--line:#36312c;--acc:#f97316;--acc-ink:#1a0d04;--acc-soft:#2f1a0d;--ok:#4ade80;--ok-bg:#12301d;--ko:#f87171;--ko-bg:#3b1616;--bl:#facc15;--bl-bg:#33290b;--on:#0c0a09;--sh:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:1.55rem;line-height:1.2;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:1.12rem;margin:0 0 12px}
.sub{color:var(--mut);margin:0;font-size:.92rem}
.brand{display:flex;align-items:center;gap:14px;margin:14px 0 24px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--acc);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.big{display:block;width:100%;text-align:left;padding:18px;margin:0 0 12px;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--sh);transition:transform .08s,border-color .15s}
.big:active{transform:scale(.99)}
.big:hover{border-color:var(--acc)}
.big b{display:block;font-size:1.08rem;margin-bottom:2px}
.big span{color:var(--mut);font-size:.9rem}
.big.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.big.primary span{color:inherit;opacity:.88}
.topic{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin-bottom:10px}
.topic b{font-size:1rem}
.topic .n{flex:none;font-size:.78rem;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.set{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin:8px 0 0;cursor:pointer}
.set input{width:20px;height:20px;accent-color:var(--acc);margin:2px 0 0;flex:none}
.set small{display:block;color:var(--mut);font-size:.85rem}
.stat{font-size:.88rem;color:var(--mut);margin:14px 2px 0}
.foot{color:var(--mut);font-size:.8rem;margin:26px 2px 0;line-height:1.5}
.link{background:none;border:0;padding:10px 0;color:var(--acc);cursor:pointer;font-weight:600}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:.9rem;color:var(--mut)}
.bar .mid{font-weight:700;color:var(--ink)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.chip{display:inline-block;font-size:.76rem;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.qtext{font-size:1.07rem;line-height:1.55;margin:0 0 18px;font-weight:500}
.qtext strong{color:var(--acc);font-weight:800}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;min-height:54px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;line-height:1.45}
.opt .l{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:.88rem;background:var(--bg);border:1px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:var(--on);border-color:var(--ok)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.opt.ko .l{background:var(--ko);color:var(--on);border-color:var(--ko)}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border-left:4px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.ko{background:var(--ko-bg);border-color:var(--ko)}
.fb.bl{background:var(--bl-bg);border-color:var(--bl)}
.fb h3{margin:0 0 6px;font-size:1rem}
.fb.ok h3{color:var(--ok)}.fb.ko h3{color:var(--ko)}.fb.bl h3{color:var(--bl)}
.fb p{margin:0;font-size:.95rem}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1 1 140px;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;min-height:50px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent;color:var(--mut)}
.score{text-align:center;padding:26px 16px 22px}
.score .lbl{color:var(--mut);font-size:.9rem;font-weight:600}
.score .nota{font-size:3.6rem;font-weight:800;line-height:1.05;letter-spacing:-.03em;margin-top:4px}
.score .nota small{font-size:1.2rem;color:var(--mut);font-weight:600;letter-spacing:0}
.verdict{display:inline-block;margin-top:10px;padding:4px 14px;border-radius:999px;font-weight:800;font-size:.85rem;letter-spacing:.04em}
.verdict.pass{background:var(--ok-bg);color:var(--ok)}
.verdict.fail{background:var(--ko-bg);color:var(--ko)}
.score .det{color:var(--mut);font-size:.85rem;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kpi{padding:12px 6px;text-align:center}
.kpi b{display:block;font-size:1.45rem;line-height:1.2}
.kpi span{font-size:.78rem;color:var(--mut)}
.c-ok{color:var(--ok)}.c-ko{color:var(--ko)}.c-bl{color:var(--bl)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r{text-align:right;white-space:nowrap;padding-left:10px;color:var(--mut)}
.mini{height:6px;background:var(--line);border-radius:9px;overflow:hidden;width:64px;display:inline-block;vertical-align:middle;margin-left:8px}
.mini i{display:block;height:100%}
details.rev{margin-top:12px;padding:14px 16px}
details.rev summary{cursor:pointer;font-weight:700}
.rq{border-top:1px solid var(--line);padding:12px 0 4px;font-size:.92rem}
.rq p{margin:0 0 6px}
.rq .e{color:var(--mut)}
@media (max-width:380px){.qtext{font-size:1rem}.opt{padding:11px 12px}.score .nota{font-size:3rem}}
</style>
</head>
<body>
<div class="wrap">

<section id="menu">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12.6 2.2c.5 3-1.3 4.6-2.6 6.3-1 1.3-1.6 2.5-1.2 4.1.2-1.3 1-2.3 2.1-2.9-.2 1.9.7 3.2 1.9 4.1 1.2.9 1.9 2 1.7 3.6 1.4-.9 2.2-2.4 2-4.2 1.3 1.3 1.9 3 1.6 4.9-.4 3-3.2 5.6-6.3 5.6-3.6 0-6.4-2.8-6.4-6.4 0-3 1.6-5.1 3.3-7.1 1.8-2.1 3.8-4.2 3.9-8z"/></svg></div>
    <div><h1>Altura y Rescate</h1><p class="sub" id="meta"></p></div>
  </div>
  <button class="big primary" id="bFinal" type="button"><b>Test definitivo</b><span>Simulacro de 60 preguntas equilibradas de todo el temario</span></button>
  <button class="big" id="bTemas" type="button"><b>Test por temas</b><span>Elige un bloque y practica solo ese contenido</span></button>
  <label class="card set"><input type="checkbox" id="pen"><span><b>Penalizar errores</b><small>Cada fallo resta 1/3 de acierto, como en el examen real. Las preguntas en blanco no restan.</small></span></label>
  <p class="stat" id="hist"></p>
  <p class="foot">Preguntas y respuestas se barajan en cada intento. Funciona sin conexión: guarda este archivo .html y ábrelo con cualquier navegador; también puedes enviarlo por WhatsApp. Atajos de teclado: 1–4 o A–D para responder, Intro para avanzar.</p>
</section>

<section id="temas" hidden>
  <div class="bar"><button class="link" type="button" data-home>← Menú</button></div>
  <h2>Test por temas</h2>
  <div id="tlist"></div>
</section>

<section id="quiz" hidden>
  <div class="bar"><button class="link" type="button" id="qExit">✕ Salir</button><span class="mid" id="qCount"></span><span id="qTime"></span></div>
  <div class="prog"><i id="qProg"></i></div>
  <span class="chip" id="qTopic"></span>
  <p class="qtext" id="qText"></p>
  <div class="opts" id="qOpts" role="group" aria-label="Opciones de respuesta"></div>
  <div id="qFb" aria-live="polite"></div>
  <div class="actions"><button class="btn ghost" type="button" id="qBlank">Dejar en blanco</button><button class="btn primary" type="button" id="qNext" hidden>Siguiente →</button></div>
</section>

<section id="res" hidden></section>

</div>
<script>
"use strict";
/* ===== TEMARIO: [nombre del tema, normativa / contenidos clave] ===== */
const T=[
["Seguridad y prevención en trabajos en altura","Legislación, principios de protección contra caídas, sistemas de protección"],
["EPI: uso, mantenimiento y conservación","Equipo personal, de rescate y auxiliar, inspección, mantenimiento y verificación"],
["Física de la caída","Fuerza de choque, cadena dinámica, factor de caída, caída libre, péndulo, efecto polea"],
["Nudos de seguridad","Anclaje y encordamiento, deslizantes, de unión, bloqueantes, resistencia"],
["Tipos de instalaciones de anclajes","Anclajes y tipos de anclajes"],
["Sistemas de anclajes","Tipos de sistemas, ángulos máximos, triangulaciones, sistemas en línea"],
["Técnicas de aseguramiento","Acceso con y sin sistemas preinstalados, líneas de vida, cubiertas"],
["Situaciones de rescate y evacuación","Emergencias demorables y no demorables, gestión del rescate, técnicas de evacuación"],
["Técnicas de acceso mediante cuerda","Técnicas de descenso y sistemas de ascenso"],
["Maniobras de fuerza y movimientos de carga","Manipulación de carga en altura, poleas y polipastos"],
["Trauma de la suspensión","Concepto, fisiopatología, prevención y tratamiento"],
["Estructuras provisionales","Escaleras de mano y torres de andamios"]
];
/* ===== BANCO DE PREGUNTAS =====
   Formato: [tema, "enunciado", ["CORRECTA","incorrecta","incorrecta","incorrecta"], "explicación"]
   La primera opción es siempre la correcta en el código; la app las baraja al mostrarlas.
   **texto** se muestra resaltado. */
const Q=[
[0,"Una empresa planifica una limpieza de fachada con técnicas de acceso y posicionamiento mediante cuerda. El técnico de prevención afirma: «**No** es cierto que la línea de seguridad **no** deba llevar un dispositivo de regulación distinto del de la línea de trabajo». Según 1.1, ¿qué descripción del montaje **NO** contradice ni esa afirmación ni el Real Decreto 2177/2004?",["Dos cuerdas con sujeción independiente: la de trabajo, como medio de acceso, descenso y apoyo, con dispositivos UNE-EN 12841 tipo B y C; la de seguridad, como medio de emergencia, con dispositivo tipo A; el arnés se conecta a la cuerda de seguridad.","Dos cuerdas con sujeción independiente: la de trabajo, como medio de acceso, descenso y apoyo, con dispositivo UNE-EN 12841 tipo A; la de seguridad, como medio de emergencia, con dispositivos tipo B y C; el arnés se conecta a la cuerda de seguridad.","Dos cuerdas con sujeción independiente: la de trabajo, como medio de acceso, descenso y apoyo, con dispositivos UNE-EN 12841 tipo B y C; la de seguridad, como medio de emergencia, también con dispositivos tipo B y C; el arnés se conecta a la cuerda de seguridad.","Dos cuerdas con sujeción independiente: la de trabajo, como medio de acceso, descenso y apoyo, con dispositivos UNE-EN 12841 tipo B y C; la de seguridad, como medio de emergencia, con dispositivo tipo A; el arnés se conecta solo a la cuerda de trabajo."],"Doble negación: «no es cierto que no deba» equivale a afirmar que la línea de seguridad SÍ debe llevar un dispositivo distinto del de la línea de trabajo. Según 1.1, la cuerda de trabajo lleva dispositivos UNE-EN 12841 tipo B y C, la de seguridad tipo A, y el empresario facilita arneses que se conectan a la cuerda de seguridad. Falla la que asigna el «tipo A» a la de trabajo (tipos intercambiados), la que pone en la de seguridad «también dispositivos tipo B y C» (contradice la afirmación y el RD) y la que conecta el arnés «solo a la cuerda de trabajo»."],
[0,"Un operario trabaja de pie sobre una plataforma cuyo borde está a 0,90 m del suelo y ejecuta la tarea con las manos a 2,10 m del suelo. Según 1.2, ¿qué valoración es correcta?",["Es trabajo temporal en altura, pues se mide desde el suelo hasta las manos (2,10 m); la necesidad de protección se evidencia, pues el riesgo de caída (0,90 m) supera 0,5 m; y prevalece la protección colectiva sobre la individual.","No es trabajo temporal en altura, pues se mide desde el suelo hasta la superficie que pisa (0,90 m); la necesidad de protección se evidencia, pues el riesgo de caída (0,90 m) supera 0,5 m; y prevalece la protección colectiva sobre la individual.","Es trabajo temporal en altura, pues se mide desde el suelo hasta las manos (2,10 m); la necesidad de protección se evidencia, pues el riesgo de caída (0,90 m) supera 0,5 m; y prevalece la protección individual sobre la colectiva.","Es trabajo temporal en altura, pues se mide desde el suelo hasta las manos (2,10 m); la necesidad de protección no se evidencia, pues el riesgo de caída (0,90 m) no supera 1 m; y prevalece la protección colectiva sobre la individual."],"1.2: son trabajos temporales en altura los realizados a más de 2 m, medidos desde el suelo hasta el punto donde se trabaja (las manos, 2,10 m) y no hasta la superficie sobre la que está el operario; por eso falla la que mide «hasta la superficie que pisa». La necesidad de protección se evidencia con un riesgo de caída a distinto nivel superior a 0,5 m, no a 1 m (falla la de «no supera 1 m»). Al elegir medidas prevalecen los equipos de protección colectiva sobre los individuales, al revés de lo que dice la de «prevalece la protección individual sobre la colectiva»."],
[0,"Según 1.2, cuando no es posible usar protección colectiva y se recurre a técnicas de acceso y posicionamiento con cuerdas y EPI, la elección debe justificarse con una evaluación de los riesgos específicos. ¿Qué relación **no** incluye **ningún** supuesto ajeno a los que esa evaluación debe evidenciar?",["Acceso imposible por otros medios; intervención con carácter urgente justificada; menor riesgo en comparación con otras soluciones; imposibilidad de modificar el lugar en el que se realiza el trabajo.","Acceso imposible por otros medios; intervención con carácter urgente justificada; menor coste en comparación con otras soluciones; imposibilidad de modificar el lugar en el que se realiza el trabajo.","Acceso imposible por otros medios; intervención con carácter urgente justificada; menor riesgo en comparación con otras soluciones; posibilidad de modificar el lugar en el que se realiza el trabajo.","Acceso imposible por otros medios; intervención de duración prolongada justificada; menor riesgo en comparación con otras soluciones; imposibilidad de modificar el lugar en el que se realiza el trabajo."],"La doble negación («no incluye ningún supuesto ajeno») pide la relación formada solo por supuestos de la lista de 1.2. Esa lista recoge: acceso imposible por otros medios, aumento del riesgo con otros medios, intervención urgente justificada, menor riesgo frente a otras soluciones, duración limitada e imposibilidad de modificar el lugar de trabajo. Fallan las que incluyen «menor coste» (el texto dice menor riesgo), «posibilidad de modificar el lugar» (el texto dice imposibilidad) e «intervención de duración prolongada» (el texto exige duración limitada)."],
[0,"Según 1.1, se impartirá a los trabajadores afectados una formación adecuada y específica destinada en particular a todas las materias siguientes **excepto** a una, que **no** figura en esa relación. ¿Cuál?",["Las técnicas de salvamento de personas accidentadas en espacios confinados.","Las técnicas seguras de manipulación de cargas en altura.","Las medidas de seguridad ante condiciones meteorológicas que puedan afectar a la seguridad.","Las normas sobre el cuidado, mantenimiento y verificación del equipo de trabajo y de seguridad."],"Se pide la materia que NO figura en la relación de 1.1. La relación incluye las técnicas de salvamento de personas accidentadas «en suspensión», no «en espacios confinados», por lo que esta es la ajena. Sí figuran expresamente las «técnicas seguras de manipulación de cargas en altura», las «medidas de seguridad ante condiciones meteorológicas» y las «normas sobre el cuidado, mantenimiento y verificación» del equipo, junto con la progresión por cuerda y estructuras, los sistemas de sujeción y los anticaídas."],
[0,"Sobre la obligación de formación que recoge 1.1, ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["El artículo 19 de la Ley 31/1995, de 8 de noviembre, obliga al empresario a dar una formación centrada específicamente en el puesto o función de cada trabajador, que se adapte a la evolución de los riesgos y a la aparición de otros nuevos y se repita periódicamente, si fuera necesario.","El artículo 19 de la Ley 31/1995, de 12 de noviembre, obliga al empresario a dar una formación centrada específicamente en el puesto o función de cada trabajador, que se adapte a la evolución de los riesgos y a la aparición de otros nuevos y se repita periódicamente, si fuera necesario.","El artículo 19 de la Ley 31/1995, de 8 de noviembre, obliga al empresario a dar una formación general y común a todos los trabajadores, que se adapte a la evolución de los riesgos y a la aparición de otros nuevos y se repita periódicamente, si fuera necesario.","El artículo 19 de la Ley 31/1995, de 8 de noviembre, obliga al empresario a dar una formación centrada específicamente en el puesto o función de cada trabajador, que se adapte a la evolución de los riesgos y a la aparición de otros nuevos y se repita periódicamente en todo caso."],"«NO es incorrecta» equivale a «es correcta». 1.1: el artículo 19 de la Ley 31/1995, de 8 de noviembre, exige una formación centrada específicamente en el puesto o función de cada trabajador, adaptada a la evolución de los riesgos y a los nuevos, y repetida periódicamente si fuera necesario. Falla la fecha «de 12 de noviembre» (es la del RD 2177/2004), la «formación general y común a todos los trabajadores» y la repetición «en todo caso», que suprime la condición «si fuera necesario»."],
[0,"Durante la planificación de un trabajo con cuerdas, el coordinador afirma: «**No** es falso que la segunda cuerda sea **siempre** obligatoria». Según 1.1, ¿qué valoración de esa afirmación es correcta?",["Es errónea: en circunstancias excepcionales, si la evaluación del riesgo muestra que una segunda cuerda haría más peligroso el trabajo, puede admitirse una sola cuerda, justificando las razones técnicas y adoptando medidas adecuadas para garantizar la seguridad.","Es errónea: en circunstancias excepcionales, si la evaluación del riesgo muestra que una segunda cuerda haría más lento el trabajo, puede admitirse una sola cuerda, justificando las razones técnicas y adoptando medidas adecuadas para garantizar la seguridad.","Es errónea: en circunstancias excepcionales, si la evaluación del riesgo muestra que una segunda cuerda haría más peligroso el trabajo, puede admitirse una sola cuerda, justificando las razones técnicas y sin que sea preciso adoptar medidas adicionales de seguridad.","Es acertada: ni siquiera en circunstancias excepcionales, aunque la evaluación del riesgo muestre que una segunda cuerda haría más peligroso el trabajo, puede admitirse una sola cuerda, pues el RD 2177/2004 exige como mínimo dos cuerdas."],"«No es falso que» equivale a «es verdad que», así que el coordinador sostiene que la segunda cuerda es obligatoria SIEMPRE. 1.1 lo desmiente: en circunstancias excepcionales en que, según la evaluación del riesgo, la segunda cuerda haga más PELIGROSO el trabajo, puede admitirse una sola, siempre que se justifiquen las razones técnicas y se tomen medidas adecuadas para garantizar la seguridad. Fallan la que la califica de «acertada», la que usa el criterio «más lento» y la que dice «sin que sea preciso adoptar medidas adicionales»."],
[0,"Según 1.3, ¿qué atribución de características a los sistemas de protección individual es correcta?",["Retención: limita el movimiento para que no se alcance la zona de caída y no es adecuado si se necesita la sujeción del arnés. Anticaídas: permite llegar a zonas con riesgo de caída libre y limita la distancia de caída. Rescate: permite autorrescatarse o rescatar a otros.","Retención: limita el movimiento para que no se alcance la zona de caída y es el adecuado cuando se necesita la sujeción del arnés. Anticaídas: permite llegar a zonas con riesgo de caída libre y limita la distancia de caída. Rescate: permite autorrescatarse o rescatar a otros.","Retención: limita el movimiento para que no se alcance la zona de caída y no es adecuado si se necesita la sujeción del arnés. Anticaídas: impide llegar a zonas con riesgo de caída libre y limita la distancia de caída. Rescate: permite autorrescatarse o rescatar a otros.","Retención: limita el movimiento para que no se alcance la zona de caída y no es adecuado si se necesita la sujeción del arnés. Anticaídas: permite llegar a zonas con riesgo de caída libre y limita la distancia de caída. Rescate: permite rescatar a otros, pero no autorrescatarse."],"1.3: la retención evita que se produzca la caída limitando el movimiento y NO es adecuada cuando el operario necesita la sujeción del arnés (falla «es el adecuado cuando se necesita la sujeción»). El anticaídas PERMITE llegar a zonas con riesgo de caída libre y limita la distancia hasta detenerla; «impide llegar» es una característica trasladada desde la retención. El sistema de rescate permite autorrescatarse o rescatar a otros, por lo que falla «pero no autorrescatarse»."],
[0,"En relación con el sistema de acceso mediante cuerda descrito en 1.3, ¿qué descripción es la correcta?",["Consta de una línea de trabajo y otra de seguridad, fijadas por separado a la estructura pero ambas enganchadas al arnés; la de seguridad actúa solamente si hay problemas con la de trabajo o si el operario comete un error.","Consta de una línea de trabajo y otra de seguridad, fijadas a un mismo punto de la estructura y ambas enganchadas al arnés; la de seguridad actúa solamente si hay problemas con la de trabajo o si el operario comete un error.","Consta de una línea de trabajo y otra de seguridad, fijadas por separado a la estructura, aunque solo la de trabajo va enganchada al arnés; la de seguridad actúa solamente si hay problemas con la de trabajo o si el operario comete un error.","Consta de una línea de trabajo y otra de seguridad, fijadas por separado a la estructura pero ambas enganchadas al arnés; la de seguridad actúa de forma permanente, compartiendo con la de trabajo el peso del operario."],"1.3: el sistema de acceso mediante cuerda tiene una línea de trabajo y una de seguridad fijadas POR SEPARADO a la estructura, pero AMBAS enganchadas al arnés, y la de seguridad actúa SOLAMENTE ante problemas con la de trabajo o un error del operario. Falla la que las fija «a un mismo punto de la estructura», la que dice que «solo la de trabajo va enganchada al arnés» y la que hace actuar la de seguridad «de forma permanente»."],
[0,"Un bombero debe trabajar en un poste, en posición incómoda y con las dos manos libres, y se opta por un sistema de posicionamiento. ¿Qué montaje se ajusta a lo descrito en 1.3?",["Fijar las anillas laterales (EN 358) y/o la frontal (EN 813) del arnés al punto de anclaje o a la estructura fija, en combinación con un sistema anticaídas adecuado, porque el posicionamiento no sirve para detener una caída.","Fijar las anillas laterales (EN 813) y/o la frontal (EN 358) del arnés al punto de anclaje o a la estructura fija, en combinación con un sistema anticaídas adecuado, porque el posicionamiento no sirve para detener una caída.","Fijar las anillas laterales (EN 358) y/o la frontal (EN 813) del arnés al punto de anclaje o a la estructura fija, sin necesidad de un sistema anticaídas, porque el posicionamiento ya sirve por sí solo para detener una caída.","Fijar las anillas laterales (EN 358) y/o la frontal (EN 813) del arnés al punto de anclaje o a la estructura fija, en combinación con un sistema de retención adecuado, porque el posicionamiento no sirve para detener una caída."],"1.3: los dispositivos de posicionamiento fijan las anillas laterales (EN 358) y/o frontal (EN 813) del arnés al punto de anclaje o a la estructura fija; permiten usar las dos manos, pero NO sirven para detener una caída, por lo que se combinan con un sistema ANTICAÍDAS adecuado. Falla la que intercambia las normas («laterales (EN 813)»), la que dice que el posicionamiento «ya sirve por sí solo para detener una caída» y la que lo combina con un «sistema de retención»."],
[0,"Tras revisar un equipo, un instructor afirma: «**No** es cierto que el sistema anticaídas **no** limite la fuerza que recibe el cuerpo». Según 1.3, ¿qué interpretación **NO** contradice ni esa afirmación ni el temario?",["El anticaídas detiene la caída limitando la fuerza que recibe el cuerpo, pues incorpora un dispositivo de disipación de energía que la mantiene dentro de los valores que tolera el cuerpo humano, y limita la distancia de caída hasta detenerla.","El anticaídas detiene la caída sin limitar la fuerza que recibe el cuerpo, aunque incorpora un dispositivo de disipación de energía que la mantiene dentro de los valores que tolera el cuerpo humano, y limita la distancia de caída hasta detenerla.","El anticaídas evita que la caída llegue a producirse limitando la fuerza que recibe el cuerpo, pues incorpora un dispositivo de disipación de energía que la mantiene dentro de los valores que tolera el cuerpo humano, y limita la distancia de caída.","El anticaídas detiene la caída limitando la fuerza que recibe el cuerpo, pues incorpora un dispositivo de disipación de energía que la mantiene dentro de los valores que tolera el cuerpo humano, aunque no limita la distancia de caída hasta detenerla."],"Doble negación: «no es cierto que no limite» equivale a afirmar que el anticaídas SÍ limita la fuerza que recibe el cuerpo. 1.3: se utiliza para DETENER la caída limitando esa fuerza, incorpora un dispositivo de disipación de energía que la mantiene en valores tolerables y limita la distancia de caída hasta detenerla. Falla la de «sin limitar la fuerza» (contradice la afirmación), la de «evita que la caída llegue a producirse» (eso es la retención) y la de «no limita la distancia de caída»."],
[0,"Según 1.2, ¿qué secuencia de decisión es correcta para elegir las medidas de protección en un trabajo temporal en altura, cuyo riesgo prevalente es la caída de altura?",["Priorizar los equipos de protección colectiva; si no es posible utilizarlos, emplear técnicas de acceso y posicionamiento con cuerdas y utilizar EPI, justificando la elección con una evaluación de los riesgos específicos.","Priorizar los equipos de protección individual; si no es posible utilizarlos, emplear equipos de protección colectiva con técnicas de acceso y posicionamiento, justificando la elección con una evaluación de los riesgos específicos.","Priorizar los equipos de protección colectiva; si no es posible utilizarlos, emplear técnicas de acceso y posicionamiento con cuerdas y utilizar EPI, sin que la elección tenga que justificarse con una evaluación de los riesgos específicos.","Priorizar los equipos de protección colectiva; si no es posible utilizarlos, emplear técnicas de acceso y posicionamiento con cuerdas sin necesidad de EPI, justificando la elección con una evaluación de los riesgos específicos."],"1.2: prevalecen los equipos de protección colectiva sobre los individuales; cuando no sea posible utilizar EPC, se emplean técnicas de acceso y posicionamiento con cuerdas y EPI, y esa elección tiene que estar justificada por una evaluación de los riesgos específicos. Falla la que prioriza la «protección individual» (orden invertido), la que dice «sin que la elección tenga que justificarse» y la que emplea las cuerdas «sin necesidad de EPI»."],
[0,"Respecto a la legislación específica sobre trabajos temporales en altura citada en 1.1, ¿cuál de las siguientes afirmaciones es correcta?",["El Real Decreto 2177/2004, de 12 de noviembre, modifica el Real Decreto 1215/1997, de 18 de julio, sobre disposiciones mínimas de seguridad y salud para la utilización por los trabajadores de los equipos de trabajo, en materia de trabajos temporales en altura.","El Real Decreto 1215/1997, de 18 de julio, modifica el Real Decreto 2177/2004, de 12 de noviembre, sobre disposiciones mínimas de seguridad y salud para la utilización por los trabajadores de los equipos de trabajo, en materia de trabajos temporales en altura.","El Real Decreto 2177/2004, de 8 de noviembre, modifica el Real Decreto 1215/1997, de 18 de julio, sobre disposiciones mínimas de seguridad y salud para la utilización por los trabajadores de los equipos de trabajo, en materia de trabajos temporales en altura.","El Real Decreto 2177/2004, de 12 de noviembre, modifica la Ley 31/1995, de 8 de noviembre, sobre disposiciones mínimas de seguridad y salud para la utilización por los trabajadores de los equipos de trabajo, en materia de trabajos temporales en altura."],"1.1: el Real Decreto 2177/2004, de 12 de noviembre, modifica el Real Decreto 1215/1997, de 18 de julio, y establece las disposiciones mínimas de seguridad y salud para la utilización de los equipos de trabajo en trabajos temporales en altura. Falla la que invierte la relación («el Real Decreto 1215/1997 ... modifica el Real Decreto 2177/2004»), la que le asigna la fecha «de 8 de noviembre» (propia de la Ley 31/1995) y la que dice que modifica «la Ley 31/1995»."],
[1,"Sobre el marco normativo de los EPI expuesto en el apartado 2.1, ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["La Ley 31/1995 nace de la transposición de la Directiva 89/391/CEE y define el EPI en su artículo 4.8; la norma 773/1997 recoge en su artículo 7 los principios de las condiciones de uso, y la 1407/1992 fija en su anexo II 3.1.2 las exigencias complementarias frente a caídas de altura.","La Ley 31/1995 nace de la transposición de la Directiva 89/391/CEE y define el EPI en su artículo 17; la norma 773/1997 recoge en su artículo 7 los principios de las condiciones de uso, y la 1407/1992 fija en su anexo II 3.1.2 las exigencias complementarias frente a caídas de altura.","La Ley 31/1995 nace de la transposición de la Directiva 89/391/CEE y define el EPI en su artículo 4.8; la norma 773/1997 recoge en su artículo 17 los principios de las condiciones de uso, y la 1407/1992 fija en su anexo II 3.1.2 las exigencias complementarias frente a caídas de altura.","La Ley 31/1995 nace de la transposición de la Directiva 89/391/CEE y define el EPI en su artículo 4.8; la norma 1407/1992 recoge en su artículo 7 los principios de las condiciones de uso, y la 773/1997 fija en su anexo II 3.1.2 las exigencias complementarias frente a caídas de altura."],"«NO es incorrecta» equivale a «es correcta». Según 2.1, la Ley 31/1995 traspone la Directiva 89/391/CEE y hace en su artículo 4.8 la primera definición de EPI; su artículo 17 recoge la obligación de las empresas de dotar de EPI y vigilar su uso, por lo que falla «define el EPI en su artículo 17». Los principios de las condiciones de uso están en el artículo 7 de la 773/1997, no en su «artículo 17». El anexo II 3.1.2, con las exigencias frente a caídas de altura, pertenece a la 1407/1992 (comercialización y libre circulación), así que falla la opción que intercambia ambas normas."],
[1,"Un jefe de dotación debe fijar cuánto tiempo llevarán sus bomberos el arnés durante una intervención prolongada. Según el artículo 7.2 de la norma 773/1997, recogido en el apartado 2.1, ¿qué relación de factores determina esas condiciones de utilización?",["La gravedad del riesgo; el tiempo o frecuencia de exposición al riesgo; las condiciones del puesto de trabajo; las prestaciones del propio equipo, y los riesgos adicionales derivados de su utilización que no hayan podido evitarse.","La gravedad del riesgo; el tiempo o frecuencia de exposición al riesgo; las condiciones del puesto de trabajo; las prestaciones del propio equipo, y los riesgos adicionales derivados de su utilización aunque hayan podido evitarse.","La gravedad del riesgo; el tiempo o frecuencia de exposición al riesgo; las condiciones del puesto de trabajo; la edad y vida útil del propio equipo, y los riesgos adicionales derivados de su utilización que no hayan podido evitarse.","La gravedad del riesgo; el tiempo o frecuencia de exposición al riesgo; la compatibilidad con otros equipos; las prestaciones del propio equipo, y los riesgos adicionales derivados de su utilización que no hayan podido evitarse."],"El artículo 7.2 (apartado 2.1) enumera cinco factores: gravedad del riesgo, tiempo o frecuencia de exposición, condiciones del puesto de trabajo, prestaciones del propio equipo y riesgos adicionales de su utilización que NO hayan podido evitarse; falla «aunque hayan podido evitarse», que invierte la condición. «La edad y vida útil» del equipo aparece en 2.3 y 2.4 como criterio de revisión y baja, no como factor del artículo 7.2. «La compatibilidad con otros equipos» es uno de los criterios con los que el fabricante establece las condiciones de uso, no un factor de esa lista, y además desplaza a las condiciones del puesto de trabajo."],
[1,"Al evaluar un nuevo sistema anticaídas, un técnico afirma: «**No** es cierto que el folleto informativo del fabricante **no** deba precisar la longitud residual mínima del elemento de amarre». Según el anexo II 3.1.2 de la norma 1407/1992 (apartado 2.1), ¿qué interpretación **NO** contradice ni esa afirmación ni las exigencias de dicho anexo?",["La afirmación exige que el folleto precise esa longitud residual mínima por debajo de la cintura del usuario; además, el EPI debe lograr que la desnivelación del cuerpo sea lo más pequeña posible y garantizar, una vez producido el frenado, una postura correcta para esperar auxilio.","La afirmación exime al folleto de precisar esa longitud residual mínima por debajo de la cintura del usuario; además, el EPI debe lograr que la desnivelación del cuerpo sea lo más pequeña posible y garantizar, una vez producido el frenado, una postura correcta para esperar auxilio.","La afirmación exige que el folleto precise esa longitud residual mínima por encima de la cintura del usuario; además, el EPI debe lograr que la desnivelación del cuerpo sea lo más pequeña posible y garantizar, una vez producido el frenado, una postura correcta para esperar auxilio.","La afirmación exige que el folleto precise esa longitud residual mínima por debajo de la cintura del usuario; además, el EPI debe lograr que la desnivelación del cuerpo sea lo más pequeña posible y garantizar, antes de producirse el frenado, una postura correcta para esperar auxilio."],"Doble negación: «no es cierto que no deba precisar» equivale a «debe precisar»; falla la opción según la cual la afirmación «exime al folleto». El anexo II 3.1.2 (apartado 2.1) exige que el folleto indique las características del punto de anclaje seguro y la «longitud residual mínima» del elemento de amarre por DEBAJO de la cintura del usuario (falla «por encima»). También exige que la desnivelación del cuerpo sea lo más pequeña posible y garantizar, UNA VEZ PRODUCIDO el frenado, una postura correcta que permita esperar auxilio (falla «antes de producirse el frenado»)."],
[1,"Un bombero revisa los puntos de enganche de su arnés integral antes de una práctica en una torre. Según el apartado 2.2.1, ¿qué asignación de norma y resistencia aproximada a cada anillo es la correcta?",["Dorsal: EN 361 y 16 kN; esternal: EN 361 y 20 kN; ventral, el más utilizado en altura: EN 358 y 20 kN; laterales, para posicionarse en postes con las manos libres: EN 358 y 15 kN cada uno.","Dorsal: EN 361 y 20 kN; esternal: EN 361 y 16 kN; ventral, el más utilizado en altura: EN 358 y 20 kN; laterales, para posicionarse en postes con las manos libres: EN 358 y 15 kN cada uno.","Dorsal: EN 361 y 16 kN; esternal: EN 361 y 20 kN; ventral, el más utilizado en altura: EN 361 y 20 kN; laterales, para posicionarse en postes con las manos libres: EN 358 y 15 kN cada uno.","Dorsal: EN 361 y 16 kN; esternal: EN 361 y 20 kN; ventral, el más utilizado en altura: EN 358 y 20 kN; laterales, para posicionarse en postes con las manos libres: EN 358 y 15 kN entre ambos."],"Apartado 2.2.1: la fijación dorsal (EN 361) tiene una resistencia de unos 16 kN y la esternal (EN 361), de unos 20 kN; falla la opción que intercambia esas cifras. La ventral, la más utilizada en trabajos en altura, es EN 358 (no «EN 361») y resiste unos 20 kN. Las laterales (EN 358), para posicionamiento en postes con las manos libres, resisten 15 kN «cada uno», no «entre ambos»."],
[1,"Al recibir una partida de cascos, el responsable de material redacta las pautas de aceptación y de verificación. Según los apartados 2.2.1 y 2.4, ¿qué pauta se ajusta por completo al temario?",["El barboquejo debe soportar una tracción igual o superior a 50 daN y el casco cumplir la EN 397 en aislamiento eléctrico, proyecciones de metal de fusión, deformación lateral y uso a baja temperatura; una vez apretado, solo debe soltarse mediante la rueda de ajuste.","El barboquejo debe soportar una tracción igual o superior a 50 kN y el casco cumplir la EN 397 en aislamiento eléctrico, proyecciones de metal de fusión, deformación lateral y uso a baja temperatura; una vez apretado, solo debe soltarse mediante la rueda de ajuste.","El barboquejo debe soportar una tracción igual o superior a 50 daN y el casco cumplir la EN 397 en aislamiento térmico, proyecciones de metal de fusión, deformación lateral y uso a baja temperatura; una vez apretado, solo debe soltarse mediante la rueda de ajuste.","El barboquejo debe soportar una tracción igual o superior a 50 daN y el casco cumplir la EN 397 en aislamiento eléctrico, proyecciones de metal de fusión, deformación lateral y uso a baja temperatura; una vez apretado, puede soltarse con un tirón firme o mediante la rueda de ajuste."],"2.2.1: el barboquejo debe soportar una tracción igual o superior a 50 daN (equivalente a unos 50 kg), no «50 kN», que equivaldría a unas cinco toneladas. La EN 397 exige aislamiento ELÉCTRICO (no «térmico»), protección contra las proyecciones de metal de fusión, deformación lateral y utilización a baja temperatura. 2.4: se prueban las ruedas de ajuste y, una vez apretado, el casco no debe soltarse a no ser que sea mediante la rueda de ajuste, por lo que falla «con un tirón firme»."],
[1,"Un bombero solo dispone de un arnés básico de cintura EN 358 y va a trabajar con riesgo de caída. Su jefe afirma: «**No** es cierto que **no** sea falso que el arnés de pecho resulte prescindible en este caso». Según el apartado 2.2.1, ¿qué interpretación **NO** contradice ni esa afirmación ni el temario?",["Niega que el arnés de pecho sea prescindible: es obligatorio al no disponer de arnés integral, su función es mantener erguido el cuerpo en caso de caída y, siendo EN 12277, unido al de cintura EN 358 forma un arnés anticaída EN 361.","Admite que el arnés de pecho sea prescindible: no es obligatorio al disponer de arnés de cintura, su función es mantener erguido el cuerpo en caso de caída y, siendo EN 12277, unido al de cintura EN 358 forma un arnés anticaída EN 361.","Niega que el arnés de pecho sea prescindible: es obligatorio al no disponer de arnés integral, su función es mantener erguido el cuerpo en caso de caída y, siendo EN 12277, unido al de cintura EN 358 forma un arnés de asiento EN 813.","Niega que el arnés de pecho sea prescindible: es obligatorio al no disponer de arnés integral, su función es mantener erguido el cuerpo en caso de caída y, siendo EN 358, unido al de cintura EN 12277 forma un arnés anticaída EN 361."],"Triple negación: «no sea falso que P» equivale a «P es verdadero», y «no es cierto que P sea verdadero» equivale a «P es falso»; luego el arnés de pecho NO es prescindible y falla la opción que «admite» que lo sea. 2.2.1: su uso es obligatorio siempre que no se disponga de arnés integral y exista riesgo de caída, y su función es mantener erguido el cuerpo. La suma es arnés de pecho EN 12277 + arnés de cintura EN 358 = arnés anticaída EN 361; fallan la que lo convierte en «arnés de asiento EN 813» (norma opcional de comodidad) y la que intercambia las normas de pecho y cintura."],
[1,"Se instala un cabo con absorbedor de energía en una cabecera donde un mosquetón quedará inevitablemente apoyado sobre un saliente. Según el apartado 2.2.1, ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Los mosquetones llevarán marcado CE y UNE-EN 362 y resistirán al menos 22 kN con el gatillo cerrado y 6 kN abierto; el mosquetón se instalará mediante cintas o se reforzará con doble sistema de seguridad, y el absorbedor se descose con una tracción de unos 4,5 kN.","Los mosquetones llevarán marcado CE y UNE-EN 362 y resistirán al menos 6 kN con el gatillo cerrado y 22 kN abierto; el mosquetón se instalará mediante cintas o se reforzará con doble sistema de seguridad, y el absorbedor se descose con una tracción de unos 4,5 kN.","Los mosquetones llevarán marcado CE y UNE-EN 362 y resistirán al menos 22 kN con el gatillo cerrado y 6 kN abierto; el mosquetón se instalará mediante cordinos o se reforzará con doble sistema de seguridad, y el absorbedor se descose con una tracción de unos 4,5 kN.","Los mosquetones llevarán marcado CE y UNE-EN 362 y resistirán al menos 22 kN con el gatillo cerrado y 6 kN abierto; el mosquetón se instalará mediante cintas o se reforzará con doble sistema de seguridad, y el absorbedor se descose con una tracción de unos 6 kN."],"«NO es incorrecta» equivale a «es correcta». 2.2.1: los mosquetones de trabajo deben tener marcado CE, UNE-EN 362 y una resistencia mínima de 22 kN con el gatillo CERRADO y 6 kN ABIERTO; falla la opción que invierte las cifras. Apoyarse en un saliente es una posición incorrecta que reduce considerablemente la resistencia; si no puede evitarse, se instalará mediante CINTAS o se reforzará con doble sistema de seguridad (los «cordinos» no cumplen ninguna norma, según 2.2.3). El absorbedor se descose con una tracción de unos 4,5 kN (450 kg); «6 kN» es la resistencia del mosquetón abierto."],
[1,"Durante un descenso con un ID, un bombero tira bruscamente de la empuñadura; el aparato está conectado mediante un maillón. Según el apartado 2.2.1, ¿qué afirmación es la única correcta?",["La empuñadura antipánico bloquea el descenso al tirar demasiado fuerte, y la leva dentada de aluminio lo bloquea si la cuerda se monta mal; la velocidad de descenso no superará 2 m/s, y un maillón cargado sin cerrar la rosca puede deformarse y no cerrar, por lo que debe desecharse.","La leva dentada de aluminio bloquea el descenso al tirar demasiado fuerte, y la empuñadura antipánico lo bloquea si la cuerda se monta mal; la velocidad de descenso no superará 2 m/s, y un maillón cargado sin cerrar la rosca puede deformarse y no cerrar, por lo que debe desecharse.","La empuñadura antipánico bloquea el descenso al tirar demasiado fuerte, y la leva dentada de aluminio lo bloquea si la cuerda se monta mal; la velocidad de descenso no superará 1 m/s, y un maillón cargado sin cerrar la rosca puede deformarse y no cerrar, por lo que debe desecharse.","La empuñadura antipánico bloquea el descenso al tirar demasiado fuerte, y la leva dentada de aluminio lo bloquea si la cuerda se monta mal; la velocidad de descenso no superará 2 m/s, y un maillón cargado sin cerrar la rosca puede deformarse y no cerrar, por lo que debe repasarse su rosca antes de reutilizarlo."],"2.2.1: en el ID, la EMPUÑADURA ANTIPÁNICO bloquea el descenso si se tira demasiado fuerte, y la LEVA DENTADA de aluminio lo bloquea si la cuerda se monta de forma incorrecta; falla la opción que intercambia ambas funciones. La velocidad de descenso no será superior a 2 m/s (no «1 m/s»). El maillón usado sin cerrar la rosca puede deformarse al aplicarle carga y no cerrar, «por lo cual debe ser desechado», no «repasarse su rosca antes de reutilizarlo»."],
[1,"Durante un ascenso por cuerda asegurado con un ASAP, un bombero resbala y, por reflejo, agarra el aparato. Un compañero afirma: «**No** es verdad que el ASAP **no** llegue a bloquear si el usuario lo agarra durante la caída». Según el apartado 2.2.1, ¿qué interpretación **NO** contradice ni esa afirmación ni el temario?",["Sostiene que el ASAP bloquea aunque se agarre, porque el bloqueo se produce por la velocidad del movimiento; no necesita intervención manual en ascenso, descenso ni planos inclinados, y un bloqueador de puño no podría sustituirlo como anticaídas.","Sostiene que el ASAP deja de bloquear si se agarra, aunque el bloqueo se produce por la velocidad del movimiento; no necesita intervención manual en ascenso, descenso ni planos inclinados, y un bloqueador de puño no podría sustituirlo como anticaídas.","Sostiene que el ASAP bloquea aunque se agarre, porque el bloqueo se produce por la velocidad del movimiento; no necesita intervención manual en el ascenso, pero sí en el descenso y en planos inclinados, y un bloqueador de puño no podría sustituirlo como anticaídas.","Sostiene que el ASAP bloquea aunque se agarre, porque el bloqueo se produce por la velocidad del movimiento; no necesita intervención manual en ascenso, descenso ni planos inclinados, y un bloqueador de puño sí podría sustituirlo como anticaídas."],"Doble negación: «no es verdad que no llegue a bloquear» equivale a «sí bloquea» aunque el usuario lo agarre; falla la opción según la cual «deja de bloquear». 2.2.1: el ASAP no necesita intervención manual en maniobras de ascenso, descenso y planos inclinados, y el bloqueo se produce por velocidad de movimiento, incluso si lo agarra el usuario en la caída; falla «pero sí en el descenso y en planos inclinados». Los bloqueadores no sustituyen EN NINGÚN CASO a un anticaídas, por lo que falla «sí podría sustituirlo»."],
[1,"Se tracciona lentamente, con una carga superior a 50 kg, un tramo de 40 m de cuerda semiestática EN 1891 de tipo A. Según el apartado 2.2.2, ¿qué conjunto de datos es el correcto?",["Su alargamiento estático no debería superar unos 2 m (5 %); su resistencia estática mínima es de 22 kN, y su número de caídas se ensaya con caídas de factor 1 y una masa de 100 kg.","Su alargamiento estático no debería superar unos 12 m (30 %); su resistencia estática mínima es de 22 kN, y su número de caídas se ensaya con caídas de factor 1 y una masa de 100 kg.","Su alargamiento estático no debería superar unos 2 m (5 %); su resistencia estática mínima es de 18 kN, y su número de caídas se ensaya con caídas de factor 1 y una masa de 100 kg.","Su alargamiento estático no debería superar unos 2 m (5 %); su resistencia estática mínima es de 22 kN, y su número de caídas se ensaya con caídas de factor 0,3 y una masa de 100 kg."],"2.2.2: el alargamiento estático (tracción con una carga superior a 50 kg) no debería superar el 5 % en una semiestática: 40 m × 0,05 = 2 m; «12 m (30 %)» aplica por error el porcentaje de resistencia que aporta la camisa. La resistencia estática mínima es de 22 kN para el tipo A; «18 kN» es la del tipo B. El número de caídas se ensaya con factor 1 y 100 kg para el tipo A; el «factor 0,3» es el de la caída que la semiestática puede absorber gracias a su alargamiento del 5 %."],
[1,"Para extraer a un accidentado de un recinto con boca de acceso superior se dispone de trípode, sistema integrado de ascenso-descenso, triángulo de evacuación y camilla. Todas las afirmaciones siguientes se ajustan al apartado 2.2.2 **salvo** una. ¿Cuál **no** se ajusta?",["Trípode: se considera un anclaje móvil, la mayoría de los modelos son de altura fija y, para evitar movimientos involuntarios, debe anclarse o estabilizarse mediante tirantes o vientos.","Sistema integrado: polipasto con sistema de frenos ya montado, cuyas grandes ventajas son la rapidez de instalación y poder revertir su funcionamiento sin tener que desmontarlo.","Triángulo de evacuación: permite asistir al usuario en la entrada o salida desde el exterior, mantenerlo en posición vertical con comodidad y complementarse con sujeción por los hombros.","Camilla: más estrecha y flexible que las normales, permite tapar al herido y lleva arnés interior para que no se desplace durante el transporte, incluso en posición vertical."],"Se busca la única afirmación que NO se ajusta al temario. 2.2.2: los trípodes se consideran anclajes móviles y deben anclarse o estabilizarse con tirantes o vientos, pero la mayoría de los modelos son de altura REGULABLE y se adaptan al espacio de entrada, no «de altura fija». Las demás son correctas: los sistemas integrados son polipastos con frenos ya montados cuyas ventajas son la rapidez de instalación y revertir el funcionamiento sin desmontarlos; los arneses de salvamento permiten la asistencia desde el exterior y la posición vertical cómoda, y admiten sujeción por los hombros; las camillas son más estrechas y flexibles, con arnés interior y posibilidad de tapar al herido."],
[1,"Para preparar una cabecera de izado, un equipo selecciona material auxiliar. Según el apartado 2.2.3, ¿qué afirmación es la única correcta?",["El eslabón giratorio admite hasta tres conectores, con 5 kN de carga de trabajo y 36 kN de rotura; el grillon se regula con leva pivotante sin muelle de retorno, y los cordinos, de diámetro variable, no cumplen ninguna norma.","El eslabón giratorio admite hasta tres conectores, con 5 kN de carga de trabajo y 22 kN de rotura; el grillon se regula con leva pivotante sin muelle de retorno, y los cordinos, de diámetro variable, no cumplen ninguna norma.","El eslabón giratorio admite hasta tres conectores, con 5 kN de carga de trabajo y 36 kN de rotura; el grillon se regula con leva pivotante con muelle de retorno, y los cordinos, de diámetro variable, no cumplen ninguna norma.","El eslabón giratorio admite hasta tres conectores, con 5 kN de carga de trabajo y 36 kN de rotura; el grillon se regula con leva pivotante sin muelle de retorno, y los cordinos, siempre de diámetro inferior a 9 mm, no cumplen ninguna norma."],"2.2.3: el eslabón giratorio, montado sobre rodamientos de bolas estancos, acoge hasta tres conectores y tiene una carga de trabajo de 5 kN y una carga de rotura de 36 kN; «22 kN» es la resistencia mínima del mosquetón con el gatillo cerrado. El grillon (EN 358) tiene regulación mecánica con leva pivotante y NO tiene muelle de retorno, para que los movimientos no desplacen la cuerda (falla «con muelle de retorno»). Los cordinos pueden variar en diámetro y no cumplen ninguna norma; el temario advierte expresamente contra la idea de que «son siempre de diámetro inferior a 9 mm»."],
[1,"En el inventario de un parque se agrupan los equipos según la norma que el temario les atribuye (apartados 2.2.1 y 2.2.3). ¿Qué agrupación es la correcta?",["EN 358: anillos ventral y laterales del arnés y grillon; EN 567: bloqueador de puño, bloqueador ventral y bloqueador basic; UNE-EN 12841 tipo B: puño y ventral, mientras que el ASAP es tipo A y cumple además la UNE-EN 353-2.","EN 358: anillos dorsal y laterales del arnés y grillon; EN 567: bloqueador de puño, bloqueador ventral y bloqueador basic; UNE-EN 12841 tipo B: puño y ventral, mientras que el ASAP es tipo A y cumple además la UNE-EN 353-2.","EN 358: anillos ventral y laterales del arnés y grillon; EN 567: bloqueador de puño, bloqueador ventral y bloqueador basic; UNE-EN 12841 tipo B: puño y ventral, mientras que el ASAP es tipo A y cumple además la UNE-EN 353-1.","EN 358: anillos ventral y laterales del arnés y grillon; EN 567: bloqueador de puño, bloqueador ventral y bloqueador basic; UNE-EN 12841 tipo B: puño y ASAP, mientras que el ventral es tipo A y cumple además la UNE-EN 353-2."],"2.2.1 y 2.2.3: la EN 358 corresponde a las fijaciones ventral y laterales del arnés y al grillon; la fijación dorsal es EN 361, por lo que falla «anillos dorsal». Puño, ventral (Croll) y bloqueador basic cumplen la EN 567, y puño y ventral, además, la UNE-EN 12841 tipo B. El ASAP cumple la UNE-EN 12841 tipo A y la UNE-EN 353-2; la «353-1» es la que regula los anticaídas sobre líneas de vida verticales de cable. Falla también la opción que sitúa el ASAP en el tipo B y el ventral en el tipo A."],
[1,"En la auditoría del sistema de gestión de EPI de un parque, el auditor afirma: «**No** es falso que **no** pueda darse por cumplida la revisión periódica con una revisión hecha por quien **no** sea persona competente». Según el apartado 2.3, ¿qué interpretación **NO** contradice ni esa afirmación ni el temario?",["Exige que la revisión periódica la haga una persona competente, al menos cada 12 meses y con la frecuencia fijada en el folleto del fabricante; las revisiones especiales son las que puede realizar el trabajador o la persona que determine la empresa.","Admite que la revisión periódica la haga cualquier trabajador, al menos cada 12 meses y con la frecuencia fijada en el folleto del fabricante; las revisiones especiales son las que puede realizar el trabajador o la persona que determine la empresa.","Exige que la revisión periódica la haga una persona competente, al menos cada 24 meses y con la frecuencia fijada en el folleto del fabricante; las revisiones especiales son las que puede realizar el trabajador o la persona que determine la empresa.","Exige que la revisión periódica la haga una persona competente, al menos cada 12 meses y con la frecuencia fijada en el folleto del fabricante; las revisiones especiales son las que únicamente puede realizar esa misma persona competente."],"Triple negación: «no es falso que X» equivale a «X es verdadero», y X dice que NO vale como periódica la revisión hecha por quien NO es persona competente; por tanto, la periódica exige persona competente y falla la opción que «admite» a «cualquier trabajador». 2.3: las revisiones periódicas las determina el fabricante en su folleto y deben hacerse al menos cada 12 meses, no «cada 24 meses». Las revisiones especiales son las que puede realizar el trabajador/a o la persona determinada por la empresa, no las que «únicamente» puede realizar la persona competente."],
[1,"En una intervención en una nave industrial, un arnés y varios mosquetones reciben salpicaduras de un producto químico que después se seca. Según el apartado 2.3, ¿qué valoración se ajusta al temario?",["En los metálicos se buscan, entre otros defectos, corrosiones, fisuras y rebabas, y en los textiles quemaduras, fusiones e hilos estirados; el arnés se desecha, pues los ensayos se hacen con químicos en estado puro y el producto seco deja un residuo concentrado que sigue actuando.","En los metálicos se buscan, entre otros defectos, corrosiones, fisuras y fusiones, y en los textiles quemaduras, rebabas e hilos estirados; el arnés se desecha, pues los ensayos se hacen con químicos en estado puro y el producto seco deja un residuo concentrado que sigue actuando.","En los metálicos se buscan, entre otros defectos, corrosiones, fisuras y rebabas, y en los textiles quemaduras, fusiones e hilos estirados; el arnés se desecha, pues los ensayos se hacen con químicos en estado diluido y el producto seco deja un residuo concentrado que sigue actuando.","En los metálicos se buscan, entre otros defectos, corrosiones, fisuras y rebabas, y en los textiles quemaduras, fusiones e hilos estirados; el arnés se desecha, pues los ensayos se hacen con químicos en estado puro, aunque el producto, una vez seco, ya deja de actuar."],"2.3: en los componentes metálicos se revisan desgaste, marcas, deformaciones, corrosiones, fisuras y REBABAS; en los textiles, entre otros, quemaduras, FUSIONES, cortes, desgarros e hilos estirados (falla la opción que intercambia «rebabas» y «fusiones»). Los metálicos resisten bastante bien los químicos y los textiles no, y el mensaje general es producto textil + producto químico = desechar. Los motivos son que los ensayos se realizan con químicos en estado PURO (no «diluido»), que no se dan en la realidad, y que el químico seco deja un residuo altamente concentrado que PUEDE SEGUIR ACTUANDO (falla «ya deja de actuar»)."],
[1,"Tras un rescate en un talud, una cuerda semiestática fabricada hace siete años y apenas usada ha quedado embarrada. Según los apartados 2.2.2 y 2.4, ¿qué secuencia de mantenimiento y qué criterios de retirada son los correctos?",["Lavarla con jabón neutro, aclararla después con agua limpia a 30 °C como máximo y secarla en lugar sombreado, aireado y fresco; un quiebro al revisarla indica rotura del alma, y aun sin defectos se desechará a los diez años de su fabricación.","Aclararla con agua limpia a 30 °C como máximo, lavarla después con jabón neutro y secarla en lugar sombreado, aireado y fresco; un quiebro al revisarla indica rotura del alma, y aun sin defectos se desechará a los diez años de su fabricación.","Lavarla con jabón neutro, aclararla después con agua limpia a 30 °C como máximo y secarla en lugar sombreado, aireado y fresco; un quiebro al revisarla indica rotura de la camisa, y aun sin defectos se desechará a los diez años de su fabricación.","Lavarla con jabón neutro, aclararla después con agua limpia a 30 °C como máximo y secarla en lugar sombreado, aireado y fresco; un quiebro al revisarla indica rotura del alma, y aun sin defectos se desechará a los diez años de su primer uso."],"2.4: las cuerdas han de lavarse con jabón neutro y un POSTERIOR aclarado con agua limpia como máximo a 30 °C, con secado en lugar sombreado, aireado y fresco; falla la opción que aclara antes de lavar. En la verificación visual y táctil, los quiebros indican rotura del ALMA, no «de la camisa». 2.2.2: las cuerdas deben desecharse a los diez años de su FABRICACIÓN aunque no se hayan usado, no a los diez años «de su primer uso»."],
[2,"Un operario está unido al punto de anclaje por 1,5 m de cuerda semiestática y sufre una caída en la que pierde 2,25 m de altura. Aplicando 3.3, ¿qué valoración es correcta?",["F = 1,5; está dentro del intervalo de 0 a 2 propio de las condiciones normales de trabajo, pero supera el valor 1 por encima del cual una cuerda semiestática no podrá soportarlo.","F ≈ 0,67; está dentro del intervalo de 0 a 2 propio de las condiciones normales de trabajo y no supera el valor 1 por encima del cual una cuerda semiestática no podrá soportarlo.","F = 1,5; está dentro del intervalo de 0 a 2 propio de las condiciones normales de trabajo y, precisamente por estar en ese intervalo, una cuerda semiestática podrá soportarlo sin problema.","F = 3,75; queda fuera del intervalo de 0 a 2 propio de las condiciones normales de trabajo y supera el valor 1 por encima del cual una cuerda semiestática no podrá soportarlo."],"3.3: F = H / L = 2,25 / 1,5 = 1,5. Ese valor está entre 0 y 2, pero una cuerda semiestática no podrá soportar F por encima de 1, por lo que falla la que concluye que podrá soportarlo «sin problema». «F ≈ 0,67» es el error de dividir L entre H (1,5 / 2,25) y «F = 3,75» es el error de sumar H y L."],
[2,"Cuatro operarios sufren caídas con estos datos de pérdida de altura (H) y longitud de cuerda que los une al anclaje (L): P, H = 1 m y L = 2 m; Q, H = 3 m y L = 4 m; R, H = 2 m y L = 1 m; S, H = 1,8 m y L = 1,2 m. Según 3.3, ¿qué orden de menor a mayor factor de caída es correcto?",["P, Q, S, R; dos de las cuatro caídas superan el valor 1 por encima del cual una cuerda semiestática no podrá soportar el factor de caída.","P, S, R, Q; dos de las cuatro caídas superan el valor 1 por encima del cual una cuerda semiestática no podrá soportar el factor de caída.","R, S, Q, P; dos de las cuatro caídas superan el valor 1 por encima del cual una cuerda semiestática no podrá soportar el factor de caída.","R, S, P, Q; dos de las cuatro caídas superan el valor 1 por encima del cual una cuerda semiestática no podrá soportar el factor de caída."],"3.3: F = H / L. P = 1 / 2 = 0,5; Q = 3 / 4 = 0,75; S = 1,8 / 1,2 = 1,5; R = 2 / 1 = 2; el orden creciente es P, Q, S, R, y S y R superan 1. «P, S, R, Q» ordena solo por la pérdida de altura H; «R, S, Q, P» es el resultado de dividir L entre H (fórmula invertida); «R, S, P, Q» ordena solo por la longitud L."],
[2,"Un operario usa un elemento de amarre con absorbedor de energía cuya longitud total, incluidos conectores, es de 2 m; según sus instrucciones, la extensión del absorbedor tras disipar la energía es de 1,75 m. Aplicando los valores estándar de 3.4, ¿cuál es la distancia libre de caída?",["6,25 m: A = 2 m; B = 1,75 m; C = 1,50 m (promedio desde el enganche del arnés hasta los pies); y D = 1 m (distancia de seguridad entre los pies y el suelo).","5,75 m: A = 2 m; B = 1,75 m; C = 1,50 m (promedio desde el enganche del arnés hasta los pies); y D = 0,50 m (distancia de seguridad entre los pies y el suelo).","6,75 m: A = 2 m; B = 1,75 m; C = 2 m (promedio desde el enganche del arnés hasta los pies); y D = 1 m (distancia de seguridad entre los pies y el suelo).","4,50 m: A = 2 m; C = 1,50 m (promedio desde el enganche del arnés hasta los pies) y D = 1 m; B no se suma porque la extensión del absorbedor ya está incluida en A."],"3.4: la distancia libre de caída es A + B + C + D = 2 + 1,75 + 1,50 + 1 = 6,25 m. Falla «D = 0,50 m» (la distancia de seguridad entre pies y suelo es 1 m; 0,5 m es la cifra de riesgo de caída del Tema 1), «C = 2 m» (el promedio del enganche a los pies es 1,50 m) y la que no suma B porque «ya está incluida en A»: A es la longitud del dispositivo y B, la extensión del absorbedor tras la disipación, que se suma aparte."],
[2,"Un instructor afirma: «**No** es cierto que una cadena dinámica que absorba más energía **no** reduzca la fuerza de choque». Según 3.1, ¿qué interpretación **NO** contradice ni esa afirmación ni el temario?",["La energía potencial, que depende de la masa y de la altura de caída, se transforma por completo en energía cinética hasta la frenada; cuanta más energía absorban los elementos de la cadena dinámica, menor será la fuerza recibida por quien cae.","La energía potencial, que depende de la masa y de la altura de caída, se transforma por completo en energía cinética hasta la frenada; cuanta más energía absorban los elementos de la cadena dinámica, mayor será la fuerza recibida por quien cae.","La energía potencial, que depende de la masa y de la altura de caída, se transforma solo en parte en energía cinética hasta la frenada; cuanta más energía absorban los elementos de la cadena dinámica, menor será la fuerza recibida por quien cae.","La energía potencial, que depende únicamente de la altura de caída, se transforma por completo en energía cinética hasta la frenada; cuanta más energía absorban los elementos de la cadena dinámica, menor será la fuerza recibida por quien cae."],"Doble negación: «no es cierto que no reduzca» equivale a afirmar que absorber más energía SÍ reduce la fuerza de choque. 3.1: la energía potencial depende de la masa y de la altura, se transforma POR COMPLETO en cinética hasta la frenada, y cuanta más energía absorban los elementos de la cadena dinámica, MENOR será la fuerza recibida. Falla la de «mayor será la fuerza» (contradice la afirmación), la de «solo en parte» y la de «depende únicamente de la altura»."],
[2,"Respecto al valor de 6 kN que manejan 3.1 y 3.3, ¿cuál de las siguientes afirmaciones es correcta?",["Se obtiene sometiendo un cuerpo de masa 100 kg a una desaceleración de 6 g (1 g = 9,81 m/s²); una cuerda semiestática no podrá soportar F por encima de 1 y, en ciertas situaciones, se requiere disipación de energía para mantener la carga por debajo de 6 kN.","Se obtiene sometiendo un cuerpo de masa 60 kg a una desaceleración de 6 g (1 g = 9,81 m/s²); una cuerda semiestática no podrá soportar F por encima de 1 y, en ciertas situaciones, se requiere disipación de energía para mantener la carga por debajo de 6 kN.","Se obtiene sometiendo un cuerpo de masa 100 kg a una desaceleración de 6 g (1 g = 9,81 m/s²); una cuerda semiestática no podrá soportar F por encima de 2 y, en ciertas situaciones, se requiere disipación de energía para mantener la carga por debajo de 6 kN.","Se obtiene sometiendo un cuerpo de masa 100 kg a una desaceleración de 6 g (1 g = 9,81 m/s²); una cuerda semiestática no podrá soportar F por debajo de 1 y, en ciertas situaciones, se requiere disipación de energía para mantener la carga por debajo de 6 kN."],"3.1: los 6 kN, fuerza máxima soportable sin lesiones internas, se obtienen sometiendo un cuerpo de 100 kg a 6 g (100 × 6 × 9,81 ≈ 5,9 kN), no uno de «60 kg», que daría unos 3,5 kN. 3.3: una cuerda semiestática no podrá soportar F «por encima de 1», no «por encima de 2» (2 es el límite superior de F en condiciones normales) ni «por debajo de 1», que invierte el límite. En determinadas situaciones resulta vital un sistema de disipación de energía para mantener la carga por debajo de 6 kN."],
[2,"Según 3.2, ¿qué relación recoge únicamente elementos que el temario incluye en la cadena dinámica de seguridad y describe correctamente su función?",["Anclajes, conectores, nudos, arneses y dispositivos absorbedores y de detención, que evitan daños al cuerpo absorbiendo la energía de la fuerza de choque por amortiguación elástica o mecánica.","Anclajes, conectores, nudos, cascos y dispositivos absorbedores y de detención, que evitan daños al cuerpo absorbiendo la energía de la fuerza de choque por amortiguación elástica o mecánica.","Anclajes, conectores, guantes, arneses y dispositivos absorbedores y de detención, que evitan daños al cuerpo absorbiendo la energía de la fuerza de choque por amortiguación elástica o mecánica.","Anclajes, conectores, nudos, arneses y dispositivos absorbedores y de detención, que evitan daños al cuerpo transmitiéndole íntegra la energía de la fuerza de choque, sin amortiguación elástica ni mecánica."],"3.2: intervienen en la cadena dinámica los elementos de amarre, anclajes, arneses, conectores, los nudos y los dispositivos específicos absorbedores y de detención, que evitan daños al cuerpo absorbiendo la energía por amortiguación elástica o mecánica. Los «cascos» y los «guantes» no figuran en esa relación. Falla también la que dice que la cadena actúa «transmitiéndole íntegra la energía» sin amortiguación, que es lo contrario de su función."],
[2,"En una caída, la fuerza producida en el ramal del accidentado es de 4 kN y la fuerza de retención, de sentido contrario, en el otro ramal es de 2,5 kN; ambos ramales pasan por el último punto de seguro donde se frena el elemento de amarre. Según 3.6, ¿qué tracción soporta ese punto?",["6,5 kN, porque la fuerza de la caída y la de retención, de sentido contrario, se suman en ese punto (C = A + B), dato que se usa para calcular anclajes y puntos de seguro con resistencia suficiente.","1,5 kN, porque la fuerza de la caída y la de retención, de sentido contrario, se restan en ese punto (C = A − B), dato que se usa para calcular anclajes y puntos de seguro con resistencia suficiente.","4 kN, porque solo la fuerza de la caída ejerce tracción en ese punto y la de retención, al ser de sentido contrario, se anula, dato que se usa para calcular anclajes y puntos de seguro con resistencia suficiente.","3,25 kN, porque la fuerza de la caída y la de retención, de sentido contrario, se reparten por igual en ese punto, C = (A + B) / 2, dato que se usa para calcular anclajes y puntos de seguro con resistencia suficiente."],"3.6: el efecto polea es la sumatoria de fuerzas en el último punto de seguro: la fuerza de la caída y la de retención de sentido contrario se SUMAN y ejercen tracción sobre él (C = A + B = 4 + 2,5 = 6,5 kN). «1,5 kN» resta las fuerzas (4 − 2,5), «4 kN» ignora la retención y «3,25 kN» hace la media. Este efecto se tiene en cuenta para calcular anclajes y puntos de seguro que no rompan."],
[2,"Un operario trabaja junto a una pared, conectado a un punto de anclaje que no está en su vertical, sino desplazado lateralmente. Según 3.5, ¿cuál de las siguientes afirmaciones **NO** es incorrecta?",["Se expone al efecto péndulo o distancia libre de caída lateral: el desplazamiento lateral que se produce tras una caída cuando el anclaje no está perpendicular a quien cae, con riesgo de chocar contra un obstáculo de la trayectoria.","Se expone al efecto péndulo o distancia libre de caída vertical: el desplazamiento lateral que se produce tras una caída cuando el anclaje no está perpendicular a quien cae, con riesgo de chocar contra un obstáculo de la trayectoria.","Se expone al efecto polea o distancia libre de caída lateral: el desplazamiento lateral que se produce tras una caída cuando el anclaje no está perpendicular a quien cae, con riesgo de chocar contra un obstáculo de la trayectoria.","Se expone al efecto péndulo o distancia libre de caída lateral: el desplazamiento lateral que se produce tras una caída cuando el anclaje está perpendicular a quien cae, con riesgo de chocar contra un obstáculo de la trayectoria."],"«NO es incorrecta» equivale a «es correcta». 3.5 define el efecto péndulo o «distancia libre de caída lateral» como el desplazamiento lateral tras una caída cuando el punto de anclaje NO está perpendicular a la persona que cae, situación peligrosa por el posible choque contra un obstáculo. Falla la que lo llama distancia de caída «vertical», la que lo llama «efecto polea» (3.6, fuerzas en el último punto de seguro) y la que dice «cuando el anclaje está perpendicular»."],
[2,"Para mantener la carga por debajo de 6 kN cuando el factor de caída es alto, 3.3 recurre a dispositivos con sistema de disipación de energía. ¿Qué relación de sus tres categorías es correcta?",["Anticaídas deslizantes con cable o cuerda (EN 353), anticaídas retráctiles (EN 360) y elementos de amarre con absorbedores de energía (EN 355).","Anticaídas deslizantes con cable o cuerda (EN 360), anticaídas retráctiles (EN 353) y elementos de amarre con absorbedores de energía (EN 355).","Anticaídas deslizantes con cable o cuerda (EN 353), anticaídas retráctiles (EN 360) y elementos de amarre con absorbedores de energía (EN 358).","Anticaídas deslizantes con cable o cuerda (EN 353), anticaídas retráctiles (EN 360) y cuerdas semiestáticas con absorción de energía (UNE-EN 891)."],"3.3: los dispositivos con disipación de energía se dividen en anticaídas deslizantes con cable o cuerda (EN 353), anticaídas retráctiles (EN 360) y elementos de amarre con absorbedores de energía (EN 355). Falla la que intercambia «EN 360» y «EN 353», la que asigna a los absorbedores la «EN 358» (norma de las anillas laterales de posicionamiento del Tema 1) y la que incluye las «cuerdas semiestáticas», que el temario cita solo por no soportar F por encima de 1."],
[2,"Al planificar un trabajo, un jefe de equipo afirma: «**No** es falso que la distancia libre de caída **no** dependa del dispositivo de detención utilizado». Según 3.4, ¿qué valoración es correcta?",["Es errónea: la distancia depende del dispositivo y se obtiene sumando su longitud total con conectores y elementos de amarre (A), la cuerda o cable empleado o la extensión del absorbedor indicada en sus instrucciones (B), 1,50 m (C) y 1 m (D).","Es acertada: la distancia no depende del dispositivo y se obtiene sumando su longitud total con conectores y elementos de amarre (A), la cuerda o cable empleado o la extensión del absorbedor indicada en sus instrucciones (B), 1,50 m (C) y 1 m (D).","Es errónea: la distancia depende del dispositivo y se obtiene sumando su longitud total con conectores y elementos de amarre (A), la cuerda o cable empleado o la extensión del absorbedor indicada en sus instrucciones (B), 1 m (C) y 1,50 m (D).","Es errónea: la distancia depende del dispositivo y se obtiene sumando su longitud total sin conectores ni elementos de amarre (A), la cuerda o cable empleado o la extensión del absorbedor indicada en sus instrucciones (B), 1,50 m (C) y 1 m (D)."],"«No es falso que» equivale a «es verdad que», así que el jefe sostiene que la distancia NO depende del dispositivo, y 3.4 dice lo contrario: depende del dispositivo de detención utilizado; por eso falla la que la califica de «acertada». Se calcula sumando A, longitud total incluyendo conectores y elementos de amarre (falla «sin conectores»); B, según las instrucciones; C, 1,50 m, y D, 1 m (falla la que invierte esos dos valores y da 1 m a C y 1,50 m a D)."],
[2,"Dos operarios pierden 4 m de altura en sendas caídas: el primero estaba unido al anclaje por 2 m de cuerda y el segundo por 4 m. Según 3.3, ¿qué conclusión es correcta?",["El primero sufre un factor de caída 2 y el segundo un factor 1; aunque la pérdida de altura sea la misma, la caída del primero describe un nivel de riesgo mayor.","El primero sufre un factor de caída 0,5 y el segundo un factor 1; aunque la pérdida de altura sea la misma, la caída del primero describe un nivel de riesgo menor.","Ambos sufren el mismo factor de caída, porque la pérdida de altura es la misma; por tanto, las dos caídas describen exactamente el mismo nivel de riesgo.","El primero sufre un factor de caída 2 y el segundo un factor 1; como ambos valores están entre 0 y 2, las dos caídas describen exactamente el mismo nivel de riesgo."],"3.3: F = H / L, valor que describe el nivel de riesgo de la caída. Primero: 4 / 2 = 2; segundo: 4 / 4 = 1; con igual pérdida de altura, el primero tiene mayor factor y mayor riesgo. «0,5 y 1» con «riesgo menor» resulta de invertir la fórmula (L / H); «el mismo factor, porque la pérdida de altura es la misma» ignora L; y estar ambos entre 0 y 2 no iguala el riesgo, porque cada F describe un nivel distinto."],
[2,"Sobre las consecuencias de un factor de caída demasiado alto (3.3), un alumno sostiene: «**No** es cierto que la rotura de los equipos **no** se deba a la fuerza ejercida en el momento del impacto». ¿Qué interpretación **NO** contradice ni esa afirmación ni el temario?",["Un factor demasiado alto puede dar lugar a una brusca desaceleración y provocar lesiones graves en el accidentado, por la desaceleración en el frenado, y rotura o daños en los equipos, por la fuerza ejercida en el momento del impacto.","Un factor demasiado alto puede dar lugar a una brusca desaceleración y provocar lesiones graves en el accidentado, por la fuerza ejercida en el momento del impacto, y rotura o daños en los equipos, por la desaceleración en el frenado.","Un factor demasiado bajo puede dar lugar a una brusca desaceleración y provocar lesiones graves en el accidentado, por la desaceleración en el frenado, y rotura o daños en los equipos, por la fuerza ejercida en el momento del impacto.","Un factor demasiado alto puede dar lugar a una brusca aceleración en la caída libre y provocar lesiones graves en el accidentado, por esa aceleración previa al frenado, y rotura o daños en los equipos, por la fuerza ejercida en el momento del impacto."],"Doble negación: «no es cierto que no se deba» equivale a afirmar que la rotura de los equipos SÍ se debe a la fuerza ejercida en el impacto. 3.3: un factor demasiado ALTO puede causar una brusca desaceleración, que provoca lesiones graves (por la desaceleración en el frenado) y rotura o daños en los equipos (por la fuerza del impacto). Falla la que intercambia las causas («equipos, por la desaceleración»), la de «factor demasiado bajo» y la que atribuye las lesiones a una «brusca aceleración en la caída libre», cuando el temario habla de desaceleración brusca en el frenado."],
[3,"Según la clasificación por uso de 4.2 a 4.5, ¿qué agrupación de nudos es correcta?",["Anclaje y encordamiento: ballestrinque, mariposa y alondra. Deslizantes: dinámico y nudo de fuga. Unión: plano, pescador doble y ocho cosido. Bloqueantes: Machard.","Anclaje y encordamiento: mariposa y alondra. Deslizantes: dinámico, ballestrinque y nudo de fuga. Unión: plano, pescador doble y ocho cosido. Bloqueantes: Machard.","Anclaje y encordamiento: ballestrinque, mariposa, alondra y ocho cosido. Deslizantes: dinámico y nudo de fuga. Unión: plano y pescador doble. Bloqueantes: Machard.","Anclaje y encordamiento: ballestrinque, mariposa y alondra. Deslizantes: nudo dinámico. Unión: plano, pescador doble y ocho cosido. Bloqueantes: Machard y nudo de fuga."],"El temario clasifica los nudos por su uso: 4.2 anclaje y encordamiento (gaza simple, ocho, ocho de dos gazas, nueve, siete, ballestrinque, mariposa y alondra); 4.3 deslizantes (dinámico y su bloqueo o nudo de fuga); 4.4 unión (plano, pescador doble y ocho cosido); 4.5 bloqueantes (Machard). Falla la que pasa el «ballestrinque» a deslizantes (aunque deslice sobre 400 daN, es de anclaje), la que pasa el «ocho cosido» a anclaje y la que lleva el «nudo de fuga» a bloqueantes."],
[3,"Una cinta plana con una resistencia de 22 kN se une con nudo plano. Según el porcentaje de 4.4, ¿qué resistencia residual cabe esperar aproximadamente y qué precaución exige el nudo?",["Unos 14,1 kN, porque el nudo plano pierde un 36% de resistencia y conserva el 64%; además, debe revisarse con frecuencia, ya que con el uso desliza y se quedan cortas las puntas.","Unos 7,9 kN, porque el nudo plano conserva un 36% de resistencia y pierde el 64%; además, debe revisarse con frecuencia, ya que con el uso desliza y se quedan cortas las puntas.","Unos 13,2 kN, porque el nudo plano pierde un 40% de resistencia y conserva el 60%; además, debe revisarse con frecuencia, ya que con el uso desliza y se quedan cortas las puntas.","Unos 14,1 kN, porque el nudo plano pierde un 36% de resistencia y conserva el 64%; además, apenas requiere revisión, ya que con el uso se aprieta y no llega a deslizar."],"4.4: el nudo plano pierde un 36% de resistencia, así que conserva el 64%: 22 × 0,64 ≈ 14,1 kN. «7,9 kN» toma el 36% como resistencia conservada (22 × 0,36) y «13,2 kN» aplica el 40% de pérdida de la gaza simple (22 × 0,60). Además, el nudo plano ha de revisarse con frecuencia porque con el uso desliza y se quedan cortas las puntas, por lo que falla «apenas requiere revisión»."],
[3,"Según los porcentajes nominales de pérdida de resistencia de 4.2 y 4.4, ¿qué orden de mayor a menor resistencia residual es correcto para el ocho, el ocho de dos gazas, el ballestrinque, la gaza simple y el nudo plano?",["Ocho de dos gazas, ocho, nudo plano, gaza simple y ballestrinque.","Ocho de dos gazas, ocho, gaza simple, nudo plano y ballestrinque.","Ocho, ocho de dos gazas, nudo plano, gaza simple y ballestrinque.","Ocho de dos gazas, ocho, nudo plano, ballestrinque y gaza simple."],"Pérdidas según 4.2 y 4.4: ocho de dos gazas, en torno al 18% (conserva un 82%); ocho, del 20% al 30% (conserva del 70% al 80%); nudo plano, 36% (64%); gaza simple, en torno al 40% (60%); ballestrinque, del 45% al 65% (del 35% al 55%). Falla la que antepone la «gaza simple» al «nudo plano» (60% frente a 64%), la que pone el «ocho» por delante del ocho de dos gazas (como máximo 80% frente a 82%) y la que coloca el «ballestrinque» antes que la gaza simple (como máximo 55% frente a 60%)."],
