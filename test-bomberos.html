<!DOCTYPE html>
<html lang="es">
<head>

<title>Test Bomberos</title>
<style>
:root{--bg:#f5f3f0;--card:#fff;--ink:#1c1917;--mut:#6b645d;--line:#e6e0d9;--acc:#c2410c;--acc-ink:#fff;--acc-soft:#fff1e8;--ok:#15803d;--ok-bg:#e9f7ee;--ko:#b91c1c;--ko-bg:#fdecec;--bl:#8a5a00;--bl-bg:#fdf5e1;--on:#fff;--r:14px;--sh:0 1px 2px rgba(28,25,23,.05),0 6px 20px rgba(28,25,23,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#131110;--card:#1e1b19;--ink:#f2eee9;--mut:#a59d95;--line:#36312c;--acc:#f97316;--acc-ink:#1a0d04;--acc-soft:#2f1a0d;--ok:#4ade80;--ok-bg:#12301d;--ko:#f87171;--ko-bg:#3b1616;--bl:#facc15;--bl-bg:#33290b;--on:#0c0a09;--sh:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:1.55rem;line-height:1.2;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:1.12rem;margin:0 0 12px}
.sub{color:var(--mut);margin:0;font-size:.92rem}
.brand{display:flex;align-items:center;gap:14px;margin:14px 0 24px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--acc);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.big{display:block;width:100%;text-align:left;padding:18px;margin:0 0 12px;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--sh);transition:transform .08s,border-color .15s}
.big:active{transform:scale(.99)}
.big:hover{border-color:var(--acc)}
.big b{display:block;font-size:1.08rem;margin-bottom:2px}
.big span{color:var(--mut);font-size:.9rem}
.big.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.big.primary span{color:inherit;opacity:.88}
.topic{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin-bottom:10px}
.topic b{font-size:1rem}
.topic .n{flex:none;font-size:.78rem;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.set{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin:8px 0 0;cursor:pointer}
.set input{width:20px;height:20px;accent-color:var(--acc);margin:2px 0 0;flex:none}
.set small{display:block;color:var(--mut);font-size:.85rem}
.stat{font-size:.88rem;color:var(--mut);margin:14px 2px 0}
.foot{color:var(--mut);font-size:.8rem;margin:26px 2px 0;line-height:1.5}
.link{background:none;border:0;padding:10px 0;color:var(--acc);cursor:pointer;font-weight:600}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:.9rem;color:var(--mut)}
.bar .mid{font-weight:700;color:var(--ink)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.chip{display:inline-block;font-size:.76rem;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.qtext{font-size:1.07rem;line-height:1.55;margin:0 0 18px;font-weight:500}
.qtext strong{color:var(--acc);font-weight:800}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;min-height:54px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;line-height:1.45}
.opt .l{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:.88rem;background:var(--bg);border:1px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:var(--on);border-color:var(--ok)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.opt.ko .l{background:var(--ko);color:var(--on);border-color:var(--ko)}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border-left:4px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.ko{background:var(--ko-bg);border-color:var(--ko)}
.fb.bl{background:var(--bl-bg);border-color:var(--bl)}
.fb h3{margin:0 0 6px;font-size:1rem}
.fb.ok h3{color:var(--ok)}.fb.ko h3{color:var(--ko)}.fb.bl h3{color:var(--bl)}
.fb p{margin:0;font-size:.95rem}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1 1 140px;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;min-height:50px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent;color:var(--mut)}
.score{text-align:center;padding:26px 16px 22px}
.score .lbl{color:var(--mut);font-size:.9rem;font-weight:600}
.score .nota{font-size:3.6rem;font-weight:800;line-height:1.05;letter-spacing:-.03em;margin-top:4px}
.score .nota small{font-size:1.2rem;color:var(--mut);font-weight:600;letter-spacing:0}
.verdict{display:inline-block;margin-top:10px;padding:4px 14px;border-radius:999px;font-weight:800;font-size:.85rem;letter-spacing:.04em}
.verdict.pass{background:var(--ok-bg);color:var(--ok)}
.verdict.fail{background:var(--ko-bg);color:var(--ko)}
.score .det{color:var(--mut);font-size:.85rem;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kpi{padding:12px 6px;text-align:center}
.kpi b{display:block;font-size:1.45rem;line-height:1.2}
.kpi span{font-size:.78rem;color:var(--mut)}
.c-ok{color:var(--ok)}.c-ko{color:var(--ko)}.c-bl{color:var(--bl)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r{text-align:right;white-space:nowrap;padding-left:10px;color:var(--mut)}
.mini{height:6px;background:var(--line);border-radius:9px;overflow:hidden;width:64px;display:inline-block;vertical-align:middle;margin-left:8px}
.mini i{display:block;height:100%}
details.rev{margin-top:12px;padding:14px 16px}
details.rev summary{cursor:pointer;font-weight:700}
.rq{border-top:1px solid var(--line);padding:12px 0 4px;font-size:.92rem}
.rq p{margin:0 0 6px}
.rq .e{color:var(--mut)}
@media (max-width:380px){.qtext{font-size:1rem}.opt{padding:11px 12px}.score .nota{font-size:3rem}}
</style>
</head>

<section id="menu">

    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12.6 2.2c.5 3-1.3 4.6-2.6 6.3-1 1.3-1.6 2.5-1.2 4.1.2-1.3 1-2.3 2.1-2.9-.2 1.9.7 3.2 1.9 4.1 1.2.9 1.9 2 1.7 3.6 1.4-.9 2.2-2.4 2-4.2 1.3 1.3 1.9 3 1.6 4.9-.4 3-3.2 5.6-6.3 5.6-3.6 0-6.4-2.8-6.4-6.4 0-3 1.6-5.1 3.3-7.1 1.8-2.1 3.8-4.2 3.9-8z"/></svg></div>

</section>

<section id="temas" hidden>

<section id="quiz" hidden>

<script>
"use strict";
/* ===== TEMARIO: [nombre del tema, normativa / contenidos clave] ===== */
const T=[
["Constitución Española de 1978","Valores superiores, derechos fundamentales, estados excepcionales, fuentes, TC"],
["Protección Civil y Autoprotección","Ley 17/2015 del SNPC · RD 393/2007 Norma Básica de Autoprotección"],
["Prevención de Riesgos Laborales","Ley 31/1995 · RD 773/1997 · Reglamento (UE) 2016/425"],
["Teoría del fuego y fenómenos","Tetraedro, transmisión del calor, flashover, backdraft, BLEVE, humo"],
["Agentes extintores y extintores","Agua, espumas, CO2, polvos · extintores (RIPCI y CTE)"],
["Hidráulica aplicada","Presión, caudal, pérdidas de carga, bombas, cavitación, golpe de ariete"],
["Instalaciones de protección contra incendios","RD 513/2017 (RIPCI): BIE, columna seca, rociadores, detección"],
["CTE: seguridad en caso de incendio","DB-SI (SI 1 a SI 6) y DB-SUA 4 · sectores, evacuación, bomberos"],
["Mercancías peligrosas (ADR)","Clases, panel naranja, códigos de peligro, etiquetas, intervención"],
["Primeros auxilios y SVB","ERC 2021: RCP, DEA, OVACE, triaje START, quemaduras, Glasgow"],
["Protección respiratoria y EPI de intervención","ERA, autonomía, filtros EN 14387, normas EN de EPI, trajes químicos"],
["Riesgo eléctrico y vehículos","RD 614/2001, REBT, efectos de la corriente, vehículos eléctricos"]
];
/* ===== BANCO DE PREGUNTAS =====
   Formato: [tema, "enunciado", ["CORRECTA","incorrecta","incorrecta","incorrecta"], "explicación"]
   La primera opción es siempre la correcta en el código; la app las baraja al mostrarlas.
   **texto** se muestra resaltado. */
const Q=[
/* ---------- TEMA 1 · CONSTITUCIÓN ---------- */
[0,"Según el art. 1.1 de la Constitución, ¿cuál de los siguientes **NO** figura entre los valores superiores del ordenamiento jurídico?",["La seguridad jurídica","El pluralismo político","La igualdad","La justicia"],"Art. 1.1 CE: los valores superiores son cuatro: libertad, justicia, igualdad y pluralismo político. La seguridad jurídica es un principio que la Constitución «garantiza» en el art. 9.3, no un valor superior. Es una confusión clásica entre valores (art. 1.1) y principios (art. 9.3)."],
[0,"Una dotación accede a una vivienda cerrada donde se ha declarado un incendio con posibles víctimas atrapadas, sin consentimiento del titular, sin resolución judicial y sin flagrante delito. Señale la afirmación que **no** es incorrecta:",["La entrada es legítima: evitar daños inminentes y graves a personas y cosas en supuestos de catástrofe, calamidad u otros de extrema y urgente necesidad es causa legítima suficiente","La entrada exige obtener previamente autorización judicial por el procedimiento de urgencia, al no concurrir ninguno de los tres supuestos tasados del art. 18.2 CE","La entrada solo puede practicarla un agente de las Fuerzas y Cuerpos de Seguridad, únicos habilitados por la LO 4/2015; los bomberos deben esperar a su llegada","La entrada solo sería válida si estuviera declarado el estado de alarma, ya que solo éste permite limitar la inviolabilidad del domicilio sin intervención judicial"],"El art. 18.2 CE solo menciona consentimiento, resolución judicial y flagrante delito, pero la LO 4/2015 de protección de la seguridad ciudadana (art. 15.2) considera causa legítima suficiente para entrar en un domicilio la necesidad de evitar daños inminentes y graves a personas y cosas en casos de catástrofe, calamidad, ruina inminente u otros semejantes de extrema y urgente necesidad. Además ampara la actuación el estado de necesidad (art. 20.5 del Código Penal)."],
[0,"¿Qué precepto constitucional prevé expresamente que mediante ley se puedan regular los deberes de los ciudadanos en los casos de grave riesgo, catástrofe o calamidad pública?",["El artículo 30.4","El artículo 116.1","El artículo 149.1.29ª","El artículo 55.1"],"El art. 30.4 CE dice: «Mediante ley podrán regularse los deberes de los ciudadanos en los casos de grave riesgo, catástrofe o calamidad pública». Es la base constitucional del deber de colaboración que desarrolla la Ley 17/2015. El 116 regula los estados excepcionales, el 149.1.29ª la seguridad pública y el 55.1 la suspensión de derechos."],
[0,"Sobre el estado de alarma, señale la única afirmación que **no** contiene ningún error:",["Lo declara el Gobierno mediante decreto acordado en Consejo de Ministros por un plazo máximo de quince días, dando cuenta al Congreso, sin cuya autorización no podrá prorrogarse","Lo declara el Congreso de los Diputados por mayoría absoluta, a propuesta exclusiva del Gobierno, que fija su ámbito territorial, duración y condiciones","Lo declara el Gobierno mediante decreto acordado en Consejo de Ministros, previa autorización del Congreso, por un plazo no superior a treinta días prorrogable por otro igual","Lo declara el Gobierno mediante decreto acordado en Consejo de Ministros por un plazo máximo de quince días, dando cuenta al Senado, sin cuya autorización no podrá prorrogarse"],"Art. 116.2 CE. Hay que diferenciar: alarma (Gobierno, máximo 15 días, da cuenta al Congreso, que debe autorizar la prórroga); excepción (Gobierno con autorización previa del Congreso, máximo 30 días prorrogables por otros 30), y sitio (mayoría absoluta del Congreso a propuesta exclusiva del Gobierno). La trampa de la última opción está en el Senado."],
[0,"Conforme al art. 55.1 CE, ¿cuál de los siguientes derechos **no** podría suspenderse en ningún caso con la declaración del estado de excepción o de sitio?",["El derecho a la vida y a la integridad física (art. 15)","La inviolabilidad del domicilio (art. 18.2)","La libertad de circulación y residencia (art. 19)","El derecho de reunión (art. 21)"],"El art. 55.1 enumera los únicos derechos que se pueden suspender: arts. 17, 18.2 y 3, 19, 20.1 a) y d) y 5, 21, 28.2 y 37.2. El art. 15 no está en la lista. Además, el estado de alarma no permite suspender derechos, solo limitarlos."],
[0,"Respecto del encaje constitucional de la protección civil, señale la afirmación correcta:",["No se menciona expresamente en la CE; el Tribunal Constitucional la ha encuadrado en la «seguridad pública» (art. 149.1.29ª), sin excluir competencias autonómicas y locales","Es una competencia exclusiva del Estado enumerada expresamente en el art. 149.1 CE con la rúbrica «protección civil», lo que impide a las CCAA aprobar planes propios","Es una competencia que el art. 148.1 CE atribuye expresamente a las CCAA, de modo que al Estado solo le corresponde coordinar las emergencias de interés nacional","Está regulada en el art. 116 CE como parte del derecho de excepción, de modo que solo puede activarse mediante la declaración del estado de alarma"],"La expresión «protección civil» no aparece en el reparto competencial de la CE. La STC 123/1984 (y otras posteriores, como la 133/1990) la sitúan en la materia «seguridad pública» del art. 149.1.29ª, como una competencia concurrente en la que también intervienen las CCAA y las entidades locales."],
[0,"¿Cuál de las siguientes materias **no** está sometida al procedimiento agravado de reforma del art. 168 CE?",["El Capítulo III del Título I (principios rectores)","El Título Preliminar (arts. 1 a 9)","La Sección 1ª del Capítulo II del Título I (arts. 15 a 29)","El Título II, «De la Corona» (arts. 56 a 65)"],"El art. 168 exige el procedimiento agravado para la revisión total, el Título Preliminar, la Sección 1ª del Capítulo II del Título I (arts. 15 a 29) y el Título II. Este procedimiento requiere 2/3 de cada Cámara, disolución de las Cortes, ratificación por las nuevas Cámaras y referéndum obligatorio. Los principios rectores se reforman por el procedimiento ordinario del art. 167."],
[0,"De acuerdo con el art. 86.1 CE, ¿cuál de los siguientes **no** es un límite material de los decretos-leyes?",["Las materias reservadas a ley ordinaria","El régimen de las Comunidades Autónomas","El Derecho electoral general","El ordenamiento de las instituciones básicas del Estado"],"Los decretos-leyes no pueden afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades del Título I, al régimen de las CCAA ni al Derecho electoral general. Las materias de ley ordinaria no son un límite. El Congreso debe convalidar o derogar el decreto-ley en 30 días desde su promulgación."],
[0,"Sobre la iniciativa legislativa popular (art. 87.3 CE), es **falso** que:",["Permite promover una reforma constitucional si se reúnen al menos 500.000 firmas","Exige la presentación de no menos de 500.000 firmas acreditadas","No procede en materias propias de ley orgánica, tributarias o de carácter internacional","No procede en lo relativo a la prerrogativa de gracia, según el propio art. 87.3 CE"],"El art. 166 CE remite la iniciativa de reforma constitucional solo a los apartados 1 y 2 del art. 87 (Gobierno, Congreso, Senado y Asambleas de las CCAA). Queda fuera la iniciativa popular del 87.3. Las otras tres afirmaciones son ciertas: la ILP tampoco procede en materias tributarias ni de carácter internacional."],
[0,"¿Cuál de los siguientes **no** es un principio de actuación de la Administración Pública que enumere el art. 103.1 CE?",["Jerarquía normativa","Desconcentración","Coordinación","Eficacia"],"El art. 103.1 enumera eficacia, jerarquía, descentralización, desconcentración y coordinación, con sometimiento pleno a la ley y al Derecho. La «jerarquía» del 103.1 es la orgánica, entre órganos administrativos. La «jerarquía normativa» es un principio del art. 9.3 referido a las normas. La trampa está en el adjetivo."],
[0,"El Tribunal Constitucional tiene 12 miembros nombrados por el Rey. Señale la distribución de propuestas que **no** es errónea:",["Cuatro del Congreso y cuatro del Senado (por mayoría de 3/5), dos del Gobierno y dos del Consejo General del Poder Judicial","Cuatro del Congreso y cuatro del Senado (por mayoría de 3/5), dos del Gobierno y dos de la Sala de Gobierno del Tribunal Supremo","Cuatro del Congreso y cuatro del Senado (por mayoría absoluta de cada Cámara), dos del Gobierno y dos del Consejo General del Poder Judicial","Seis a propuesta de las Cortes Generales en sesión conjunta por mayoría de 3/5, tres del Gobierno y tres del CGPJ"],"Art. 159 CE: 4 a propuesta del Congreso y 4 del Senado, en ambos casos por mayoría de tres quintos; 2 del Gobierno y 2 del CGPJ. Se nombran por 9 años y el Tribunal se renueva por terceras partes cada 3 años."],
[0,"Respecto de la detención preventiva, el art. 17.2 CE establece que:",["No durará más del tiempo estrictamente necesario para las averiguaciones y, como máximo, 72 horas, tras las cuales el detenido quedará libre o a disposición judicial","Durará 72 horas, plazo ordinario fijado por la Constitución, transcurrido el cual el detenido será puesto en libertad o a disposición judicial","No podrá exceder de 48 horas, prorrogables por otras 24 mediante resolución judicial motivada, tras las cuales quedará a disposición judicial","No podrá exceder de 24 horas con carácter general, ampliables únicamente durante la vigencia del estado de excepción o de sitio"],"El límite de 72 horas es un máximo absoluto, no un plazo ordinario. El límite principal es el «tiempo estrictamente necesario». En el estado de excepción el art. 55.1 permite suspender el art. 17 (salvo el 17.3), y la LO 4/1981 amplía ese plazo."],
[0,"Según el tenor **literal** del art. 15 CE, señale la afirmación que **no** es incorrecta:",["Queda abolida la pena de muerte, salvo lo que puedan disponer las leyes penales militares para tiempos de guerra","Queda abolida la pena de muerte sin ninguna excepción en el texto constitucional","Queda abolida la pena de muerte, salvo durante la vigencia del estado de sitio","Queda abolida la pena de muerte, salvo lo que dispongan las leyes orgánicas para delitos de terrorismo"],"El texto constitucional mantiene la salvedad de las leyes penales militares en tiempo de guerra. Otra cosa es que la LO 11/1995 la suprimiera del Código Penal Militar, de modo que hoy no existe en el ordenamiento. La pregunta se refiere al tenor literal de la CE."],
[0,"¿Cuál de los siguientes derechos **no** puede protegerse mediante recurso de amparo ante el Tribunal Constitucional?",["El derecho a la protección de la salud (art. 43)","El derecho a la igualdad (art. 14)","La objeción de conciencia (art. 30.2)","El derecho de huelga (art. 28.2)"],"Art. 53.2 CE: el amparo protege el art. 14, la Sección 1ª del Capítulo II (arts. 15-29) y la objeción de conciencia del art. 30. El art. 43 es un principio rector (Capítulo III): según el art. 53.3 informa la actuación de los poderes públicos y solo puede alegarse ante la jurisdicción ordinaria conforme a las leyes que lo desarrollen."],
/* ---------- TEMA 2 · PROTECCIÓN CIVIL ---------- */
[1,"Según la Ley 17/2015, del Sistema Nacional de Protección Civil, la protección civil se configura como:",["Un instrumento de la política de seguridad pública: el servicio público que protege a personas y bienes ante emergencias y catástrofes naturales o derivadas de la acción humana, sea accidental o intencionada","Un servicio público de titularidad exclusivamente estatal, dirigido en todo caso por el Ministerio del Interior a través de la Dirección General de Protección Civil y Emergencias","Un instrumento de la política de defensa nacional, orientado a proteger a la población civil frente a los efectos de un conflicto armado y de las catástrofes naturales","Un servicio público frente a emergencias naturales o accidentales; las intencionadas quedan excluidas porque corresponden a la seguridad ciudadana"],"Art. 1 de la Ley 17/2015. Hay dos trampas habituales: la protección civil se integra en la seguridad pública y no en la defensa, y abarca también las emergencias de origen humano intencionado. Es un sistema en el que participan todas las Administraciones, no una competencia solo estatal."],
[1,"Según las definiciones de la Ley 17/2015, «la posibilidad de que una amenaza llegue a afectar a colectivos de personas o a bienes» es la definición de:",["Riesgo","Peligro","Vulnerabilidad","Emergencia de protección civil"],"Riesgo: posibilidad de que una amenaza llegue a afectar a colectivos de personas o a bienes. Peligro: potencial de ocasionar daño. Amenaza: situación en la que personas y bienes están expuestos a un peligro inminente o latente. Vulnerabilidad: características de una comunidad, sistema o bien que los hacen susceptibles a los efectos dañinos de una amenaza."],
[1,"¿A quién corresponde declarar la emergencia de interés nacional?",["Al Ministro del Interior, por propia iniciativa o a instancia de las Comunidades Autónomas o de los Delegados del Gobierno","Al Consejo de Ministros, a propuesta del Ministro del Interior, por iniciativa propia o a solicitud de las Comunidades Autónomas afectadas","Al Presidente del Gobierno, previa autorización del Congreso de los Diputados y oído el Consejo de Seguridad Nacional","Al Consejo Nacional de Protección Civil, a propuesta de la comunidad autónoma afectada o del Delegado del Gobierno"],"La Ley 17/2015 atribuye la declaración al Ministro del Interior, por iniciativa propia o a instancia de las CCAA o de los Delegados del Gobierno. No hay que confundirla con la declaración de «zona afectada gravemente por una emergencia de protección civil», que acuerda el Consejo de Ministros."],
[1,"¿Cuál de los siguientes **no** es uno de los supuestos de emergencia de interés nacional de la Ley 17/2015?",["La que afecta a una sola comunidad autónoma y solo requiere aportar medios estatales a petición de ésta","La que requiere aplicar la LO 4/1981, de los estados de alarma, excepción y sitio","La que exige coordinar Administraciones diversas porque afecta a varias CCAA y requiere aportar recursos a nivel supraautonómico","La que, por sus dimensiones efectivas o previsibles, requiere una dirección de carácter nacional"],"Los tres supuestos legales son: aplicación de la LO 4/1981, necesidad de coordinación supraautonómica y necesidad de dirección nacional. Que el Estado aporte medios a una comunidad autónoma que los pide no convierte por sí solo la emergencia en de interés nacional: la dirección sigue siendo autonómica."],
[1,"La declaración de «zona afectada gravemente por una emergencia de protección civil» la efectúa:",["El Consejo de Ministros, mediante acuerdo, a propuesta de los ministros competentes en Hacienda e Interior y, en su caso, de los demás afectados","El Ministro del Interior mediante orden ministerial, a solicitud de la comunidad autónoma afectada y previo informe del Consejo Nacional de Protección Civil","El Gobierno mediante real decreto, una vez declarado el estado de alarma en el territorio afectado y a propuesta del Ministro del Interior","El Delegado del Gobierno en la comunidad autónoma mediante resolución, a propuesta de los Alcaldes de los municipios afectados"],"Esta figura sustituye a la antigua «zona catastrófica». Se declara por acuerdo del Consejo de Ministros y permite adoptar medidas de ayuda (subvenciones, beneficios fiscales, laborales, etc.). No requiere ningún estado excepcional."],
[1,"¿Cuál de los siguientes **no** es un tipo de plan de protección civil de la Ley 17/2015?",["Plan sectorial de seguridad ciudadana","Plan Estatal General","Plan Territorial, autonómico o local","Plan de Autoprotección"],"La ley prevé el Plan Estatal General, los Planes Territoriales (autonómicos o locales), los Planes Especiales (por riesgos concretos: inundaciones, sísmico, incendios forestales, químico, nuclear, etc.) y los Planes de Autoprotección. Los «planes sectoriales de seguridad ciudadana» no son una categoría de planificación de protección civil."],
[1,"¿Cómo se aprueba la Norma Básica de Protección Civil?",["Por el Gobierno, mediante real decreto, a propuesta del Ministro del Interior y previo informe del Consejo Nacional de Protección Civil","Por ley orgánica de las Cortes Generales, porque afecta al desarrollo de derechos fundamentales y libertades públicas","Por orden del Ministro del Interior, previo acuerdo de la Conferencia Sectorial y dictamen del Consejo de Estado","Por resolución vinculante del Consejo Nacional de Protección Civil, a propuesta de la Dirección General de Protección Civil y Emergencias"],"La Ley 17/2015 prevé su aprobación por real decreto del Gobierno. La vigente fue aprobada por el RD 524/2023, de 20 de junio. El Consejo Nacional de Protección Civil es un órgano de cooperación entre la AGE y las CCAA (y Ceuta y Melilla), no un órgano normativo."],
[1,"En el régimen sancionador de la Ley 17/2015, las infracciones **muy graves** se sancionan con multa de:",["30.001 a 600.000 euros","1.501 a 30.000 euros","Hasta 1.500 euros","60.001 a 1.000.000 de euros"],"Escala de la Ley 17/2015: muy graves, de 30.001 a 600.000 €; graves, de 1.501 a 30.000 €; leves, hasta 1.500 €. Los distractores reproducen las cuantías de los otros tramos."],
[1,"Según la Norma Básica de Autoprotección (RD 393/2007), el Plan de Autoprotección:",["Tiene vigencia indeterminada, debe mantenerse actualizado y se revisa con una periodicidad no superior a tres años","Tiene una vigencia de cinco años, tras la cual debe redactarse de nuevo y registrarse ante la autoridad competente","Debe revisarse cada año, aprovechando la evaluación del simulacro obligatorio","Tiene vigencia indeterminada y solo se revisa cuando hay modificaciones sustanciales de la actividad o de sus instalaciones"],"La NBA establece vigencia indeterminada, actualización permanente y revisión al menos cada tres años. No hay que confundirlo con los simulacros, que son como mínimo anuales."],
[1,"Respecto de los simulacros en el marco de la Norma Básica de Autoprotección, señale la afirmación que **no** es incorrecta:",["Se realizan con la periodicidad mínima que fije el propio plan y, en todo caso, al menos una vez al año, evaluando sus resultados","Se realizan al menos una vez cada tres años, coincidiendo con la revisión obligatoria del plan y evaluando sus resultados","Solo son obligatorios en actividades con ocupación igual o superior a 2.000 personas, con periodicidad mínima anual","Se realizan al menos una vez al año, aunque pueden sustituirse por sesiones formativas teóricas en actividades de riesgo bajo"],"La implantación del plan incluye formación, información y simulacros con periodicidad mínima anual y evaluación de resultados. No pueden sustituirse por formación teórica y son obligatorios en toda actividad incluida en el ámbito de la NBA."],
[1,"El contenido mínimo del Plan de Autoprotección (Anexo II de la NBA) se estructura en:",["Nueve capítulos, entre ellos el plan de actuación ante emergencias y la integración del plan en otros de ámbito superior","Cuatro documentos: evaluación del riesgo, medios de protección, plan de emergencia e implantación","Seis capítulos, sin el programa de mantenimiento de instalaciones, que es un documento aparte","Siete capítulos y un anexo cartográfico obligatorio"],"Los 9 capítulos son: 1 identificación de titulares y emplazamiento; 2 descripción de la actividad y del medio físico; 3 inventario, análisis y evaluación de riesgos; 4 medidas y medios de autoprotección; 5 mantenimiento de instalaciones; 6 plan de actuación ante emergencias; 7 integración en planes de ámbito superior; 8 implantación; 9 mantenimiento de la eficacia y actualización. Los «cuatro documentos» corresponden al antiguo Manual de Autoprotección de 1984."],
[1,"Según el Anexo I de la NBA, aplicando **solo** el criterio del número de camas, un establecimiento sanitario con hospitalización está obligado a tener Plan de Autoprotección si dispone de:",["200 camas o más","100 camas o más","500 camas o más","Cualquier número de camas"],"El Anexo I incluye los establecimientos sanitarios con hospitalización o tratamiento intensivo o quirúrgico con 200 camas o más. Otros criterios (altura de evacuación de 28 m o más, ocupación de 2.000 personas o más, etc.) pueden hacerlo obligatorio por otra vía, pero el enunciado pregunta solo por el número de camas."],
[1,"En la organización clásica de un plan de autoprotección, el equipo que acude a un conato en su zona y lo ataca con extintores portátiles es:",["El Equipo de Primera Intervención (EPI)","El Equipo de Segunda Intervención (ESI)","El Equipo de Alarma y Evacuación (EAE)","El Equipo de Primeros Auxilios (EPA)"],"El EPI actúa sobre el conato con medios portátiles en su zona. El ESI interviene cuando la emergencia supera al EPI, con medios de mayor capacidad como las BIE. El EAE asegura la alarma y la evacuación ordenada, y el EPA presta los primeros auxilios. Todos dependen del Jefe de Intervención y del Jefe de Emergencia."],
[1,"Según la Ley 17/2015, la emergencia sin afectación colectiva (por ejemplo, el incendio de una vivienda sin riesgo para terceros) se denomina:",["Emergencia ordinaria","Emergencia de protección civil de nivel 0","Catástrofe de ámbito local","Situación de alerta"],"La ley define la emergencia de protección civil como una situación de riesgo colectivo que exige una gestión rápida de los poderes públicos, y la contrapone a la «emergencia ordinaria», sin afectación colectiva. La catástrofe es la situación que altera gravemente el funcionamiento de una comunidad y desborda sus medios."],
/* ---------- TEMA 3 · PRL ---------- */
[2,"Sobre la aplicación de la Ley 31/1995 a los servicios de extinción de incendios, señale la afirmación que **no** es incorrecta:",["No se aplica a las actividades cuyas particularidades lo impidan en los servicios operativos de protección civil ante grave riesgo, catástrofe o calamidad pública, aunque inspira su normativa","No se aplica a los bomberos, porque todos los servicios de protección civil están excluidos con carácter general por el art. 3.2, que remite a su normativa específica","Se aplica íntegramente y sin excepción a los bomberos, porque no son Fuerzas y Cuerpos de Seguridad y el art. 3.2 solo excluye a policía, resguardo aduanero y Fuerzas Armadas","Solo se aplica a los bomberos durante la formación, las prácticas y el mantenimiento, quedando excluidas en todo caso las intervenciones de emergencia"],"Art. 3.2 LPRL: la exclusión no afecta a todo el colectivo, sino solo a las actividades concretas cuyas particularidades impidan aplicar la ley (servicios operativos de protección civil en grave riesgo, catástrofe y calamidad pública). Fuera de esos supuestos la ley se aplica plenamente, y en ellos sirve de inspiración a la normativa específica."],
[2,"La Ley 31/1995 define el «riesgo laboral grave e inminente» como:",["El que resulte probable racionalmente que se materialice en un futuro inmediato y pueda suponer un daño grave para la salud de los trabajadores","El que resulte seguro que se materialice de forma inmediata, cualquiera que sea la gravedad del daño que pueda ocasionar a los trabajadores","Aquel que, aun siendo racionalmente improbable, pueda llegar a suponer un daño grave o mortal para la salud de los trabajadores","El que haya sido calificado como tal por la Inspección de Trabajo o por el servicio de prevención tras la evaluación de riesgos"],"Art. 4.4 LPRL. Se exigen a la vez una probabilidad racional de materialización en un futuro inmediato y un daño grave. En exposiciones a agentes que pueden causar daños graves a largo plazo, se considera grave e inminente cuando sea probable racionalmente que se produzca una exposición que pueda causar esos daños, aunque no se manifiesten de inmediato."],
[2,"¿Cuál de los siguientes **no** es un principio general de la acción preventiva del art. 15 de la LPRL?",["Anteponer la protección individual a la colectiva","Combatir los riesgos en su origen","Tener en cuenta la evolución de la técnica","Sustituir lo peligroso por lo que entrañe poco o ningún peligro"],"El art. 15.1 h) obliga a «adoptar medidas que antepongan la protección colectiva a la individual», sin excepciones por motivo económico. Los demás principios son: evitar los riesgos, evaluar los que no se puedan evitar, combatirlos en su origen, adaptar el trabajo a la persona, tener en cuenta la evolución de la técnica, sustituir lo peligroso, planificar la prevención y dar las debidas instrucciones."],
[2,"Cuando los representantes legales de los trabajadores acuerdan paralizar la actividad por riesgo grave e inminente, la autoridad laboral anulará o ratificará la paralización en el plazo de:",["24 horas","48 horas","72 horas","5 días hábiles"],"Art. 21.3 LPRL: el acuerdo se adopta por mayoría de los representantes (o de los delegados de prevención si no puede reunirse el órgano con la urgencia necesaria), se comunica de inmediato a la empresa y a la autoridad laboral, y ésta lo anula o ratifica en 24 horas."],
[2,"Un servicio de bomberos tiene 420 trabajadores. ¿Cuántos Delegados de Prevención le corresponden según la escala del art. 35 LPRL?",["3","2","4","5"],"Escala del art. 35.2: de 50 a 100 trabajadores, 2; de 101 a 500, 3; de 501 a 1.000, 4; de 1.001 a 2.000, 5; de 2.001 a 3.000, 6; de 3.001 a 4.000, 7; de 4.001 en adelante, 8. En empresas de hasta 30 trabajadores el Delegado de Prevención es el Delegado de Personal; de 31 a 49, uno elegido por y entre los Delegados de Personal."],
[2,"Sobre el Comité de Seguridad y Salud, es **falso** que:",["Se reúna mensualmente y siempre que lo solicite alguna de las representaciones","Sea un órgano paritario y colegiado de participación","Se constituya en empresas o centros de trabajo con 50 o más trabajadores","En sus reuniones participen, con voz pero sin voto, los delegados sindicales y los responsables técnicos de prevención no incluidos en su composición"],"Art. 38 LPRL: el Comité se reúne trimestralmente, y siempre que lo solicite alguna de las representaciones. Las demás afirmaciones son literales de la ley."],
[2,"Según el art. 17.2 de la LPRL, los equipos de protección individual deben utilizarse:",["Cuando los riesgos no puedan evitarse o limitarse suficientemente con medios de protección colectiva o con medidas o procedimientos de organización del trabajo","De forma preferente a la protección colectiva, por ser la medida de eficacia más inmediata y la única que controla el propio trabajador","Solo cuando el trabajador o sus representantes lo soliciten expresamente, previa consulta al Comité de Seguridad y Salud","Siempre que exista cualquier riesgo residual, sean cuales sean las medidas técnicas y organizativas adoptadas por el empresario"],"El EPI es subsidiario: es la última barrera, después de eliminar el riesgo, de la protección colectiva y de las medidas organizativas. Esto es coherente con el principio del art. 15.1 h)."],
[2,"A efectos del RD 773/1997, ¿cuál de los siguientes **no** queda excluido del concepto de equipo de protección individual?",["Los protectores auditivos de un operario expuesto a ruido","Los equipos propios de los servicios de socorro y salvamento","El material de deporte usado en la preparación física","Los aparatos portátiles para detectar y señalizar riesgos"],"El art. 2.2 del RD 773/1997 excluye del concepto de EPI, entre otros, la ropa de trabajo corriente y los uniformes no destinados específicamente a proteger, los equipos de los servicios de socorro y salvamento, los EPI de militares, policías y servicios de mantenimiento del orden, el material de deporte, el de autodefensa y los detectores portátiles. La doble negación pide identificar lo que sí es un EPI."],
[2,"Respecto de la formación preventiva del art. 19 LPRL, señale la opción que **no** es incorrecta:",["Se imparte, si es posible, dentro de la jornada o, si no, descontando de ella el tiempo invertido, y su coste nunca recae en los trabajadores","Se imparte fuera de la jornada para no afectar al servicio, y se compensa económicamente o con descanso equivalente según convenio","Se imparte dentro de la jornada, pero su coste puede repercutirse en parte al trabajador cuando la formación sea voluntaria","Solo es obligatoria en el momento de la contratación, sin perjuicio de que el convenio pueda prever reciclajes periódicos"],"La formación ha de ser teórica y práctica, suficiente y adecuada. Se da en la contratación y también cuando cambian las funciones o se introducen nuevas tecnologías o equipos, y se repite periódicamente si es necesario. Puede impartirla la empresa con medios propios o concertarla con servicios ajenos, pero su coste nunca recae en el trabajador."],
[2,"Según el Reglamento (UE) 2016/425, un EPI que protege frente a ambientes de alta temperatura con efectos comparables a una temperatura del aire de al menos 100 °C pertenece a la categoría:",["III","I","II","IV, la categoría específica para equipos de bomberos"],"La categoría III agrupa los riesgos que pueden causar la muerte o daños irreversibles: sustancias peligrosas, atmósferas con falta de oxígeno, agentes biológicos, radiaciones ionizantes, calor de al menos 100 °C, frío de -50 °C o menos, caídas de altura, descargas eléctricas, ahogamiento, etc. No existe la categoría IV."],
[2,"Para calificar la gravedad de un riesgo laboral, la LPRL establece que deben valorarse conjuntamente:",["La probabilidad de que se produzca el daño y su severidad","La exposición del trabajador y el coste de las medidas preventivas","La frecuencia de accidentes previos y la duración de la exposición","La severidad del daño y el número de trabajadores expuestos"],"Art. 4.2 LPRL: riesgo laboral es la posibilidad de que un trabajador sufra un daño derivado del trabajo, y su gravedad se califica valorando conjuntamente la probabilidad y la severidad del daño. En esta idea se basan todos los métodos de evaluación de riesgos."],
[2,"El incumplimiento de las obligaciones preventivas por un bombero funcionario se considera:",["Falta, en su caso, según la normativa de régimen disciplinario de los funcionarios públicos","Infracción administrativa muy grave sancionada por la Inspección de Trabajo","Incumplimiento laboral del art. 58.1 del Estatuto de los Trabajadores, en todo caso","Delito del art. 316 del Código Penal"],"Art. 29.3 LPRL: para el personal laboral es incumplimiento laboral (art. 58.1 ET); para los funcionarios, falta según su régimen disciplinario. El art. 316 CP castiga a quien, estando legalmente obligado, no facilita los medios necesarios para trabajar con seguridad, es decir, al obligado a la protección y no al trabajador."],
[2,"Sobre la vigilancia de la salud del art. 22 LPRL, señale la afirmación correcta:",["Es voluntaria como regla, salvo excepciones tasadas, como que sea imprescindible para evaluar los efectos del trabajo o comprobar si la salud del trabajador es un peligro para él o para otros","Es obligatoria en todo caso para los colectivos de riesgo, como los bomberos, y sus resultados pueden comunicarse sin restricciones al empresario","Es voluntaria sin excepción alguna, porque afecta a la intimidad y a la dignidad del trabajador, que puede negarse siempre y sin consecuencias","Es voluntaria, pero sus resultados pueden comunicarse al empresario de forma nominativa para decidir sobre ascensos y destinos"],"La regla es la voluntariedad, con excepciones tasadas. Los datos son confidenciales: el empresario solo recibe las conclusiones sobre la aptitud del trabajador para el puesto, y no pueden usarse con fines discriminatorios ni en perjuicio del trabajador."],
/* ---------- TEMA 4 · TEORÍA DEL FUEGO ---------- */
[3,"Desde el modelo del tetraedro del fuego, ¿qué mecanismo de extinción actúa **sin** eliminar combustible, **sin** reducir el comburente y **sin** enfriar de forma significativa?",["La inhibición de la reacción en cadena","La sofocación con CO2","El enfriamiento con agua pulverizada","La eliminación del combustible cerrando una válvula"],"Cada mecanismo actúa sobre una cara del tetraedro: la eliminación sobre el combustible, la sofocación sobre el comburente, el enfriamiento sobre la energía y la inhibición sobre la reacción en cadena. La inhibición captura los radicales libres (H·, OH·) que mantienen la combustión. Es el mecanismo principal de los polvos químicos."],
[3,"La temperatura mínima a la que un líquido desprende vapores suficientes para formar con el aire una mezcla que se inflama al acercar una llama, **sin** que la combustión se mantenga al retirarla, es:",["El punto de inflamación (flash point)","El punto de combustión (fire point)","La temperatura de autoignición","El límite inferior de inflamabilidad"],"En el punto de inflamación la llama aparece y se apaga al retirar la fuente de ignición. En el punto de combustión, unos grados más alto, la combustión se mantiene. La temperatura de autoignición no requiere llama. El límite inferior de inflamabilidad es una concentración en % de volumen, no una temperatura."],
[3,"¿Cuál de los siguientes gases tiene el rango de inflamabilidad en aire más amplio?",["Acetileno","Hidrógeno","Metano","Propano"],"Valores aproximados: acetileno, del 2,5 % hasta el 80 % o más (puede descomponerse incluso sin aire); hidrógeno, del 4 % al 75 %; metano, del 5 % al 15 %; propano, del 2,1 % al 9,5 %. Cuanto más amplio es el rango, mayor es la peligrosidad de la mezcla."],
[3,"Según la norma UNE-EN 2 de clases de fuego, señale la afirmación que **no** es incorrecta:",["Los fuegos de aceites y grasas de cocina son la clase F, y no hay una clase específica para los fuegos eléctricos","Los fuegos de origen eléctrico son la clase E, y los de aceites y grasas de cocina se incluyen en la clase B","Los fuegos de gases son la clase B, junto con los de líquidos, y la clase C se reserva para los aceites de cocina","Los fuegos de metales son la clase C, y los de aceites y grasas de cocina la clase D"],"UNE-EN 2: A sólidos (con brasas), B líquidos o sólidos licuables, C gases, D metales y F aceites y grasas de cocina. La «clase E» no existe en la norma europea: el riesgo eléctrico es una circunstancia del fuego, no una clase. Por eso los extintores llevan la indicación de uso sobre tensión eléctrica aparte."],
[3,"En la transmisión de calor por radiación, señale la afirmación correcta:",["No necesita medio material, y la energía emitida es proporcional a la cuarta potencia de la temperatura absoluta","Necesita un fluido en movimiento que transporte el calor, y es proporcional a la temperatura expresada en °C","Es el mecanismo predominante a través de un muro macizo de hormigón, y depende de su conductividad","No necesita medio material, y su intensidad se reduce a la mitad al duplicar la distancia a una fuente puntual"],"Según la ley de Stefan-Boltzmann, la emisión es proporcional a T⁴ (en kelvin). Al duplicar la distancia a una fuente puntual la intensidad cae a la cuarta parte (ley del inverso del cuadrado), no a la mitad. A través de un sólido el calor se transmite por conducción; la convección es propia de los fluidos."],
[3,"Un local cerrado presenta humo denso amarillento-grisáceo que sale a pulsos por las rendijas, cristales ennegrecidos y aceitosos, poca llama visible y aire que es aspirado hacia dentro. Si se abre la puerta bruscamente, ¿qué fenómeno es **más** probable?",["Backdraft (explosión de humo)","Flashover por radiación de la capa de humos en un incendio bien ventilado","Boilover","BLEVE"],"Son los signos clásicos de un incendio limitado por la ventilación, con acumulación de gases de pirólisis calientes. La entrada brusca de aire provoca una deflagración. La técnica correcta es no ventilar sin control, enfriar la capa de gases y valorar la ventilación vertical o la apertura controlada."],
[3,"Sobre el flashover (combustión súbita generalizada), señale la afirmación que **no** es incorrecta:",["Es un fenómeno de transición, sobre todo térmico, en el que casi todas las superficies combustibles del recinto se inflaman a la vez (capa de humos a unos 500-600 °C)","Es una explosión de humo que solo se produce al introducir aire en un recinto infraventilado, por lo que nunca puede darse en un incendio bien ventilado","Se produce en la fase de decaimiento, cuando el combustible ya se ha consumido y los gases sin quemar se acumulan en el techo","Solo es posible en incendios de clase B, por la rápida liberación de vapores inflamables desde la superficie del líquido"],"El flashover marca el paso de la fase de crecimiento a la de pleno desarrollo. Lo causa sobre todo la radiación de la capa de gases calientes, del orden de 20 kW/m² a nivel del suelo. El backdraft, en cambio, depende de la entrada súbita de aire en un recinto infraventilado."],
[3,"Sobre la BLEVE, ¿cuál de las siguientes afirmaciones es **falsa**?",["Exige necesariamente que el producto almacenado sea inflamable","Se produce al romperse un recipiente que contiene un líquido a una temperatura superior a su punto de ebullición a presión atmosférica","Si el producto es inflamable, suele ir acompañada de una bola de fuego","Refrigerar el recipiente, sobre todo la zona de fase vapor, es una medida clave para prevenirla"],"BLEVE significa «Boiling Liquid Expanding Vapour Explosion»: la vaporización súbita de un líquido sobrecalentado al romperse el recipiente. Es un fenómeno físico que puede ocurrir con agua, como en las calderas. Si el producto es inflamable se añade la bola de fuego. La pared en contacto con la fase vapor no se refrigera con el líquido y es la que falla primero."],
[3,"La ebullición desbordante de un tanque de crudo en la que una onda de calor desciende hasta el agua del fondo y la vaporiza de golpe, proyectando combustible en llamas, se denomina:",["Boilover","Slopover","Frothover","BLEVE"],"El boilover es propio de hidrocarburos con amplio rango de destilación, como el crudo, que forman una onda de calor descendente. El slopover es un desbordamiento menor que se produce al aplicar agua o espuma sobre la superficie del líquido caliente. El frothover es la formación de espuma al entrar en contacto el agua con el producto caliente, sin incendio."],
[3,"Sobre el monóxido de carbono que se genera en los incendios, señale la afirmación que **no** es errónea:",["Su afinidad por la hemoglobina es unas 200-250 veces mayor que la del oxígeno, y la pulsioximetría convencional puede dar saturaciones falsamente normales","Es mucho más denso que el aire (densidad relativa cercana a 1,5), por lo que siempre se mide a ras de suelo","Es un gas irritante y de olor característico, que alerta pronto a los ocupantes, aunque la pulsioximetría lo detecta mal","Lo retienen eficazmente los filtros tipo A de las máscaras, por lo que el ERA no es imprescindible en el desescombro"],"El CO es incoloro, inodoro y no irritante, y su densidad es casi igual a la del aire (0,97). Forma carboxihemoglobina, que el pulsioxímetro no distingue de la oxihemoglobina. Los filtros convencionales (A, B, E, K) no lo retienen, así que en incendios es imprescindible el ERA."],
[3,"El cianuro de hidrógeno (HCN) presente en el humo de los incendios procede principalmente de la combustión de:",["Materiales nitrogenados: poliuretano, lana, seda o poliamidas (nailon)","Materiales celulósicos puros, como madera, papel y algodón","Metales ligeros, como magnesio, aluminio y titanio","Hidrocarburos alifáticos, como el propano o el butano"],"Para formar HCN el material debe contener nitrógeno. El HCN bloquea la citocromo-oxidasa y causa asfixia celular. Su acción se suma a la del CO, por lo que es una causa relevante de muerte en incendios de viviendas con espumas y textiles sintéticos."],
[3,"En caso de fuga, ¿cuál de los siguientes gases tiende a acumularse en zonas bajas, sótanos y alcantarillas?",["Propano","Metano (gas natural)","Hidrógeno","Amoníaco"],"Densidad relativa al aire: propano, unos 1,5 (más pesado que el aire); butano, unos 2; metano, unos 0,55; hidrógeno, unos 0,07; amoníaco, unos 0,6. Los gases licuados del petróleo se acumulan en zonas bajas y crean atmósferas explosivas persistentes."],
[3,"La descomposición química de un material sólido por el calor, que libera gases combustibles **sin** que intervenga necesariamente el oxígeno, se denomina:",["Pirólisis","Oxidación lenta","Sublimación","Autoignición"],"La mayoría de los sólidos no arden como tales: el calor los piroliza y lo que arde son los gases que desprenden. La sublimación es un cambio de estado físico, no una descomposición química. La autoignición es una ignición sin llama piloto."],
[3,"La diferencia esencial entre deflagración y detonación es que:",["En la deflagración el frente de reacción avanza a velocidad subsónica y en la detonación a velocidad supersónica, con una onda de choque","La deflagración solo afecta a gases y la detonación solo a explosivos sólidos, sin que una mezcla pueda pasar de un régimen a otro","En la deflagración no se produce aumento de presión, mientras que en la detonación sí aparece una onda de sobrepresión","La detonación es siempre menos destructiva porque su frente de reacción, aunque más rápido, dura menos tiempo"],"Ambas son explosiones; lo que las distingue es la velocidad del frente de reacción respecto a la del sonido en el medio. La deflagración también produce sobrepresión, menor que la de la detonación. Las mezclas de gases pueden deflagrar o detonar según su confinamiento y concentración."],
/* ---------- TEMA 5 · AGENTES EXTINTORES ---------- */
[4,"La gran capacidad del agua para extinguir por enfriamiento se debe principalmente a:",["Su elevado calor latente de vaporización (unos 2.257 kJ/kg) y su alto calor específico","Su baja tensión superficial, que le permite penetrar en combustibles porosos","Su capacidad para inhibir químicamente la reacción en cadena","Su baja densidad, que le permite flotar sobre los hidrocarburos"],"El agua tiene una tensión superficial alta, que se reduce con humectantes para mejorar la penetración. Su densidad es mayor que la de la mayoría de los hidrocarburos, por eso se hunde bajo ellos y puede provocar desbordamientos. Su efecto principal es el enfriamiento, con un efecto secundario de sofocación por el vapor."],
[4,"Al vaporizarse a 100 °C y presión atmosférica, 1 litro de agua genera aproximadamente:",["1.700 litros de vapor","170 litros de vapor","17.000 litros de vapor","500 litros de vapor"],"La expansión de unas 1.700 veces explica el efecto de sofocación del vapor. También explica el riesgo para el propio bombero si se aplica en exceso en recintos cerrados, porque genera vapor que provoca quemaduras y altera el equilibrio térmico de la capa de humos."],
[4,"Según su coeficiente de expansión, una espuma con coeficiente 150 se clasifica como:",["Espuma de media expansión","Espuma de baja expansión","Espuma de alta expansión","Espuma AFFF de expansión intermedia"],"Clasificación habitual (UNE-EN 1568): baja expansión, hasta 20; media, de 21 a 200; alta, más de 200. AFFF es un tipo de espumógeno (formador de película acuosa), no un grado de expansión."],
[4,"Señale la secuencia terminológica correcta en la producción de espuma:",["Espumógeno + agua = espumante (solución); espumante + aire = espuma","Espumante + agua = espumógeno; espumógeno + aire = espuma","Espumógeno + aire = espuma; espuma + agua = espumante","Espuma + agua = espumógeno; espumógeno + aire = espumante"],"El espumógeno es el concentrado líquido que se dosifica en el agua al 1 %, 3 % o 6 %. Así se obtiene la solución espumante, que al mezclarse con aire en la lanza o el generador da la espuma. Extingue sobre todo por sofocación (separación) y, en menor medida, por enfriamiento."],
[4,"Para extinguir con espuma un incendio de un disolvente polar (alcohol, acetona), debe emplearse:",["Un espumógeno resistente al alcohol (AR), porque los disolventes polares destruyen las espumas convencionales","Espuma convencional de alta expansión, a la que no afectan los disolventes polares","AFFF convencional, cuya película acuosa es especialmente estable sobre líquidos miscibles con agua","Agua a chorro, porque los disolventes polares no admiten espuma"],"Los líquidos miscibles con agua absorben el agua de la espuma y la destruyen. Los espumógenos AR (por ejemplo, AFFF-AR) forman una membrana polimérica que protege la espuma. El chorro de agua puede proyectar y extender el combustible."],
[4,"¿Cuál de las siguientes afirmaciones sobre el CO2 como agente extintor es **falsa**?",["Es el agente más adecuado para fuegos profundos de clase A, porque penetra en las brasas y evita la reignición","Actúa sobre todo por sofocación, con un efecto secundario de enfriamiento por la expansión del gas al salir","No conduce la electricidad y no deja residuos, por lo que es adecuado para equipos electrónicos","En recintos cerrados puede alcanzar concentraciones peligrosas para las personas que permanezcan en ellos"],"El CO2 no penetra en las brasas y, una vez disipado, el fuego de clase A puede reavivarse, por lo que no es eficaz sobre él. Se usa en fuegos de clase B y en equipos eléctricos o electrónicos. La descarga sale muy fría (unos -78 °C), con riesgo de quemaduras por frío en la boquilla."],
[4,"El polvo polivalente ABC (a base de fosfato monoamónico) es eficaz en fuegos de clase A porque, además de inhibir la reacción en cadena:",["Funde y forma una capa vitrificada sobre las brasas que las aísla del oxígeno","Libera agua de cristalización suficiente para enfriar completamente el núcleo de las brasas","Desplaza el oxígeno por su elevada densidad gaseosa","Reacciona con el carbono y forma CO2 inerte"],"Los polvos BC (bicarbonatos sódico o potásico) actúan casi solo por inhibición y no controlan las brasas. El fosfato monoamónico se descompone con el calor y forma una capa vítrea sobre la superficie del sólido, que sofoca e impide la reignición."],
[4,"Para un fuego de virutas de magnesio, ¿cuál de los siguientes agentes **no** sería inadecuado?",["Polvo específico para metales (clase D)","Agua finamente pulverizada","CO2 en descarga continua","Espuma de baja expansión (AFFF)"],"El magnesio en combustión reacciona con el agua (libera hidrógeno y se aviva el fuego) y con el CO2 (se reduce a carbono y sigue ardiendo). La espuma contiene agua. Solo los polvos especiales de clase D, que se aplican suavemente para cubrir el metal, son adecuados. La doble negación pide el agente correcto."],
[4,"Según el RIPCI (RD 513/2017), los extintores fijados en paramentos se colocarán, siempre que sea posible, con su extremo superior a una altura sobre el suelo:",["Entre 80 cm y 120 cm","De 1,70 m como máximo","Entre 1,20 m y 1,50 m","De 1,00 m como máximo"],"El RIPCI de 2017 cambió el criterio anterior (parte superior a 1,70 m como máximo) para facilitar el uso, también por personas con movilidad reducida. Es una pregunta trampa clásica para quien estudió con la normativa de 1993."],
[4,"Sobre el mantenimiento de extintores según el RIPCI, señale la opción que **no** es errónea:",["Vida útil de 20 años desde su fabricación (salvo los de materiales compuestos) y retimbrado cada 5 años","Vida útil de 10 años desde su fabricación, con retimbrado anual por empresa mantenedora","Vida útil ilimitada mientras superen el retimbrado, que se realiza cada 5 años","Vida útil de 20 años contados desde la fecha de instalación, con retimbrado cada 5 años"],"La vida útil se cuenta desde la fabricación, no desde la instalación. Hay revisiones trimestrales (titular o mantenedor), anuales (empresa mantenedora) y quinquenales (retimbrado o prueba de nivel C según la ITC MIE-AP5). Los extintores con recipiente de materiales compuestos siguen lo que indique el fabricante."],
[4,"Según el DB-SI 4 del CTE, con carácter general, los extintores portátiles de eficacia 21A-113B se colocarán:",["A 15 m de recorrido como máximo en cada planta, desde todo origen de evacuación","A 25 m de recorrido como máximo desde todo origen de evacuación","Uno por cada 300 m² construidos, sin tener en cuenta el recorrido","A 15 m en línea recta desde cualquier punto de la planta"],"La distancia de 15 m se mide por recorrido real, no en línea recta. Además, las zonas de riesgo especial necesitan extintores en su interior o cerca de su puerta de acceso. No hay que confundir este dato con los 25 m de los pulsadores de alarma del RIPCI."],
[4,"En la eficacia de un extintor «21A-113B», la cifra 113 se refiere a:",["Los litros de líquido del hogar tipo que el extintor es capaz de apagar","La superficie en dm² de la bandeja del hogar tipo que el extintor apaga","La duración mínima de la descarga del agente extintor, en segundos","Los gramos de agente extintor por cada litro de capacidad del recipiente"],"En los hogares B, la cifra indica el volumen de líquido en litros (1/3 agua y 2/3 n-heptano en una bandeja). En los hogares A, indica la longitud del hogar tipo de madera: 21A equivale a un hogar de 2,1 m. Cuanto mayor es la cifra, mayor es la eficacia."],
[4,"Sobre los halones como agentes extintores, señale la afirmación correcta:",["Están prohibidos en la UE por dañar la capa de ozono, salvo usos críticos expresamente autorizados","Siguen siendo el agente de referencia en oficinas y salas informáticas porque no dejan residuos","Se permiten sin restricción en extintores portátiles de menos de 2 kg de carga","Actúan exclusivamente por sofocación, al desplazar el oxígeno del recinto"],"Los halones actúan sobre todo por inhibición química. El Reglamento (CE) 1005/2009 los prohíbe salvo usos críticos tasados, como algunos de aviación o militares. Se han sustituido por agentes limpios (HFC-227ea, FK-5-1-12) y gases inertes (IG-541, IG-55)."],
[4,"En un extintor de CO2, el estado de carga se comprueba:",["Por pesada, porque el CO2 está licuado y su presión no indica la carga","Con el manómetro, que debe marcar la zona verde a la temperatura de referencia","Mirando el nivel de líquido a través de la mirilla de la válvula","Agitándolo para comprobar que el agente no se ha apelmazado en el fondo"],"Mientras quede líquido, la presión de la botella depende solo de la temperatura (unos 57 bar a 20 °C), así que un manómetro no indicaría la pérdida de carga. Por eso estos extintores no llevan manómetro y se controlan por peso."],
/* ---------- TEMA 6 · HIDRÁULICA ---------- */
[5,"Una columna seca está llena de agua, sin circulación, hasta una boca situada 45 m por encima de la toma de fachada. Despreciando la presión atmosférica, la presión estática en la toma será aproximadamente:",["4,5 bar","45 bar","0,45 bar","9 bar"],"Cada 10 m de columna de agua equivalen a 1 bar (1 bar ≈ 10,2 m.c.a.), según P = ρ·g·h. Por tanto, 45 m dan unos 4,5 bar. En operaciones en altura hay que sumar esta presión a la que exige la lanza en punta y a las pérdidas de carga."],
[5,"Por una manguera circula un caudal constante. Si el diámetro de la boquilla se reduce a la mitad, la velocidad del agua en ella:",["Se multiplica por cuatro","Se duplica","Se reduce a la mitad","Se multiplica por ocho"],"Por la ecuación de continuidad, Q = S·v. La sección depende del cuadrado del diámetro: si el diámetro se reduce a la mitad, la sección es 1/4 y, con el mismo caudal, la velocidad se multiplica por 4."],
[5,"En un tendido de mangueras en régimen turbulento, si el caudal se duplica y se mantienen el diámetro y la longitud, la pérdida de carga aproximadamente:",["Se cuadruplica","Se duplica","No cambia","Se reduce a la mitad"],"La pérdida de carga es aproximadamente proporcional al cuadrado de la velocidad o del caudal (Darcy-Weisbach), proporcional a la longitud e inversamente proporcional a la quinta potencia del diámetro. Es la razón por la que, para mover mucho caudal a distancia, se usan diámetros mayores (70 o 110 mm)."],
[5,"Sobre las pérdidas de carga en mangueras, señale la afirmación que **no** es incorrecta:",["Son proporcionales a la longitud del tendido y disminuyen mucho al aumentar el diámetro de la manguera","No dependen del caudal; solo dependen de la longitud del tendido y del material de la manguera","Aumentan al aumentar el diámetro de la manguera, porque hay más superficie de rozamiento","Solo se producen en tramos con desnivel, y son proporcionales a la diferencia de cota"],"Al aumentar el diámetro baja la velocidad y la pérdida cae con la quinta potencia del diámetro. El desnivel no es una pérdida por rozamiento, sino un cambio de energía potencial (presión estática) que se calcula aparte."],
[5,"El principio por el que la presión ejercida sobre un fluido incompresible en reposo, en un recipiente cerrado, se transmite con igual intensidad en todas las direcciones es el principio de:",["Pascal","Arquímedes","Bernoulli","Torricelli"],"Pascal explica, por ejemplo, el funcionamiento de las herramientas hidráulicas de rescate (separadores, cizallas, cilindros). Arquímedes trata del empuje, Bernoulli de la conservación de la energía en fluidos en movimiento y Torricelli de la velocidad de salida por un orificio."],
[5,"La altura máxima teórica de aspiración de una bomba a nivel del mar, con agua fría, es aproximadamente:",["10,33 m, aunque en la práctica es bastante menor (del orden de 7-8 m)","Ilimitada, si la bomba tiene potencia y cebado suficientes","Unos 20 m con bombas centrífugas de dos etapas en serie","5 m teóricos, ampliables hasta unos 8 m aumentando el régimen"],"La bomba no «tira» del agua: es la presión atmosférica (101.325 Pa, unos 10,33 m.c.a.) la que empuja el agua cuando se hace el vacío. Las pérdidas en la aspiración, la tensión de vapor y la temperatura reducen la altura práctica."],
[5,"Si un vehículo aspira agua de un embalse a 1.500 m de altitud, comparado con el nivel del mar:",["La altura máxima de aspiración es menor, porque baja la presión atmosférica","La altura máxima de aspiración es mayor, porque el aire es menos denso","No cambia, porque depende solo de la potencia de la bomba","La altura máxima de aspiración es mayor, porque el agua hierve antes"],"Al ser la presión atmosférica menor, el límite teórico baja. Además, que el agua hierva antes facilita la cavitación. Ambos efectos reducen la capacidad de aspiración."],
[5,"La cavitación en una bomba centrífuga se produce cuando:",["La presión en la aspiración baja de la presión de vapor del agua y se forman burbujas que implosionan en zonas de más presión","La presión de impulsión supera la de timbre de las mangueras y la bomba trabaja contra una válvula cerrada, calentando el agua","Se cierra bruscamente una lanza y se genera una onda de sobrepresión que se propaga hasta el rodete de la bomba","Entra aire por una junta de la aspiración o por el cebador y la bomba pierde el cebado"],"La cavitación provoca ruido «de grava», vibraciones, pérdida de rendimiento y erosión del rodete. Se favorece con aspiraciones altas o largas, agua caliente, régimen excesivo o filtros obstruidos. La tercera opción describe el golpe de ariete."],
[5,"Para evitar el golpe de ariete en un tendido de mangueras, lo correcto es:",["Abrir y, sobre todo, cerrar lentamente las lanzas y las válvulas","Cerrar rápidamente las lanzas para acortar la sobrepresión","Subir el régimen de la bomba antes de cerrar la lanza","Usar mangueras de menor diámetro"],"El golpe de ariete es la sobrepresión que se produce al detener bruscamente una columna de agua en movimiento (ΔP = ρ·c·Δv). Puede reventar mangueras, dañar la bomba y desplazar violentamente la lanza. Las maniobras deben ser progresivas."],
[5,"En una bomba centrífuga, según las leyes de semejanza, si se duplica la velocidad de giro:",["El caudal se duplica, la altura (presión) se multiplica por cuatro y la potencia absorbida por ocho","El caudal se multiplica por cuatro, la altura se duplica y la potencia se multiplica por ocho","Caudal, altura y potencia se duplican","El caudal se duplica, la altura se duplica y la potencia se multiplica por cuatro"],"Leyes de afinidad: Q es proporcional a n, H a n² y P a n³. Por eso los pequeños aumentos de régimen elevan mucho la presión y, sobre todo, el consumo de potencia."],
[5,"Respecto de una sola bomba, dos bombas centrífugas iguales acopladas en serie proporcionan, idealmente:",["El mismo caudal y el doble de altura manométrica","El doble de caudal a la misma altura manométrica","El doble de caudal y el doble de altura manométrica","La mitad de caudal y el doble de altura manométrica"],"En serie se suman las alturas, lo que sirve para vencer grandes desniveles o tendidos largos (por ejemplo, el relevo entre vehículos). En paralelo se suman los caudales a la misma presión."],
[5,"Sobre el racor tipo Barcelona (UNE 23400), señale la afirmación que **no** es incorrecta:",["Es simétrico: dos racores del mismo diámetro se acoplan entre sí sin distinguir macho y hembra","Es un racor roscado asimétrico, con macho y hembra que deben orientarse","Es simétrico, pero solo se fabrica en 45 mm y requiere reducciones para 25 y 70 mm","Es simétrico, pero su acoplamiento exige siempre el uso de una llave de racor"],"El racor Barcelona se acopla con un giro de bayoneta y existe en 25, 45, 70 y 100 mm. Que sea simétrico agiliza los tendidos. Para unir diámetros distintos se usan reducciones."],
[5,"Según el teorema de Bernoulli para un fluido ideal en régimen estacionario, en un estrechamiento de una tubería horizontal:",["La velocidad aumenta y la presión estática disminuye","Aumentan la velocidad y la presión estática","La velocidad disminuye y la presión estática aumenta","La velocidad no cambia y la presión aumenta"],"Es el efecto Venturi, en el que se basan los premezcladores o proporcionadores de espuma de línea. La depresión del estrechamiento aspira el espumógeno."],
[5,"Frente al chorro sólido, el agua pulverizada en una lanza de caudal regulable:",["Ofrece más superficie de contacto y absorbe más calor, a costa de menor alcance","Tiene más alcance y penetración","Consume más caudal con la misma presión y la misma boquilla","Es más peligrosa que el chorro sólido frente al riesgo eléctrico"],"Las gotas finas multiplican la superficie de intercambio térmico y aprovechan mejor el calor latente de vaporización. El chorro sólido alcanza más y penetra mejor, pero es más conductor eléctricamente y aprovecha peor el agua."],
/* ---------- TEMA 7 · INSTALACIONES PCI (RIPCI) ---------- */
[6,"En las bocas de incendio equipadas (BIE), señale la asociación correcta:",["BIE de 25 mm con manguera semirrígida (UNE-EN 671-1) y BIE de 45 mm con manguera plana (UNE-EN 671-2)","BIE de 25 mm con manguera plana (UNE-EN 671-2) y BIE de 45 mm con manguera semirrígida (UNE-EN 671-1)","Ambas con manguera plana (UNE-EN 671-2), que debe desplegarse por completo antes de abrir el agua","Ambas con manguera semirrígida en devanadera (UNE-EN 671-1), utilizable sin desplegarla entera"],"La BIE de 25 mm tiene manguera semirrígida en devanadera y puede usarse sin desplegarla entera, por lo que la puede manejar una sola persona sin formación especial. La de 45 mm tiene manguera plana plegada y debe desplegarse por completo antes de abrir el agua; da más caudal y requiere más destreza."],
[6,"En el diseño de una red de BIE, con las dos BIE hidráulicamente más desfavorables funcionando a la vez, la red debe garantizar durante al menos una hora una presión dinámica mínima en el orificio de salida de:",["2 bar","1 bar","3,5 bar","5 bar"],"Es el requisito clásico del RIPCI para el abastecimiento de las BIE: dos BIE simultáneas, durante una hora y con al menos 2 bar en la salida. El dato de 5 bar de los distractores es un límite superior histórico que se mencionaba para evitar presiones excesivas en lanza."],
[6,"Según el RIPCI, la separación máxima entre cada BIE y la más cercana es de:",["50 m, medidos siguiendo recorridos de evacuación","25 m en línea recta","50 m en línea recta","100 m, medidos siguiendo recorridos de evacuación"],"El RD 513/2017 aclara que la separación, la distancia máxima y el radio de acción se miden siguiendo recorridos de evacuación, no en línea recta. La cifra de 25 m corresponde a la distancia máxima histórica desde cualquier punto hasta la BIE más próxima."],
[6,"Según el RIPCI, las BIE se situarán, siempre que sea posible, a una distancia máxima de las puertas de salida del sector de incendio de:",["5 m","1,5 m","10 m","15 m"],"Al colocarlas junto a las salidas, el usuario puede atacar el fuego con la vía de escape a su espalda. Además, la BIE no debe estorbar la evacuación."],
[6,"Sobre la columna seca, señale la afirmación **falsa**:",["Es una instalación de uso general para que los ocupantes del edificio hagan la primera intervención","Es de uso exclusivo de los servicios de extinción","Su toma de alimentación en fachada tiene conexión siamesa","El CTE la exige, con carácter general, cuando la altura de evacuación supera los 24 m"],"La columna seca es una tubería vacía que los bomberos alimentan desde la fachada con su vehículo, mediante una toma siamesa de 2×70 mm, y usan conectando mangueras en las bocas de planta. No sirve para la autoprotección de los ocupantes, para la que están los extintores y las BIE."],
[6,"En una columna seca, las bocas de salida en las plantas se colocan:",["En las plantas pares hasta la octava y en todas a partir de ella","En todas las plantas","En las plantas impares hasta la octava y en todas a partir de ella","Cada tres plantas"],"Con bocas en plantas pares, cualquier planta queda como mucho a una altura de distancia de una salida. A partir de la octava se ponen en todas para reducir los tendidos en altura. La conducción suele ser de acero galvanizado DN 80."],
[6,"La ampolla de un rociador automático de color **rojo** indica una temperatura nominal de funcionamiento de:",["68 °C","57 °C","79 °C","93 °C"],"Código de colores de las ampollas: naranja 57 °C, rojo 68 °C, amarillo 79 °C, verde 93 °C, azul 141 °C, malva 182 °C y negro 204/260 °C. La temperatura nominal se elige unos 30 °C por encima de la máxima ambiental prevista."],
[6,"¿Qué sistema de rociadores usa boquillas **abiertas** y se activa mediante un sistema de detección independiente que abre la válvula de control?",["Sistema de diluvio","Sistema de tubería mojada","Sistema de tubería seca","Sistema de acción previa (preacción)"],"En el diluvio descargan a la vez todas las boquillas de la zona; se usa en riesgos de propagación muy rápida. La preacción también usa detección para llenar la red, pero sus rociadores son cerrados y cada uno se abre por su propio elemento térmico."],
[6,"En una zona sin calefacción con riesgo de heladas (por ejemplo, un aparcamiento abierto), el sistema de rociadores más adecuado es:",["De tubería seca, con aire o nitrógeno a presión aguas abajo de la válvula","De tubería mojada con agua sin aditivos","De diluvio con rociadores cerrados","Ninguno, porque no se pueden instalar rociadores en zonas con riesgo de helada"],"En la tubería seca, al abrirse un rociador cae la presión del gas, se abre la válvula y entra el agua, con un pequeño retardo. La opción de diluvio con rociadores cerrados es contradictoria: el diluvio usa boquillas abiertas."],
[6,"¿Qué detector es más adecuado para descubrir pronto un fuego latente sin llama, con humo visible de partículas grandes (por ejemplo, un sofá que arde lentamente)?",["Detector óptico de humo","Detector iónico de humo","Detector térmico termostático","Detector de llama infrarrojo"],"El detector óptico, por dispersión de luz, responde bien a partículas grandes y visibles propias de fuegos lentos. El iónico es más sensible a partículas pequeñas e invisibles de fuegos rápidos con llama. Los térmicos responden tarde y los de llama necesitan llama visible."],
[6,"Según el RIPCI, la distancia máxima a recorrer desde cualquier origen de evacuación hasta un pulsador manual de alarma **no** debe superar:",["25 m","15 m","50 m","30 m"],"Los pulsadores se colocan, además, junto a cada salida de evacuación. No hay que confundirlo con los 15 m de recorrido hasta un extintor del CTE."],
[6,"Según el RIPCI, cuando la inspección de las instalaciones de protección activa no está regulada por una reglamentación específica, sus titulares deben solicitar una inspección a un organismo de control acreditado:",["Al menos cada diez años","Cada cinco años","Cada año","Solo en la puesta en servicio"],"El RD 513/2017 introdujo las inspecciones periódicas decenales por organismo de control. Son distintas del mantenimiento: el trimestral y semestral lo puede hacer el titular (Tabla I) y el anual y quinquenal una empresa mantenedora (Tabla II)."],
[6,"Un detector termovelocimétrico se activa:",["Cuando la temperatura sube más deprisa que un valor prefijado","Al alcanzar una temperatura fija, sea cual sea la velocidad de subida","Al detectar la radiación ultravioleta emitida por la llama","Al variar la corriente de ionización de su cámara de medida"],"El detector termovelocimétrico responde a la velocidad de subida de la temperatura (°C/min), por lo que detecta antes que el termostático los fuegos de crecimiento rápido. Suele incluir también un umbral fijo para los fuegos lentos."],
[6,"¿Qué tipo de detector lleva una pequeña fuente radiactiva (normalmente americio-241), lo que condiciona su retirada como residuo?",["Detector iónico de humo","Detector óptico de humo","Detector termovelocimétrico","Detector de llama ultravioleta"],"La fuente radiactiva ioniza el aire de la cámara. Cuando entran partículas de humo, la corriente de ionización disminuye y salta la alarma. Por esa fuente, estos detectores se retiran por un gestor autorizado y tienden a sustituirse por detectores ópticos o multisensor."],
/* ---------- TEMA 8 · CTE DB-SI ---------- */
[7,"¿Cuál de las siguientes secciones **no** forma parte del DB-SI del Código Técnico de la Edificación?",["«SI 7: Señalización de los medios de evacuación»","«SI 5: Intervención de los bomberos»","«SI 2: Propagación exterior»","«SI 6: Resistencia al fuego de la estructura»"],"El DB-SI tiene seis secciones: SI 1 propagación interior, SI 2 propagación exterior, SI 3 evacuación de ocupantes, SI 4 instalaciones de protección contra incendios, SI 5 intervención de los bomberos y SI 6 resistencia al fuego de la estructura. No existe una «SI 7»: la señalización de los medios de evacuación es el apartado 7 de la SI 3, y la de las instalaciones manuales de protección contra incendios, el apartado 2 de la SI 4."],
[7,"El DB-SI del CTE **no** se aplica a:",["Los establecimientos de uso industrial","Los edificios de uso Residencial Vivienda","Los aparcamientos integrados en edificios de viviendas","Los edificios de uso Docente"],"Los establecimientos industriales se rigen por el Reglamento de seguridad contra incendios en los establecimientos industriales. Las zonas de otros usos dentro de ellos (por ejemplo, oficinas por encima de ciertos umbrales) pueden quedar sometidas al DB-SI."],
[7,"Las superficies máximas de los sectores de incendio de la tabla 1.1 del DB-SI 1:",["Pueden duplicarse si los sectores están protegidos con una instalación automática de extinción","Pueden duplicarse si los sectores disponen de un sistema de detección automática de incendios","Pueden aumentarse un 25 % si los sectores están protegidos con una instalación automática de extinción","No pueden aumentarse en ningún caso, sean cuales sean las instalaciones de protección"],"La trampa está en confundir dos ventajas de la extinción automática: en sectorización duplica la superficie máxima del sector (DB-SI 1), y en evacuación aumenta un 25 % la longitud de los recorridos (DB-SI 3). La detección no da ninguna de las dos."],
[7,"Con carácter general (por ejemplo, en uso Administrativo o Docente), la superficie construida de cada sector de incendio **no** debe superar:",["2.500 m²","1.500 m²","5.000 m²","10.000 m²"],"Es la regla general de la tabla 1.1 del DB-SI 1. Hay excepciones, como las plantas de hospitalización (al menos dos sectores de 1.500 m² como máximo cada uno) o ciertos establecimientos comerciales protegidos con rociadores."],
[7,"En una planta de uso Administrativo con más de una salida de planta y **sin** instalación automática de extinción, la longitud de los recorridos de evacuación hasta alguna salida de planta **no** debe superar:",["50 m","25 m","35 m","62,5 m"],"Tabla 3.1 del DB-SI 3: con varias salidas, 50 m en general (35 m en zonas con ocupantes que duermen, plantas de hospitalización y plantas de escuela infantil o primaria). Con una sola salida, 25 m. La cifra de 62,5 m solo valdría con extinción automática (50 m + 25 %)."],
[7,"Las longitudes máximas de los recorridos de evacuación del DB-SI 3 pueden aumentarse:",["Un 25 %, en sectores protegidos con una instalación automática de extinción","Un 50 %, en sectores protegidos con un sistema de detección automática","Un 25 %, en sectores dotados de alumbrado de emergencia y señalización fotoluminiscente","Al doble, en sectores protegidos con una instalación automática de extinción"],"Es la nota general de la tabla 3.1. No hay que confundirla con la duplicación de la superficie de los sectores del DB-SI 1."],
[7,"Una puerta prevista como salida de planta o de edificio debe abrir en el sentido de la evacuación cuando está prevista para el paso de más de:",["200 personas en uso Residencial Vivienda, 100 en los demás casos, o más de 50 ocupantes del recinto donde se encuentra","100 personas en uso Residencial Vivienda, 200 en los demás casos, o más de 50 ocupantes del recinto","50 personas en cualquier uso","500 personas en uso Residencial Vivienda y 100 en los demás casos"],"DB-SI 3, apartado 6. Los distractores intercambian las cifras de vivienda y del resto de usos. El criterio de los 50 ocupantes del recinto se aplica a la puerta del propio recinto."],
[7,"El dimensionado de puertas y pasos de evacuación según el DB-SI 3 exige:",["A ≥ P/200 ≥ 0,80 m, con hojas de puerta de entre 0,60 m y 1,20 m de anchura","A ≥ P/160 ≥ 1,00 m, con hojas de puerta de entre 0,80 m y 1,20 m de anchura","A ≥ P/200 ≥ 1,00 m, con hojas de puerta de entre 0,60 m y 1,50 m de anchura","A ≥ P/600 ≥ 0,80 m, con hojas de puerta de entre 0,60 m y 1,20 m de anchura"],"Para pasillos y rampas: A ≥ P/200 ≥ 1,00 m. Para escaleras no protegidas en evacuación descendente: A ≥ P/160. La fórmula P/600 corresponde a pasos y pasillos en zonas al aire libre."],
[7,"Para calcular la ocupación de una planta de oficinas de 1.200 m² útiles con las densidades del DB-SI, el resultado es:",["120 personas (10 m² por persona)","60 personas (20 m² por persona)","240 personas (5 m² por persona)","600 personas (2 m² por persona)"],"Algunas densidades de la tabla 2.1 del DB-SI 3: oficinas, 10 m² por persona; Residencial Vivienda, 20; aulas, 1,5; zonas de venta comerciales en planta baja, 2; aparcamientos, 15 o 40 según el caso; archivos y almacenes, 40. Se calculan sobre la superficie útil."],
