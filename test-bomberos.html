[7,"Los viales de aproximación a los espacios de maniobra de los vehículos de bomberos deben tener, entre otras condiciones:",["3,5 m de anchura libre mínima, 4,5 m de altura libre o gálibo y una capacidad portante de 20 kN/m²","5 m de anchura libre mínima, 4 m de altura libre o gálibo y una capacidad portante de 10 kN/m²","3,5 m de anchura libre mínima, 4 m de altura libre o gálibo y una capacidad portante de 20 kN/m²","4,5 m de anchura libre mínima, 3,5 m de altura libre o gálibo y una capacidad portante de 20 kN/m²"],"DB-SI 5. En los tramos curvos, el carril queda delimitado por radios de 5,30 m y 12,50 m, con 7,20 m de anchura libre. La trampa más frecuente es intercambiar la anchura (3,5 m) y el gálibo (4,5 m)."],
[7,"En el espacio de maniobra junto a la fachada de un edificio con 18 m de altura de evacuación, la separación máxima del vehículo de bomberos a la fachada es de:",["18 m","23 m","10 m","30 m"],"DB-SI 5: hasta 15 m de altura de evacuación, 23 m; de más de 15 m a 20 m, 18 m; de más de 20 m, 10 m. Los 30 m son la distancia máxima hasta los accesos al edificio. El espacio de maniobra debe tener además 5 m de anchura libre y una pendiente máxima del 10 %."],
[7,"Para que los bomberos puedan acceder por la fachada, los huecos deben cumplir, entre otras condiciones:",["Alféizar a 1,20 m como máximo sobre el nivel de la planta, dimensiones mínimas de 0,80 m en horizontal y 1,20 m en vertical, y 25 m como máximo entre ejes verticales de huecos consecutivos","Alféizar a 0,80 m como máximo sobre el nivel de la planta, dimensiones mínimas de 1,20 m en horizontal y 0,80 m en vertical, y 25 m como máximo entre ejes verticales de huecos consecutivos","Alféizar a 1,20 m como máximo sobre el nivel de la planta, dimensiones mínimas de 0,80 m en horizontal y 1,20 m en vertical, y 50 m como máximo entre ejes verticales de huecos consecutivos","Alféizar a 1,50 m como máximo sobre el nivel de la planta, dimensiones mínimas de 0,60 m en horizontal y 1,00 m en vertical, y 25 m como máximo entre ejes verticales de huecos consecutivos"],"DB-SI 5, apartado 2. Además, no debe haber elementos en esos huecos que impidan o dificulten la entrada al edificio, salvo elementos de seguridad en plantas con altura de evacuación de hasta 9 m."],
[7,"En la clasificación de resistencia al fuego, la designación «EI 60» de un elemento de compartimentación significa que, durante 60 minutos, mantiene:",["La integridad (E) y el aislamiento térmico (I), sin exigirse capacidad portante","La capacidad portante (R) y la estanqueidad (E), sin exigirse aislamiento térmico","La estabilidad (E) y la integridad (I), sin exigirse aislamiento térmico","La integridad (E) y la ignifugación (I), sin exigirse capacidad portante"],"R es la capacidad portante, E la integridad, I el aislamiento, W la radiación, M la acción mecánica, C el cierre automático y S la estanqueidad al humo. Un muro de carga que compartimenta se clasifica como REI; una puerta, por ejemplo, como EI2 60-C5."],
[7,"Un revestimiento de pared clasificado como «B-s1,d0» es un material:",["De contribución al fuego muy limitada, con poca producción de humo y sin caída de gotas o partículas inflamadas","De contribución al fuego muy limitada, con mucha producción de humo (s1) y sin caída de gotas o partículas","Combustible de clase B (líquidos inflamables) según la UNE-EN 2, sin requisitos de producción de humo","No combustible, equivalente a A1, con baja producción de humo y caída de gotas limitada"],"Euroclases (UNE-EN 13501-1): A1, A2, B, C, D, E y F. El humo se gradúa de s1 (poco) a s3 (mucho) y la caída de gotas de d0 (ninguna) a d2. La «clase B» de las Euroclases no tiene nada que ver con la clase B de fuego de la UNE-EN 2."],
[7,"Según el DB-SI, una señal de evacuación con una distancia de observación de entre 10 y 20 m tendrá un tamaño de:",["420 × 420 mm","210 × 210 mm","594 × 594 mm","297 × 297 mm"],"Hasta 10 m, 210 × 210 mm; de 10 a 20 m, 420 × 420 mm; de 20 a 30 m, 594 × 594 mm. Las señales deben verse aunque falle el alumbrado normal; si son fotoluminiscentes, deben cumplir la UNE 23035-4."],
[7,"Según el DB-SUA 4, el alumbrado de emergencia de los recorridos de evacuación debe dar, durante al menos una hora, una iluminancia horizontal en el suelo, a lo largo del eje central, de:",["Al menos 1 lux, y 5 lux donde haya equipos de seguridad, instalaciones de protección contra incendios de uso manual y cuadros de distribución del alumbrado","Al menos 5 lux en todo el recorrido, y 10 lux donde haya equipos de seguridad, instalaciones manuales de protección contra incendios y cuadros de alumbrado","Al menos 0,5 lux, y 1 lux donde haya equipos de seguridad, instalaciones de protección contra incendios de uso manual y cuadros de distribución del alumbrado","Al menos 1 lux únicamente en las salidas de planta y de edificio, sin exigencias en el resto del recorrido ni en los equipos de seguridad"],"El alumbrado de emergencia debe alcanzar el 50 % del nivel exigido a los 5 segundos y el 100 % a los 60 segundos. La relación entre iluminancia máxima y mínima en el eje no debe superar 40:1."],
[7,"El DB-SI define la «altura de evacuación» de un edificio como:",["La máxima diferencia de cotas entre un origen de evacuación y su salida de edificio, sin contar las plantas que solo tienen zonas de ocupación nula","La altura total del edificio medida desde la rasante de la calle hasta la cara superior de la cubierta, incluidas las plantas técnicas","La diferencia de cotas entre la planta habitable más alta y la planta baja, contando los cuartos de instalaciones","La suma de las alturas libres de todas las plantas sobre rasante en las que exista algún origen de evacuación"],"Esta definición determina muchas exigencias: columna seca (más de 24 m), resistencia al fuego (R 60, R 90 o R 120), espacio de maniobra (más de 9 m), etc. Las plantas con solo ocupación nula, como las salas de máquinas, no se cuentan."],
[7,"En un edificio de uso Residencial Vivienda con 20 m de altura de evacuación, la resistencia al fuego exigida a la estructura de las plantas sobre rasante es:",["R 90","R 60","R 120","R 30"],"Tabla 3.1 del DB-SI 6 para Residencial Vivienda: altura de evacuación de hasta 15 m, R 60; de hasta 28 m, R 90; de más de 28 m, R 120. Las plantas de sótano exigen R 120."],
/* ---------- TEMA 9 · MERCANCÍAS PELIGROSAS (ADR) ---------- */
[8,"Las materias que en contacto con el agua desprenden gases inflamables pertenecen a la clase ADR:",["4.3","4.1","4.2","5.1"],"Clase 4.1: sólidos inflamables, materias autorreactivas y explosivos sólidos desensibilizados. Clase 4.2: materias que pueden experimentar inflamación espontánea. Clase 4.3: materias que en contacto con el agua desprenden gases inflamables. Clase 5.1: materias comburentes."],
[8,"En el panel naranja de una cisterna, señale la afirmación que **no** es incorrecta:",["En la mitad superior figura el número de identificación del peligro y en la inferior el número ONU de la materia","En la mitad superior figura el número ONU y en la inferior el número de identificación del peligro","En la mitad superior figura la clase ADR y en la inferior el número de identificación del peligro","Las dos cifras se refieren a la materia y deben coincidir"],"El número de identificación del peligro (o código Kemler), de 2 o 3 cifras y con una posible X delante, va arriba. El número ONU, de 4 cifras, identifica la materia y va abajo. El panel mide 40 × 30 cm y es retrorreflectante."],
[8,"La letra «X» delante del número de identificación del peligro indica que:",["La materia reacciona peligrosamente con el agua, y solo puede usarse agua con la aprobación de expertos","Se trata de una materia explosiva de la clase 1, por lo que debe mantenerse una distancia mínima de seguridad","Es una mezcla de materias de distintas clases, cuyos peligros se detallan en la carta de porte","El transporte está exento de las disposiciones del ADR por tratarse de cantidades limitadas"],"Por ejemplo, X423 indica un sólido que reacciona peligrosamente con el agua desprendiendo gases inflamables, y X88 una materia muy corrosiva que reacciona peligrosamente con el agua. La X condiciona totalmente la elección del agente extintor y la forma de contener una fuga."],
[8,"Un panel naranja «33 / 1203» identifica:",["Un líquido muy inflamable (punto de inflamación inferior a 23 °C): gasolina","Un líquido inflamable con punto de inflamación entre 23 °C y 60 °C: gasóleo","Un gas inflamable: propano","Un líquido inflamable que reacciona con el agua"],"El 3 indica inflamabilidad de líquidos y su duplicación (33) indica un líquido muy inflamable. El número ONU 1203 es la gasolina. El gasóleo se identifica con 30/1202 y la mezcla de hidrocarburos gaseosos licuados (propano-butano) con 23/1965."],
[8,"En el número de identificación del peligro, la repetición de una cifra (por ejemplo 33, 66 u 88) indica:",["Que el peligro correspondiente es más intenso","Que la materia tiene dos peligros distintos de la misma clase","Que el vehículo transporta dos materias diferentes","Que el peligro es secundario"],"Ejemplos: 33, líquido muy inflamable; 66, materia muy tóxica; 88, materia muy corrosiva. La excepción es el 22, que indica un gas licuado refrigerado (asfixiante)."],
[8,"Cuando el peligro de una materia queda suficientemente indicado con una sola cifra, ésta se completa con:",["Un cero (por ejemplo 30, 50 u 80)","Una X (por ejemplo, X3 o X5)","La misma cifra repetida (33, 55, 88)","Un 1 (por ejemplo 31, 51 u 81)"],"El cero no aporta información de peligro: solo completa el número de dos cifras. Por ejemplo, 80 es una materia corrosiva y 50 una materia comburente."],
[8,"El número de identificación del peligro «268» corresponde a:",["Un gas tóxico y corrosivo (por ejemplo, el amoníaco anhidro, ONU 1005)","Un gas inflamable, tóxico y corrosivo, según el orden de las cifras","Un gas tóxico y comburente (por ejemplo, el cloro)","Un líquido tóxico y corrosivo, al no figurar la cifra 3 de inflamabilidad"],"El 2 inicial indica un gas, el 6 toxicidad y el 8 corrosividad. El cloro (ONU 1017) lleva 265 (gas tóxico y comburente). El 263 corresponde a un gas tóxico e inflamable."],
[8,"Las placas-etiquetas de peligro que se colocan en cisternas y contenedores miden como mínimo:",["250 × 250 mm","100 × 100 mm","400 × 300 mm","150 × 150 mm"],"Las etiquetas de los bultos miden 100 × 100 mm y las placas-etiquetas de vehículos, cisternas y contenedores 250 × 250 mm, ambas en forma de rombo. El panel naranja es rectangular, de 400 × 300 mm."],
[8,"Un vehículo que transporta mercancías peligrosas en bultos (no en cisterna ni a granel), por encima de las cantidades exentas, debe llevar:",["Paneles naranja sin números, uno delante y otro detrás","Paneles naranja con el número de peligro y el número ONU de la materia más peligrosa","Solo etiquetas de peligro de 100 mm en los laterales","Ninguna señalización exterior"],"El panel liso solo avisa de que el vehículo transporta mercancías peligrosas. Para identificar la materia hay que consultar la carta de porte y las etiquetas de los bultos. Las cisternas llevan los paneles con números."],
[8,"En el número de identificación del peligro, la cifra «2» como **primera** cifra indica:",["Emanación de gases por presión o por reacción química","Inflamabilidad de líquidos (vapores) y gases","Materia comburente (favorece el incendio)","Materia corrosiva o con peligro de corrosión"],"Significado de las cifras: 2, gases (por presión o reacción química); 3, inflamabilidad de líquidos o gases; 4, inflamabilidad de sólidos; 5, comburente; 6, toxicidad o peligro de infección; 7, radiactividad; 8, corrosividad; 9, peligro de reacción violenta espontánea."],
[8,"Según el ADR, las instrucciones escritas que deben ir en la cabina del vehículo:",["Las entrega el transportista a la tripulación en un idioma que cada miembro pueda leer y entender, y recogen medidas generales según las etiquetas de peligro","Las redacta el expedidor para cada materia concreta, obligatoriamente en el idioma del país de origen, y se entregan al conductor con la carta de porte","Solo son obligatorias en el transporte en cisternas, y no en bultos, y deben redactarse en todos los idiomas de los países de tránsito","Sustituyen a la carta de porte e identifican la materia concreta transportada mediante su número ONU"],"Desde la reforma del ADR de 2009 son un modelo normalizado de cuatro páginas, organizado por etiquetas de peligro y no por materias. La materia concreta se identifica con la carta de porte."],
[8,"Al acercarse a un accidente con mercancías peligrosas sin identificar, ¿cuál de las siguientes pautas **no** es correcta?",["Acercarse desde la parte baja del terreno para quedar a cubierto de la nube","Acercarse con el viento a la espalda","Acercarse preferiblemente desde una cota superior","Identificar la materia a distancia, con prismáticos, antes de entrar en la zona"],"Muchos gases y vapores son más pesados que el aire y se acumulan en las zonas bajas, así que acercarse por abajo expone a la nube. Lo correcto es llegar con el viento a favor, desde una cota superior y manteniendo distancia hasta identificar el riesgo."],
[8,"En la zonificación de un incidente con mercancías peligrosas, el Puesto de Mando Avanzado se sitúa en:",["La zona base (fría), fuera de las zonas de intervención y de alerta","La zona de intervención, para dirigir directamente las operaciones","La zona de descontaminación","El límite exacto entre la zona de intervención y la de alerta"],"La zona de intervención (caliente) es la de máximo riesgo y solo entra personal con el EPI adecuado. La zona de alerta (templada) incluye el corredor de descontaminación. En la zona base (fría) están el PMA, los recursos y la atención sanitaria."],
[8,"¿Cuál de las siguientes asociaciones entre clase ADR y materia **no** es incorrecta?",["Clase 5.2: peróxidos orgánicos","Clase 6.2: materias tóxicas","Clase 4.2: materias que con el agua desprenden gases inflamables","Clase 9: materias radiactivas"],"La clase 6.1 son las materias tóxicas y la 6.2 las infecciosas. La 4.3 son las materias que con el agua desprenden gases inflamables y la 4.2 las de inflamación espontánea. La clase 7 son las radiactivas y la 9 las materias y objetos peligrosos diversos (por ejemplo, las baterías de litio y las materias peligrosas para el medio ambiente)."],
/* ---------- TEMA 10 · PRIMEROS AUXILIOS Y SVB ---------- */
[9,"Según las recomendaciones ERC 2021 de soporte vital básico en adultos, señale la opción que **no** es incorrecta:",["Compresiones a 100-120 por minuto, con 5-6 cm de profundidad, y relación 30:2","Exactamente 100 compresiones por minuto, 4-5 cm de profundidad y relación 15:2","Entre 120 y 140 compresiones por minuto, 5-6 cm y relación 30:2","Entre 100 y 120 compresiones por minuto, al menos 6-7 cm y relación 30:2"],"Además: dejar que el tórax se reexpanda por completo, reducir al mínimo las interrupciones, insuflaciones de alrededor de 1 segundo y relevar al reanimador cada 2 minutos si es posible. Si no se sabe o no se quiere ventilar, se hacen compresiones continuas."],
[9,"Una víctima inconsciente tiene respiraciones lentas, ruidosas e irregulares (gasping). Lo correcto es:",["Considerar que no respira con normalidad, alertar al 112 e iniciar de inmediato la RCP","Ponerla en posición lateral de seguridad y vigilarla, porque respira por sí sola","Comprobar el pulso carotídeo durante al menos 30 segundos","Dar 5 ventilaciones de rescate antes de hacer nada más"],"Las respiraciones agónicas son frecuentes en los primeros minutos de una parada cardiaca y no deben confundirse con respiración normal. La valoración no debe durar más de 10 segundos. Las 5 ventilaciones iniciales se reservan para niños y ahogados."],
[9,"En el SVB pediátrico (ERC 2021) realizado por personal entrenado, tras comprobar que el niño no respira con normalidad se debe:",["Dar 5 ventilaciones de rescate iniciales y seguir con 15 compresiones por cada 2 ventilaciones","Empezar directamente con 30 compresiones y seguir con 2 ventilaciones por cada 30 compresiones","Dar 2 ventilaciones de rescate iniciales y seguir con 30 compresiones por cada 2 ventilaciones","Dar 5 ventilaciones de rescate iniciales y seguir con compresiones continuas sin pausas para ventilar"],"En los niños la parada suele tener un origen respiratorio, por eso se empieza ventilando. La profundidad es al menos 1/3 del diámetro anteroposterior del tórax: unos 4 cm en lactantes y unos 5 cm en niños."],
[9,"Un lactante consciente tiene una obstrucción grave de la vía aérea por un cuerpo extraño y tos ineficaz. ¿Cuál es la secuencia correcta?",["Alternar 5 golpes en la espalda con 5 compresiones torácicas","Alternar 5 golpes en la espalda con 5 compresiones abdominales","Hacer un barrido digital a ciegas y después compresiones abdominales","Animarle a toser y esperar a que pierda la consciencia antes de actuar"],"En lactantes no se hacen compresiones abdominales por el riesgo de lesionar las vísceras; se usan compresiones torácicas. Los barridos a ciegas están contraindicados. En adultos y niños mayores se alternan 5 golpes interescapulares con 5 compresiones abdominales. Si la víctima pierde la consciencia, se inicia la RCP."],
[9,"La posición lateral de seguridad está indicada en:",["Víctimas inconscientes que respiran con normalidad","Víctimas inconscientes que no respiran, mientras llega el DEA","Víctimas conscientes con dolor torácico","Toda víctima de un traumatismo, sea cual sea su nivel de consciencia"],"La posición lateral de seguridad protege la vía aérea frente a la caída de la lengua y la aspiración de vómito. Hay que comprobar periódicamente que la víctima sigue respirando con normalidad. Si deja de hacerlo, se coloca boca arriba y se inicia la RCP."],
[9,"En el triaje START, una víctima que no camina, respira con 24 respiraciones por minuto, tiene un relleno capilar de 1 segundo y **no** obedece órdenes sencillas, se clasifica como:",["Roja (inmediata)","Amarilla (demorable)","Verde","Negra"],"Secuencia START: si camina, verde. Si no respira tras abrir la vía aérea, negra. Si tiene más de 30 respiraciones por minuto, roja. Si el relleno capilar supera 2 segundos (o no hay pulso radial), roja. Si no obedece órdenes, roja. En otro caso, amarilla. En este caso la víctima supera los dos primeros criterios, pero el estado neurológico la clasifica como roja."],
[9,"En el triaje START, una víctima que no respira y que **tampoco** empieza a respirar al abrirle la vía aérea se etiqueta como:",["Negra (fallecida o expectante)","Roja","Amarilla","Roja, si tiene pulso radial"],"En el triaje de múltiples víctimas no se inicia la RCP, para no comprometer la atención al resto. Si la víctima respira tras abrir la vía aérea, se clasifica como roja."],
[9,"Según la regla de los nueves de Wallace en un adulto, una quemadura en todo el miembro inferior derecho y en la cara anterior del tronco supone aproximadamente:",["36 %","27 %","18 %","45 %"],"Regla de los nueves: cabeza y cuello 9 %; cada miembro superior 9 %; cara anterior del tronco 18 %; cara posterior del tronco 18 %; cada miembro inferior 18 %; genitales 1 %. En este caso, 18 + 18 = 36 %. Para quemaduras dispersas, la palma de la mano del paciente (con los dedos) equivale a cerca del 1 %."],
[9,"Ante una quemadura térmica reciente, las recomendaciones de primeros auxilios del ERC indican:",["Enfriar cuanto antes con agua fría (no helada) durante al menos 20 minutos","Aplicar hielo directamente sobre la lesión para limitar su profundidad","Enfriar con agua y romper las ampollas para evitar la infección","Retirar siempre la ropa quemada, aunque esté pegada a la piel"],"El enfriamiento precoz limita la profundidad de la quemadura y el dolor. El hielo produce vasoconstricción y lesiones por frío. No se rompen las ampollas ni se retira la ropa pegada a la piel. Después se cubre con un apósito limpio, no adherente, o con film transparente. En grandes quemados hay que vigilar la hipotermia."],
[9,"Un paciente abre los ojos al dolor, dice palabras inapropiadas y localiza el dolor. Su puntuación en la escala de Glasgow es:",["10","9","11","8"],"Respuesta ocular al dolor: 2. Respuesta verbal con palabras inapropiadas: 3. Respuesta motora que localiza el dolor: 5. Total: 10. Rango de la escala: 3-15 (ocular 1-4, verbal 1-5, motora 1-6). Una puntuación de 8 o menos indica un coma grave con necesidad de aislar la vía aérea."],
[9,"Una víctima rescatada de un incendio, con sospecha de intoxicación por CO, marca un 98 % en el pulsioxímetro. Señale la conclusión correcta:",["No descarta la intoxicación: el pulsioxímetro convencional no distingue la carboxihemoglobina; debe darse oxígeno al 100 % a alto flujo","El valor descarta una intoxicación significativa, por lo que basta con oxigenoterapia a bajo flujo y observación","El valor indica una intoxicación grave, porque el CO eleva falsamente la saturación por encima del 95 %","Hay que retirar el oxígeno para no enmascarar el diagnóstico hasta disponer de una gasometría arterial"],"La carboxihemoglobina absorbe la luz de forma parecida a la oxihemoglobina, por lo que la saturación aparece falsamente normal. Hacen falta cooximetría o gasometría. El tratamiento es oxígeno a la máxima concentración y, en casos graves, valorar la cámara hiperbárica."],
[9,"Según las recomendaciones de primeros auxilios del ERC 2021, sobre el collarín cervical:",["No se recomienda su uso rutinario por primeros intervinientes; si se sospecha lesión cervical, se limita el movimiento de cabeza y cuello","Debe ponerse siempre a toda víctima de un traumatismo antes de cualquier otra maniobra, incluso por primeros intervinientes","Debe ponerse aunque la víctima esté en parada, antes de iniciar la RCP, para no agravar una posible lesión medular","Solo debe ponerse tras una radiografía que confirme la lesión, para no retrasar el traslado"],"El ERC desaconseja el collarín rutinario por los primeros intervinientes porque no ha demostrado beneficio y puede causar complicaciones. La prioridad es la restricción manual del movimiento y no retrasar maniobras vitales como la RCP."],
[9,"Ante una hemorragia exanguinante en una extremidad que **no** se controla con presión directa, lo recomendado es:",["Poner cuanto antes un torniquete, preferiblemente comercial, por encima de la herida, y anotar la hora","Presionar en puntos arteriales proximales y elevar el miembro 10 minutos antes de valorar el torniquete","Aflojar el torniquete cada 15 minutos","No usar nunca un torniquete por el riesgo de amputación"],"El ERC 2021 ya no recomienda los puntos de presión ni la elevación. El torniquete no se afloja de forma periódica. Puede usarse un agente hemostático junto con la presión directa."],
[9,"Tras administrar una descarga con un DEA en una parada cardiaca presenciada, se debe:",["Reanudar de inmediato la RCP durante 2 minutos, sin comprobar el pulso, hasta que el DEA vuelva a analizar","Comprobar el pulso carotídeo durante 10 segundos y reanudar la RCP solo si no hay pulso","Dar dos descargas más seguidas antes de reanudar la RCP, como en el protocolo de descargas encadenadas","Esperar 1 minuto sin tocar a la víctima para que el corazón recupere un ritmo organizado"],"Cada interrupción de las compresiones reduce la probabilidad de supervivencia. El DEA vuelve a analizar el ritmo cada 2 minutos. Solo se interrumpe la RCP si la víctima muestra signos claros de vida (se despierta, se mueve, abre los ojos o respira con normalidad)."],
/* ---------- TEMA 11 · PROTECCIÓN RESPIRATORIA Y EPI ---------- */
[10,"Un bombero lleva un ERA con una botella de 6,8 L cargada a 300 bar y consume 50 L/min. Sin tener en cuenta la reserva, ¿cuál es su autonomía teórica aproximada?",["Unos 41 minutos","Unos 34 minutos","Unos 27 minutos","Unos 60 minutos"],"Aire disponible: volumen por presión, 6,8 L × 300 bar ≈ 2.040 L de aire libre. Autonomía: 2.040 / 50 ≈ 40,8 minutos. En la realidad es menor, porque el aire no se comporta como un gas ideal a alta presión, hay que reservar aire para salir y el consumo aumenta mucho con el esfuerzo y el estrés."],
[10,"Botella de 6 L a 300 bar. El bombero debe empezar a salir cuando queden 60 bar. Con un consumo medio de 40 L/min, ¿cuánto tiempo de trabajo tiene hasta iniciar la salida?",["36 minutos","45 minutos","30 minutos","24 minutos"],"Aire utilizable hasta iniciar la salida: 6 L × (300 − 60) bar = 1.440 L. Tiempo: 1.440 / 40 = 36 minutos. La opción de 45 minutos usa toda la carga (6 × 300 / 40) e ignora la presión de salida, que es el error típico."],
[10,"La principal ventaja de un ERA de circuito abierto de presión positiva frente a uno de demanda (presión negativa) es que:",["Mantiene dentro de la máscara una presión algo superior a la ambiental, así que ante una pequeña fuga sale aire en vez de entrar contaminante","Consume menos aire en cualquier circunstancia, porque el regulador solo suministra el aire que se inspira","Permite recircular y regenerar el aire espirado, eliminando el CO2 con un cartucho y reponiendo oxígeno","No necesita ajuste ni prueba de estanqueidad de la máscara, porque la sobrepresión compensa cualquier fuga"],"La sobrepresión protege frente a fugas, pero una fuga hace perder aire y reduce la autonomía. Por eso sigue siendo obligatorio ajustar bien la máscara y comprobar su estanqueidad antes de entrar. Regenerar el aire es propio del circuito cerrado."],
[10,"¿Cuál de las siguientes afirmaciones sobre los equipos filtrantes es **falsa**?",["Un filtro combinado ABEK-P3 protege frente al monóxido de carbono en un incendio de interior","No deben usarse en atmósferas con falta de oxígeno","No deben usarse si se desconoce el contaminante o su concentración","El filtro tipo K (verde) está destinado al amoníaco y sus derivados orgánicos"],"Los filtros A, B, E y K no retienen el CO. Además, los equipos filtrantes dependen del aire ambiente: si falta oxígeno o la concentración es desconocida o muy alta, solo sirven los equipos aislantes (ERA). En incendios de interior el ERA es obligatorio."],
[10,"Según la UNE-EN 14387, el filtro de color gris (tipo B) protege frente a:",["Gases y vapores inorgánicos (por ejemplo, cloro, sulfuro de hidrógeno o cianuro de hidrógeno)","Vapores orgánicos con punto de ebullición superior a 65 °C (por ejemplo, disolventes como el tolueno o el xileno)","Dióxido de azufre y otros gases y vapores ácidos (por ejemplo, el cloruro de hidrógeno)","Amoníaco y sus derivados orgánicos amoniacales (por ejemplo, la metilamina)"],"Código de colores: A, marrón (orgánicos con punto de ebullición superior a 65 °C); AX, marrón (orgánicos con punto de ebullición de 65 °C o menos); B, gris (inorgánicos); E, amarillo (SO2 y ácidos); K, verde (amoníaco); P, blanco (partículas). Hg-P3 es rojo y blanco, y NO-P3 azul y blanco."],
[10,"La norma europea con los requisitos de la ropa de protección para bomberos en la lucha contra incendios es la:",["UNE-EN 469","UNE-EN 443","UNE-EN 659","UNE-EN 137"],"La UNE-EN 469 clasifica las prendas por niveles de prestación (Xf, calor por llama; Xr, calor radiante; Y, penetración de agua; Z, resistencia al vapor de agua). La EN 443 trata los cascos, la EN 659 los guantes y la EN 137 los equipos de respiración autónoma de circuito abierto."],
[10,"Un traje de protección química «tipo 1» (UNE-EN 943) se caracteriza por:",["Ser hermético a los gases","Ser hermético a líquidos en forma de chorro, pero no a gases","Proteger de forma limitada frente a salpicaduras","Proteger solo frente a partículas sólidas"],"Tipos de trajes químicos: 1, hermético a gases; 2, no hermético a gases, con presión positiva; 3, hermético a chorros de líquido; 4, hermético a pulverizaciones; 5, frente a partículas; 6, frente a salpicaduras limitadas. El tipo 1 se usa con ERA dentro o fuera del traje según el modelo (1a, 1b, 1c)."],
[10,"En la clasificación operativa habitual de los servicios de bomberos, el nivel III de protección química corresponde a:",["Traje encapsulado hermético a gases, con el ERA dentro","Traje de intervención estructural con ERA","Traje antisalpicaduras con ERA por fuera","Traje de intervención con equipo filtrante"],"Nivel I: traje de intervención con ERA. Nivel II: traje antisalpicaduras con ERA. Nivel III: traje hermético a gases (encapsulado) con el ERA dentro. El nivel se elige según la materia, su estado y su toxicidad o corrosividad."],
[10,"Un equipo de respiración de circuito cerrado se diferencia de uno de circuito abierto en que:",["Recicla el aire espirado, eliminando el CO2 y reponiendo oxígeno, lo que le da más autonomía","Expulsa el aire espirado al exterior por una válvula de exhalación y trabaja siempre en presión positiva","Filtra el aire ambiente con un cartucho multigás, lo que le da autonomía ilimitada","Funciona solo con aire comprimido a 200 bar en lugar de 300, lo que le da más autonomía"],"Los equipos de circuito cerrado (regeneración) pueden dar varias horas de autonomía y se usan en rescates mineros, túneles largos o intervenciones prolongadas. Exhalar al exterior es lo propio del circuito abierto, y filtrar el aire ambiente lo propio de los equipos filtrantes, que no son aislantes."],
[10,"Una botella de 9 L a 200 bar contiene aproximadamente la misma cantidad de aire libre que:",["Una botella de 6 L a 300 bar","Una botella de 6,8 L a 300 bar","Una botella de 4 L a 300 bar","Una botella de 6 L a 200 bar"],"Por la aproximación de Boyle-Mariotte, la cantidad de aire es el volumen por la presión: 9 × 200 = 1.800 y 6 × 300 = 1.800. La botella de 6,8 L a 300 bar da unos 2.040 L, la de 4 L a 300 bar unos 1.200 L y la de 6 L a 200 bar unos 1.200 L."],
[10,"¿Cuál de las siguientes asociaciones entre norma y EPI **no** es incorrecta?",["UNE-EN 15090: calzado para bomberos","UNE-EN 443: guantes para bomberos","UNE-EN 659: cascos para la extinción en edificios","UNE-EN 137: trajes de protección química"],"UNE-EN 443: cascos. UNE-EN 659: guantes. UNE-EN 15090: calzado. UNE-EN 13911: capuchas o verdugos. UNE-EN 137: ERA de circuito abierto. UNE-EN 136: máscaras completas. UNE-EN 943: trajes de protección química."],
[10,"La norma que regula la capucha (verdugo) de protección para bomberos es la:",["UNE-EN 13911","UNE-EN 136","UNE-EN 15090","UNE-EN 1486"],"La capucha protege el cuello, las orejas y las zonas de la cara que no cubre la máscara frente a la llama y el calor. La EN 136 trata las máscaras completas, la EN 15090 el calzado y la EN 1486 los trajes reflectantes para la lucha contra incendios especializada."],
[10,"La finalidad principal del control de entrada de equipos de respiración autónoma (tablero de control) en una intervención es:",["Registrar quién entra, cuándo y con qué presión, y calcular la hora prevista de salida para activar, si hace falta, el rescate","Medir de forma continua la concentración de CO y de oxígeno en el interior del recinto, para decidir la retirada","Registrar la posición de cada bombero en el interior mediante telemetría, para sustituir la comunicación por radio","Controlar el consumo de agua de las lanzas de cada equipo, para coordinar el abastecimiento desde el exterior"],"El control de entrada permite saber en todo momento quién está dentro y cuánto aire le queda, y detectar a tiempo un retraso en la salida para activar el equipo de intervención rápida."],
[10,"¿En cuál de las siguientes situaciones **no** sería admisible sustituir el ERA por un equipo filtrante?",["Inspeccionar un pozo de saneamiento con una atmósfera desconocida","Desescombrar al aire libre con polvo de yeso, con oxígeno normal y sin gases","Exponerse a vapores conocidos de un disolvente orgánico en baja concentración, al aire libre y con oxígeno suficiente","Manipular materiales que desprenden fibras o polvo en el exterior, sin gases y con oxígeno normal"],"Un pozo de saneamiento es un espacio confinado típico: puede faltar oxígeno o haber H2S, CO, CH4 u otros gases. Si la atmósfera es desconocida, el ERA es obligatorio. Las otras situaciones cumplen las condiciones del equipo filtrante: oxígeno suficiente y un contaminante conocido, en concentración limitada y retenible por el filtro."],
/* ---------- TEMA 12 · RIESGO ELÉCTRICO Y VEHÍCULOS ---------- */
[11,"Según el Anexo II del RD 614/2001, el orden correcto de las cinco reglas de oro para dejar una instalación sin tensión es:",["Desconectar; evitar la realimentación; verificar la ausencia de tensión; poner a tierra y en cortocircuito; proteger frente a los elementos próximos en tensión y señalizar","Desconectar; verificar la ausencia de tensión; evitar la realimentación; poner a tierra y en cortocircuito; proteger frente a los elementos próximos en tensión y señalizar","Desconectar; poner a tierra y en cortocircuito; verificar la ausencia de tensión; evitar la realimentación; proteger frente a los elementos próximos en tensión y señalizar","Proteger frente a los elementos próximos en tensión y señalizar; desconectar; evitar la realimentación; poner a tierra y en cortocircuito; verificar la ausencia de tensión"],"El orden importa: verificar la ausencia de tensión antes de poner a tierra evita cortocircuitar una instalación todavía en tensión, y evitar la realimentación (bloqueo y señalización de los mandos) antes de verificar asegura que nadie vuelva a conectar. Para volver a dar tensión se sigue el orden inverso."],
[11,"En un accidente eléctrico, el factor que determina **fundamentalmente** la gravedad de los efectos sobre el organismo es:",["La intensidad de la corriente que atraviesa el cuerpo y el tiempo que dura su paso","La tensión nominal de la instalación, sea cual sea la intensidad","La potencia contratada de la instalación","La frecuencia: las altas frecuencias (más de 10 kHz) son más peligrosas que las de 50 Hz"],"Lo que daña es la corriente, según la ley de Ohm (I = V/R): la tensión solo influye a través de ella. También influyen el recorrido por el cuerpo, la resistencia del cuerpo y la frecuencia. Las frecuencias industriales de 50-60 Hz son las más peligrosas para el corazón."],
[11,"En corriente alterna de 50 Hz, el umbral a partir del cual la contracción muscular puede impedir soltar el conductor («umbral de no soltar») está en torno a:",["10 mA","0,5 mA","50 A","1 µA"],"Valores orientativos: umbral de percepción, unos 0,5 mA; umbral de no soltar (tetanización), unos 10 mA; riesgo de fibrilación ventricular a partir de unos 30-50 mA, según el tiempo de exposición. Por eso los diferenciales de alta sensibilidad son de 30 mA."],
[11,"Según el REBT, la tensión de seguridad que se admite con carácter general en emplazamientos húmedos es de:",["24 V","50 V","12 V","110 V"],"Como tensión de contacto límite convencional se toman 50 V en emplazamientos secos y 24 V en húmedos. En emplazamientos sumergidos o especialmente conductores se exigen tensiones todavía menores (por ejemplo, 12 V)."],
[11,"Según el Reglamento Electrotécnico para Baja Tensión, se considera baja tensión la de valor nominal:",["Igual o inferior a 1.000 V en corriente alterna y a 1.500 V en corriente continua","Inferior a 380 V en corriente alterna y a 500 V en corriente continua","Igual o inferior a 1.500 V en corriente alterna y a 1.000 V en corriente continua","Igual o inferior a 50 V en corriente alterna y a 120 V en corriente continua"],"Los valores de alterna y continua se intercambian a menudo en los exámenes. Por encima de esos límites se trata de alta tensión, con su propia reglamentación de líneas y subestaciones."],
[11,"El interruptor diferencial de alta sensibilidad (30 mA) protege principalmente frente a:",["Los contactos indirectos y, como medida complementaria, los contactos directos","Las sobrecargas y los cortocircuitos de los circuitos que protege","Las sobretensiones transitorias de origen atmosférico o de maniobra","Únicamente los contactos directos, y nunca los indirectos"],"El diferencial detecta la diferencia entre la corriente que entra y la que sale, es decir, una fuga a tierra, y corta la corriente. El magnetotérmico protege la instalación frente a sobrecargas y cortocircuitos, no a las personas. Las sobretensiones se protegen con limitadores o descargadores."],
[11,"Con un conductor de alta tensión caído en el suelo, la diferencia de potencial que puede aparecer entre los pies de una persona que se acerca se llama:",["Tensión de paso","Tensión de contacto","Tensión de defecto","Tensión de cortocircuito"],"Alrededor del punto de contacto con el suelo se forma un gradiente de potencial. Si hay que moverse en esa zona, se hace con pasos muy cortos o con los pies juntos, y se mantiene una distancia de seguridad hasta que la compañía eléctrica confirme el corte. La tensión de contacto es la que aparece entre la mano y los pies al tocar una masa en tensión."],
[11,"Según el RD 614/2001, los trabajos en tensión deben realizarlos:",["Trabajadores cualificados, siguiendo un procedimiento estudiado previamente","Cualquier trabajador autorizado, sin necesidad de cualificación","Solo el jefe de la instalación","Cualquier trabajador que lleve guantes aislantes"],"El RD 614/2001 distingue al trabajador autorizado (con formación para ciertos trabajos sin tensión o en proximidad) del cualificado (con conocimientos especializados en instalaciones eléctricas). Los trabajos en tensión exigen trabajadores cualificados y, en alta tensión, además autorizados por escrito."],
[11,"En una intervención en un vehículo eléctrico o híbrido, los cables del sistema de alta tensión se identifican normalmente por su color:",["Naranja","Azul","Amarillo y verde","Rojo"],"El color naranja señala los componentes de alta tensión (normalmente de varios cientos de voltios en corriente continua). Nunca deben cortarse ni manipularse. La ficha de rescate del modelo indica dónde están la batería, los cables y los puntos de corte."],
[11,"Sobre el incendio de una batería de iones de litio de tracción, señale la afirmación que **no** es incorrecta:",["Puede producirse un embalamiento térmico con reignición horas o incluso días después, y su control suele exigir grandes cantidades de agua para refrigerar","Debe apagarse con poca agua, preferentemente con polvo ABC, porque el litio metálico de la batería reacciona violentamente con ella","Una vez apagadas las llamas visibles, desaparece el riesgo de reignición y no hace falta vigilar con cámara térmica","Los gases que emite son vapor de agua y CO2 inocuos, así que basta con mantener la distancia y no hace falta ERA"],"Las baterías de iones de litio no contienen apenas litio metálico. La estrategia habitual es refrigerar con mucha agua, controlar la temperatura con cámara térmica y vigilar después del incendio. Los gases son tóxicos e inflamables (incluido el fluoruro de hidrógeno), por lo que el ERA es imprescindible."],
[11,"En la extinción de un incendio en una instalación eléctrica de baja tensión que **no** se ha podido desconectar, ¿cuál de los siguientes agentes sería el **menos** adecuado?",["Agua a chorro sólido","CO2","Polvo químico","Agente limpio gaseoso"],"El chorro sólido forma una columna continua de agua conductora entre la lanza y el elemento en tensión. Los agentes no conductores (CO2, polvo y agentes limpios) son los adecuados. El agua pulverizada solo puede usarse respetando las distancias y tensiones máximas que indique el fabricante del equipo."],
[11,"El interruptor magnetotérmico protege la instalación frente a:",["Las sobrecargas (parte térmica) y los cortocircuitos (parte magnética)","Las sobrecargas (parte magnética) y los cortocircuitos (parte térmica)","Los contactos indirectos","Las fugas a tierra de 30 mA"],"La parte térmica (bimetal) actúa con retardo ante sobreintensidades moderadas y mantenidas. La parte magnética (bobina) actúa al instante ante las intensidades muy altas de un cortocircuito. La protección de las personas frente a fugas corresponde al diferencial."],
[11,"Una persona con una resistencia corporal de 1.000 Ω toca un conductor a 230 V estando bien conectada a tierra. La intensidad que la atravesaría sería del orden de:",["230 mA, muy por encima del umbral de fibrilación ventricular","23 mA, por debajo del umbral de no soltar","2,3 mA, perceptible pero sin efectos peligrosos","2,3 A, típica de un cortocircuito franco"],"Por la ley de Ohm: I = 230 V / 1.000 Ω = 0,23 A = 230 mA. Es un valor potencialmente mortal. Además, 23 mA ya superarían el umbral de no soltar (unos 10 mA), así que esa opción contiene dos errores."],
[11,"Ante un vehículo híbrido accidentado, ¿cuál de las siguientes medidas iniciales **no** es correcta?",["Dar el vehículo por apagado si no se oye el motor, porque el sistema de alta tensión solo funciona con el motor térmico en marcha","Calzar el vehículo y accionar el freno de estacionamiento","Desconectar el encendido (modo «ready») y alejar la llave inteligente","Consultar la ficha de rescate del modelo para localizar los componentes de alta tensión y los puntos de corte"],"Un híbrido o eléctrico puede estar en modo «ready» en silencio y moverse o mantener la alta tensión activa. Por eso hay que inmovilizarlo, desconectarlo, alejar la llave más allá de su alcance y localizar en la ficha de rescate los puntos de corte."],
];

/* ===== MOTOR DE LA APLICACIÓN ===== */
(function(){
var N_FINAL=60, L="ABCD";
var S=null, timer=null, deep=false, skipPop=false, cur="menu";
function $(id){return document.getElementById(id)}
var store={
  get:function(k,d){try{var v=localStorage.getItem("tb_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem("tb_"+k,JSON.stringify(v))}catch(e){}}
};
function rnd(n){if(window.crypto&&crypto.getRandomValues){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
function num(x,d){return x.toFixed(d==null?2:d).replace(".",",")}
function mmss(ms){var s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function byTopic(t){return Q.filter(function(q){return q[0]===t})}

/* --- navegación (el botón «atrás» del móvil vuelve al menú) --- */
function show(id){["menu","temas","quiz","res"].forEach(function(x){$(x).hidden=x!==id});cur=id;window.scrollTo(0,0)}
function go(id){
  if(id==="menu"){stopTimer();show("menu");renderMenu();if(deep){deep=false;skipPop=true;history.back()}return}
  show(id);
  if(!deep){try{history.pushState({tb:1},"");deep=true}catch(e){}}
}
function inProgress(){return cur==="quiz"&&S&&!S.done&&S.items.some(function(x){return x.res})}
window.addEventListener("popstate",function(){
  if(skipPop){skipPop=false;return}
  if(inProgress()&&!confirm("¿Salir del test? Se perderá el progreso.")){try{history.pushState({tb:1},"")}catch(e){}return}
  deep=false;stopTimer();show("menu");renderMenu();
});

/* --- menú y temas --- */
function renderMenu(){
  $("meta").textContent=Q.length+" preguntas · "+T.length+" temas";
  $("pen").checked=store.get("pen",true);
  var f=store.get("hist",{}).final;
  $("hist").textContent=f?("Test definitivo: "+f.n+(f.n>1?" intentos":" intento")+" · última nota "+num(f.last)+" · mejor "+num(f.best)):"";
}
function renderTemas(){
  var h=store.get("hist",{});
  $("tlist").innerHTML=T.map(function(t,i){
    var b=h["t"+i];
    return '<button type="button" class="big topic" data-t="'+i+'"><span><b>'+(i+1)+". "+esc(t[0])+"</b><br><span>"+esc(t[1])+(b?" · mejor nota "+num(b.best,1):"")+'</span></span><span class="n">'+byTopic(i).length+"</span></button>";
  }).join("");
}

/* --- generación aleatoria de tests --- */
function makeItems(src){
  return src.map(function(q){
    return{src:q,t:q[0],q:q[1],exp:q[3],res:null,pick:-1,
      opts:shuffle(q[2].map(function(x,i){return{x:x,ok:i===0}}))};
  });
}
function start(cfg,src){
  S={mode:cfg.mode,label:cfg.label,items:makeItems(src),i:0,t0:Date.now(),done:false};
  go("quiz");startTimer();renderQ();
}
function startTopic(t){start({mode:"t"+t,label:T[t][0]},shuffle(byTopic(t).slice()))}
function startFinal(){
  var pools=T.map(function(_,i){return shuffle(byTopic(i).slice())});
  var per=Math.floor(N_FINAL/T.length), pick=[];
  pools.forEach(function(p){pick=pick.concat(p.splice(0,per))});
  var rest=shuffle([].concat.apply([],pools));
  while(pick.length<N_FINAL&&rest.length)pick.push(rest.pop());
  start({mode:"final",label:"Test definitivo"},shuffle(pick));
}
function startReview(src){start({mode:"review",label:"Repaso de falladas"},shuffle(src.slice()))}

/* --- pregunta --- */
function renderQ(){
  var it=S.items[S.i], n=S.items.length;
  $("qCount").textContent=(S.i+1)+" / "+n;
  $("qProg").style.width=(S.i/n*100)+"%";
  $("qTopic").textContent=T[it.t][0];
  $("qText").innerHTML=fmt(it.q);
  $("qOpts").innerHTML=it.opts.map(function(o,k){
    return '<button type="button" class="opt" data-k="'+k+'"><span class="l">'+L[k]+"</span><span>"+fmt(o.x)+"</span></button>";
  }).join("");
  $("qFb").innerHTML="";$("qNext").hidden=true;$("qBlank").hidden=false;
  window.scrollTo(0,0);
}
function answer(k){
  var it=S.items[S.i];if(it.res)return;
  var okIdx=it.opts.findIndex(function(o){return o.ok});
  it.pick=k;it.res=k<0?"bl":(k===okIdx?"ok":"ko");
  Array.prototype.forEach.call($("qOpts").children,function(b,j){
    b.disabled=true;b.classList.add(j===okIdx?"ok":(j===k?"ko":"dim"));
  });
  var head=it.res==="ok"?"✔ Correcto":(it.res==="ko"?"✘ Incorrecto · la correcta es la "+L[okIdx]:"— En blanco · la correcta es la "+L[okIdx]);
  $("qFb").innerHTML='<div class="fb '+it.res+'"><h3>'+head+"</h3><p>"+fmt(it.exp)+"</p></div>";
  $("qBlank").hidden=true;
  var nx=$("qNext");nx.hidden=false;nx.textContent=S.i===S.items.length-1?"Ver resultados":"Siguiente →";
  $("qProg").style.width=((S.i+1)/S.items.length*100)+"%";
  setTimeout(function(){
    var r=$("qFb").getBoundingClientRect(), need=r.bottom+90-window.innerHeight;
    if(need>0)window.scrollBy({top:Math.min(need,r.top-70),behavior:"smooth"});
    try{nx.focus({preventScroll:true})}catch(e){}
  },40);
}
function next(){if(!S||!S.items[S.i].res)return;if(S.i<S.items.length-1){S.i++;renderQ()}else finish()}

/* --- resultados --- */
function finish(){
  S.done=true;stopTimer();
  var ms=Date.now()-S.t0, n=S.items.length, c={ok:0,ko:0,bl:0}, by={};
  S.items.forEach(function(it){c[it.res]++;var b=by[it.t]||(by[it.t]={ok:0,ko:0,bl:0,n:0});b[it.res]++;b.n++});
  var pen=store.get("pen",true);
  var notaPen=Math.max(0,c.ok-c.ko/3)/n*10, notaRaw=c.ok/n*10, nota=pen?notaPen:notaRaw;
  if(S.mode!=="review"){
    var h=store.get("hist",{}), e=h[S.mode]||{n:0,best:0,last:0};
    e.n++;e.last=nota;e.best=Math.max(e.best,nota);h[S.mode]=e;store.set("hist",h);
  }
  var pass=nota>=5, fails=S.items.filter(function(x){return x.res!=="ok"});
  var html='<div class="card score"><div class="lbl">'+esc(S.label)+'</div><div class="nota">'+num(nota)+'<small> / 10</small></div>'+
    '<span class="verdict '+(pass?"pass":"fail")+'">'+(pass?"APTO":"NO APTO")+"</span>"+
    '<div class="det">'+(pen?"Con penalización (−1/3 por error) · sin penalizar: "+num(notaRaw):"Sin penalización · penalizando: "+num(notaPen))+"<br>"+
    Math.round(c.ok/n*100)+" % de aciertos · Tiempo "+mmss(ms)+"</div></div>"+
    '<div class="grid3"><div class="card kpi"><b class="c-ok">'+c.ok+'</b><span>Aciertos</span></div><div class="card kpi"><b class="c-ko">'+c.ko+'</b><span>Fallos</span></div><div class="card kpi"><b class="c-bl">'+c.bl+"</b><span>En blanco</span></div></div>";
  var keys=Object.keys(by);
  if(keys.length>1){
    html+='<div class="card pad"><h2>Desglose por tema</h2><table class="tbl">'+keys.sort(function(a,b){return a-b}).map(function(k){
      var b=by[k], p=b.ok/b.n, col=p>=.7?"var(--ok)":(p>=.5?"var(--bl)":"var(--ko)");
      return "<tr><td>"+esc(T[k][0])+'</td><td class="r">'+b.ok+"/"+b.n+'<span class="mini"><i style="width:'+Math.round(p*100)+"%;background:"+col+'"></i></span></td></tr>';
    }).join("")+"</table></div>";
  }
  html+='<div class="actions"><button type="button" class="btn primary" id="rAgain">Repetir test</button>'+
    (fails.length?'<button type="button" class="btn" id="rFails">Repasar falladas ('+fails.length+")</button>":"")+
    '<button type="button" class="btn ghost" id="rMenu">Menú principal</button></div>';
  if(fails.length){
    html+='<details class="card rev"><summary>Revisar fallos y preguntas en blanco ('+fails.length+")</summary>"+fails.map(function(it){
      var okIdx=it.opts.findIndex(function(o){return o.ok});
      return '<div class="rq"><p><b>'+fmt(it.q)+"</b></p>"+
        (it.pick>=0?'<p class="c-ko">✘ Tu respuesta: '+L[it.pick]+") "+fmt(it.opts[it.pick].x)+"</p>":'<p class="c-bl">— En blanco</p>')+
        '<p class="c-ok">✔ Correcta: '+L[okIdx]+") "+fmt(it.opts[okIdx].x)+'</p><p class="e">'+fmt(it.exp)+"</p></div>";
    }).join("")+"</details>";
  }
  $("res").innerHTML=html;
  var mode=S.mode, src=S.items.map(function(x){return x.src}), fsrc=fails.map(function(x){return x.src});
  $("rAgain").onclick=function(){mode==="final"?startFinal():(mode==="review"?startReview(src):startTopic(+mode.slice(1)))};
  if(fails.length)$("rFails").onclick=function(){startReview(fsrc)};
  $("rMenu").onclick=function(){go("menu")};
  show("res");
}

/* --- temporizador --- */
function startTimer(){stopTimer();var el=$("qTime"),tick=function(){el.textContent="⏱ "+mmss(Date.now()-S.t0)};tick();timer=setInterval(tick,1000)}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}

/* --- eventos --- */
$("bFinal").onclick=startFinal;
$("bTemas").onclick=function(){renderTemas();go("temas")};
$("pen").onchange=function(){store.set("pen",this.checked)};
document.querySelector("[data-home]").onclick=function(){go("menu")};
$("tlist").onclick=function(e){var b=e.target.closest("[data-t]");if(b)startTopic(+b.getAttribute("data-t"))};
$("qOpts").onclick=function(e){var b=e.target.closest(".opt");if(b&&!b.disabled)answer(+b.getAttribute("data-k"))};
$("qBlank").onclick=function(){answer(-1)};
$("qNext").onclick=next;
$("qExit").onclick=function(){if(inProgress()&&!confirm("¿Salir del test? Se perderá el progreso."))return;go("menu")};
document.addEventListener("keydown",function(e){
  if(cur!=="quiz"||!S||e.altKey||e.ctrlKey||e.metaKey)return;
  var it=S.items[S.i], k=e.key.length===1?e.key.toLowerCase():"";
  var idx=k?("1234".indexOf(k)>=0?"1234".indexOf(k):"abcd".indexOf(k)):-1;
  if(!it.res&&idx>=0){answer(idx);e.preventDefault();return}
  if(it.res&&(e.key==="Enter"||e.key==="ArrowRight")){
    if(e.key==="Enter"&&e.target&&e.target.tagName==="BUTTON")return;
    next();e.preventDefault();
  }
});

/* --- comprobación de integridad del banco --- */
Q.forEach(function(q,i){if(q.length!==4||q[2].length!==4||!T[q[0]])console.warn("Pregunta mal formada #"+i,q)});
renderMenu();
})();
</script>
